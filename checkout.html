<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CartPrime</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/emailjs/dist/email.min.js"></script>

    <style>
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background-color: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qty-btn:hover {
            background-color: #cbd5e1;
        }
        .prod-item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .prod-item-row img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .total-checkout-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px dashed #cbd5e1;
            font-weight: 800;
            font-size: 1.05rem;
            color: #0f172a;
        }
        .swal-custom-popup {
            border-radius: 16px !important;
        }
        .swal-custom-title {
            font-size: 1.15rem !important;
            font-weight: 700 !important;
        }
        .swal-custom-confirm {
            background-color: #2563eb !important;
            border-radius: 8px !important;
            padding: 8px 20px !important;
        }
        .swal-custom-cancel {
            border-radius: 8px !important;
            padding: 8px 20px !important;
        }
        .input-style {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.6rem 0.8rem;
            font-size: 0.875rem;
            font-weight: 500;
            width: 100%;
            transition: all 0.2s;
        }
        .input-style:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Loading Screen -->
    <div id="pageLoader" class="fixed inset-0 bg-white z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="flex flex-col items-center gap-3">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600"></i>
            <span class="text-sm font-semibold text-slate-600">Loading Checkout...</span>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-slate-600 hover:text-slate-900 transition-colors p-1">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-blue-600"></i>
                <h1 class="text-base font-bold text-slate-800">Secure Checkout</h1>
            </div>
            <div class="w-5"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-4 space-y-4">

        <!-- Trust Guarantee Banner -->
        <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 flex items-center justify-around text-center text-xs font-semibold text-blue-900">
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-blue-600"></i>
                <span>100% Secure</span>
            </div>
            <div class="h-4 w-[1px] bg-blue-200"></div>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-truck-fast text-blue-600"></i>
                <span>Fast Delivery</span>
            </div>
            <div class="h-4 w-[1px] bg-blue-200"></div>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left text-blue-600"></i>
                <span>Easy Returns</span>
            </div>
        </div>

        <!-- Product Preview Card -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-cart-shopping text-slate-400"></i>
                Order Summary
            </h2>
            <div id="productPreview">
                <!-- Dynamic Content via JS -->
            </div>
        </div>

        <!-- Address & Customer Details Form -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-location-dot text-slate-400"></i>
                    Delivery Address
                </h2>
                <button type="button" onclick="getCurrentLocation()" class="text-xs font-bold text-blue-600 hover:text-blue-700 flex items-center gap-1.5 bg-blue-50 px-2.5 py-1.5 rounded-lg border border-blue-100 transition-colors">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    <span id="locBtnText">Use Current Location</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Full Name *</label>
                    <input type="text" id="custName" placeholder="Enter your full name" class="input-style">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Mobile Number *</label>
                    <input type="tel" id="custPhone" placeholder="10-digit mobile number" maxlength="10" class="input-style">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">House / Flat / Building *</label>
                    <input type="text" id="house" placeholder="House No, Building Name" class="input-style">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Street / Area / Locality</label>
                    <input type="text" id="area" placeholder="Area, Landmark" class="input-style">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">City / Town *</label>
                    <input type="text" id="city" placeholder="City" class="input-style">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">State *</label>
                    <select id="state" class="input-style">
                        <option value="">Select State</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pincode *</label>
                    <input type="text" id="pincode" placeholder="6-digit Pincode" maxlength="6" class="input-style">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Country</label>
                <input type="text" id="country" value="India" readonly class="input-style bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>
        </div>

        <!-- Payment Option -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-credit-card text-slate-400"></i>
                Payment Method
            </h2>
            <div class="flex items-center justify-between p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                        <i class="fa-solid fa-hand-holding-dollar text-lg"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-emerald-950">Cash on Delivery (COD)</p>
                        <p class="text-[11px] font-medium text-emerald-700">Pay cash when product arrives at door</p>
                    </div>
                </div>
                <i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i>
            </div>
        </div>

        <!-- Trust Indicators Footer Badges -->
        <div class="grid grid-cols-2 gap-3 pt-1">
            <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center gap-2.5 shadow-xs">
                <i class="fa-solid fa-shield-heart text-blue-600 text-lg"></i>
                <div>
                    <p class="text-[11px] font-bold text-slate-800">Buyer Protection</p>
                    <p class="text-[9px] text-slate-500">Full refund if damaged</p>
                </div>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center gap-2.5 shadow-xs">
                <i class="fa-solid fa-headset text-blue-600 text-lg"></i>
                <div>
                    <p class="text-[11px] font-bold text-slate-800">24/7 Support</p>
                    <p class="text-[9px] text-slate-500">Dedicated assistance</p>
                </div>
            </div>
        </div>

        <!-- Place Order Button -->
        <button onclick="placeOrder()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 text-base mt-2">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Confirm Order (COD)</span>
        </button>

    </main>

    <!-- JavaScript & Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const EMAILJS_PUBLIC_KEY = "v9Kubn2pDJOSM8iL8";

        if (typeof emailjs !== 'undefined') {
            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc",
            authDomain: "cartprime-shopping.firebaseapp.com",
            projectId: "cartprime-shopping",
            storageBucket: "cartprime-shopping.firebasestorage.app",
            messagingSenderId: "570068438689",
            appId: "1:570068438689:web:17b25f49f2b561fd29eae0",
            measurementId: "G-9GREWHMEYL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- UPDATED REFERRAL STATUS CALCULATOR LOGIC ---
        window.getCalculatedReferralStatus = function(order) {
            if (!order) return "Pending";

            // If manual override exists (e.g., Cancelled / Refunded)
            if (order.referralStatus && (order.referralStatus === "Cancelled" || order.referralStatus === "Refunded")) {
                return order.referralStatus;
            }

            // Order Status Delivered aakatha samayathu status "Pending" aayirikkum
            if (order.status !== "Delivered") {
                return "Pending";
            }

            // Check if return policy exists
            const hasReturn = order.isReturnable === true || order.returnPolicy === true || order.returnPolicy === "7 Days Return Policy";

            // RULE 1: Return policy ILLATHA product -> Delivered aakubol "Completed" aakum
            if (!hasReturn) {
                return "Completed";
            }

            // RULE 2: Return policy ULLA product -> Delivered aayaalum return period kazhiyunna date aayale "Completed" aaku
            if (order.returnEligibleUntil) {
                const now = new Date();
                const expiryDate = new Date(order.returnEligibleUntil);
                if (now >= expiryDate) {
                    return "Completed";
                }
            }

            return "Pending";
        };

        // --- 1. URL REFERRAL CODE DETECTION & LOCALSTORAGE SAVING ---
        const urlParams = new URLSearchParams(window.location.search);
        const refFromUrl = urlParams.get('ref') || urlParams.get('referredBy');
        const commFromUrl = urlParams.get('comm') || urlParams.get('commission');

        if (refFromUrl) {
            localStorage.setItem('referredBy', refFromUrl);
        }
        if (commFromUrl) {
            localStorage.setItem('commissionAmount', commFromUrl);
        }

        let orderInfo = JSON.parse(localStorage.getItem('pendingOrder')) || {};
        let currentUserId = null;
        let currentUserEmail = null; 

        // Delivery Date set to Order Date (Today)
        const getDeliveryDateStr = () => {
            const today = new Date();
            return today.toISOString().split('T')[0];
        };

        // Helper function for cleaning price string to safe Float number
        const parsePrice = (priceStr) => {
            if (!priceStr) return 0;
            const cleaned = priceStr.toString().replace(/[^0-9.]/g, '');
            return parseFloat(cleaned) || 0;
        };

        const showAlert = (title, text, icon) => {
            Swal.fire({
                title: title, text: text, icon: icon,
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
            });
        };

        // --- CURRENT LOCATION (GPS) AUTO-FILL LOGIC ---
        window.getCurrentLocation = function() {
            const locBtnText = document.getElementById('locBtnText');
            
            if (!navigator.geolocation) {
                showAlert('Not Supported', 'Geolocation is not supported by your browser.', 'error');
                return;
            }

            locBtnText.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Fetching...`;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                        const data = await response.json();

                        if (data && data.address) {
                            const addr = data.address;
                            
                            if (addr.postcode) {
                                document.getElementById('pincode').value = addr.postcode.replace(/\s+/g, '').slice(0, 6);
                            }

                            const city = addr.city || addr.town || addr.village || addr.suburb || addr.county || "";
                            document.getElementById('city').value = city;

                            const localArea = [addr.road, addr.neighbourhood, addr.suburb].filter(Boolean).join(", ");
                            document.getElementById('area').value = localArea || city;

                            if (addr.state) {
                                const stateSelect = document.getElementById('state');
                                let apiState = addr.state.toLowerCase().replace(/^state of\s+/i, '').trim();

                                const matchingOption = Array.from(stateSelect.options).find(opt => {
                                    let optVal = opt.value.toLowerCase().trim();
                                    if (!optVal) return false;
                                    return optVal === apiState || apiState.includes(optVal) || optVal.includes(apiState);
                                });

                                if (matchingOption) {
                                    stateSelect.value = matchingOption.value;
                                }
                            }

                            showAlert('Success', 'Address details loaded from current location!', 'success');
                        } else {
                            showAlert('Warning', 'Could not detect complete address details.', 'warning');
                        }
                    } catch (err) {
                        showAlert('Error', 'Failed to fetch location address. Please enter manually.', 'error');
                    } finally {
                        locBtnText.textContent = "Use Current Location";
                    }
                },
                (error) => {
                    locBtnText.textContent = "Use Current Location";
                    let msg = "Unable to retrieve location.";
                    if (error.code === error.PERMISSION_DENIED) msg = "Location access denied. Please allow location access in browser settings.";
                    showAlert('Location Error', msg, 'error');
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                currentUserEmail = user.email; 
            }
        });

        window.changeQuantity = (index, delta) => {
            if (!orderInfo) return;

            if (orderInfo.orderType === "Cart" && Array.isArray(orderInfo.items)) {
                let currentQty = parseInt(orderInfo.items[index].quantity) || 1;
                let newQty = currentQty + delta;
                if (newQty < 1) newQty = 1;
                orderInfo.items[index].quantity = newQty;
            } else {
                let currentQty = parseInt(orderInfo.quantity) || 1;
                let newQty = currentQty + delta;
                if (newQty < 1) newQty = 1;
                orderInfo.quantity = newQty;
            }

            localStorage.setItem('pendingOrder', JSON.stringify(orderInfo));
            renderOrderPreview();
        };

        function renderOrderPreview() {
            if (!orderInfo || Object.keys(orderInfo).length === 0) {
                location.href = 'index.html';
                return;
            }

            let previewHtml = "";
            let finalPriceToPay = 0;

            if (orderInfo.orderType === "Cart" && Array.isArray(orderInfo.items)) {
                orderInfo.items.forEach((item, idx) => {
                    let productImg = item.image || (item.images && item.images[0]) || "https://via.placeholder.com/150";
                    let unitPrice = parsePrice(item.price);
                    let qty = parseInt(item.quantity) || 1;
                    let itemTotal = unitPrice * qty;
                    let itemSize = item.selectedSize || item.size || 'N/A';
                    
                    finalPriceToPay += itemTotal;

                    previewHtml += `
                    <div class="prod-item-row">
                        <img src="${productImg}" alt="Product">
                        <div class="prod-item-details" style="flex: 1; min-width: 0;">
                            <p style="font-weight: 700; font-size: 0.95rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.name || item.title}</p>
                            <p style="color: #64748b; font-size: 0.82rem; font-weight: 600; margin-top: 2px;">
                                Size: <span style="color: #000; font-weight: 800;">${itemSize}</span>
                            </p>
                            <p style="color: #000; font-weight: 800; font-size: 0.9rem; margin-top: 2px;">₹${itemTotal.toLocaleString('en-IN')}</p>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                            <button onclick="changeQuantity(${idx}, -1)" class="qty-btn">-</button>
                            <span class="font-bold text-sm px-1 text-slate-800">${qty}</span>
                            <button onclick="changeQuantity(${idx}, 1)" class="qty-btn">+</button>
                        </div>
                    </div>`;
                });
                
                previewHtml += `
                <div class="space-y-2 mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-600">
                    <div class="flex justify-between"><span>Subtotal:</span><span>₹${finalPriceToPay.toLocaleString('en-IN')}</span></div>
                    <div class="flex justify-between text-emerald-600"><span>Delivery Charge:</span><span class="font-bold uppercase">FREE</span></div>
                </div>
                <div class="total-checkout-price"><span>Total Payable:</span><span class="text-blue-600">₹${finalPriceToPay.toLocaleString('en-IN')}</span></div>`;
            } else {
                let unitPrice = parsePrice(orderInfo.price);
                let qty = parseInt(orderInfo.quantity) || 1;
                let itemSize = orderInfo.selectedSize || 'N/A';
                finalPriceToPay = unitPrice * qty;

                previewHtml = `
                <div class="prod-item-row">
                    <img src="${orderInfo.productImage}" alt="Product">
                    <div class="prod-item-details" style="flex: 1; min-width: 0;">
                        <p style="font-weight: 700; font-size: 0.95rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${orderInfo.productName}</p>
                        <p style="color: #64748b; font-size: 0.82rem; font-weight: 600; margin-top: 2px;">
                            Size: <span style="color: #000; font-weight: 800;">${itemSize}</span>
                        </p>
                        <p style="color: #000; font-weight: 800; font-size: 0.95rem; margin-top: 4px;">₹${finalPriceToPay.toLocaleString('en-IN')}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                        <button onclick="changeQuantity(0, -1)" class="qty-btn">-</button>
                        <span class="font-bold text-sm px-1 text-slate-800">${qty}</span>
                        <button onclick="changeQuantity(0, 1)" class="qty-btn">+</button>
                    </div>
                </div>
                <div class="space-y-2 mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-600">
                    <div class="flex justify-between"><span>Subtotal:</span><span>₹${finalPriceToPay.toLocaleString('en-IN')}</span></div>
                    <div class="flex justify-between text-emerald-600"><span>Delivery Charge:</span><span class="font-bold uppercase">FREE</span></div>
                </div>
                <div class="total-checkout-price"><span>Total Payable:</span><span class="text-blue-600">₹${finalPriceToPay.toLocaleString('en-IN')}</span></div>`;
            }
            
            const previewContainer = document.getElementById('productPreview');
            if (previewContainer) previewContainer.innerHTML = previewHtml;
        }

        function hideLoader() {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loader.remove(), 500);
            }
        }

        renderOrderPreview();
        hideLoader();

        window.sendOrderEmail = function(orderData, userEmail) {
            if (!userEmail || typeof emailjs === 'undefined') return;

            let productDetailsText = "";
            if (orderData.items && Array.isArray(orderData.items)) {
                orderData.items.forEach((item, index) => {
                    productDetailsText += `${index + 1}. ${item.name} (Size: ${item.size || 'N/A'}, Qty: ${item.quantity}) - ₹${item.price}\n`;
                });
            }

            const templateParams = {
                to_email: userEmail,
                customer_name: orderData.customerName,
                order_id: orderData.orderId,
                total_price: orderData.price,
                payment_method: orderData.paymentMethod,
                delivery_address: orderData.address,
                product_details: productDetailsText
            };

            try {
                emailjs.send('service_crbmtvy', 'template_rd6d6w6', templateParams, EMAILJS_PUBLIC_KEY);
            } catch (e) { console.error(e); }
        };

        window.placeOrder = () => {
            const fields = {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                country: document.getElementById('country').value.trim(),
                house: document.getElementById('house').value.trim(),
                area: document.getElementById('area').value.trim(),
                city: document.getElementById('city').value.trim(),
                state: document.getElementById('state').value.trim(),
                pin: document.getElementById('pincode').value.trim(),
                utr: 'COD'
            };

            if(!fields.name || !fields.phone || !fields.country || !fields.house || !fields.city || !fields.state || !fields.pin) {
                return Swal.fire({
                    title: 'Address Missing',
                    text: 'Please fill all required delivery address fields.',
                    icon: 'warning',
                    confirmButtonText: 'Ok',
                    customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
                });
            }

            if (fields.phone.length !== 10) {
                return Swal.fire({
                    title: 'Invalid Phone Number',
                    text: 'Please enter a valid 10-digit phone number.',
                    icon: 'warning',
                    confirmButtonText: 'Ok',
                    customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
                });
            }

            if (fields.pin.length !== 6) {
                return Swal.fire({
                    title: 'Invalid Pincode',
                    text: 'Please enter a valid 6-digit pincode.',
                    icon: 'warning',
                    confirmButtonText: 'Ok',
                    customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
                });
            }

            Swal.fire({
                title: 'Confirm Order?', text: "Confirm your order with Cash on Delivery?", icon: 'question',
                showCancelButton: true, confirmButtonText: 'Yes, Confirm',
                cancelButtonText: 'Cancel',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
            }).then((res) => {
                if(res.isConfirmed) {
                    const orderId = Date.now(); 
                    const now = new Date();
                    
                    // Fetch Referral Info
                    const refUser = refFromUrl || orderInfo.referredBy || localStorage.getItem('referredBy') || null;
                    const commAmt = commFromUrl || orderInfo.commissionAmount || localStorage.getItem('commissionAmount') || 0;

                    // Set Delivery Date as Order Date (Today)
                    const actualDeliveryDate = getDeliveryDateStr();

                    // Check return policy presence
                    const isOrderReturnable = orderInfo.return === true || orderInfo.return === 'true' || orderInfo.returnPolicy === true || orderInfo.isReturnable === true || false;

                    let finalOrder = { 
                        customerName: fields.name, 
                        customerPhone: fields.phone, 
                        phone: fields.phone, 
                        address: `${fields.house}, ${fields.area}, ${fields.city}, ${fields.state}, ${fields.country} - ${fields.pin}`, 
                        transactionId: 'COD', 
                        date: now.toISOString().split('T')[0], 
                        createdAt: now.toISOString(),
                        timestamp: Date.now(),
                        status: "Order Confirmed", 
                        paymentStatus: "COD",
                        paymentMethod: "COD",
                        orderId: orderId,
                        referredBy: refUser,
                        commissionAmount: parseFloat(commAmt) || 0,
                        orderLink: window.location.href,
                        returnPolicy: isOrderReturnable,
                        isReturnable: isOrderReturnable,
                        deliveryDate: actualDeliveryDate
                    };

                    if (orderInfo.orderType === "Cart" && orderInfo.items) {
                        finalOrder.orderType = "Cart";
                        let calcTotal = 0;
                        
                        finalOrder.items = orderInfo.items.map(item => {
                            let p = parsePrice(item.price);
                            let q = parseInt(item.quantity) || 1;
                            let itemReturnStatus = item.return === true || item.return === 'true' || item.returnPolicy === true || item.isReturnable === true || false;
                            calcTotal += (p * q);
                            return { 
                                id: item.id || "", 
                                name: item.name || item.title || "Product", 
                                price: item.price, 
                                image: item.image || "", 
                                quantity: q, 
                                size: item.selectedSize || item.size || "N/A", 
                                return: itemReturnStatus,
                                returnPolicy: itemReturnStatus,
                                isReturnable: itemReturnStatus,
                                deliveryDate: actualDeliveryDate
                            };
                        });
                        
                        finalOrder.price = calcTotal.toLocaleString('en-IN');
                        finalOrder.productName = orderInfo.items.map(i => `${i.name || i.title} (Size: ${i.selectedSize || i.size || 'N/A'}, Qty: ${i.quantity})`).join(', ');
                    } else {
                        let unitPrice = parsePrice(orderInfo.price);
                        let q = parseInt(orderInfo.quantity) || 1;
                        let calcTotal = unitPrice * q;

                        finalOrder.orderType = "Single";
                        finalOrder.productName = `${orderInfo.productName} (Size: ${orderInfo.selectedSize || 'N/A'}, Qty: ${q})`;
                        finalOrder.price = calcTotal.toLocaleString('en-IN');
                        finalOrder.selectedSize = orderInfo.selectedSize || "N/A";
                        
                        finalOrder.items = [{
                            id: orderInfo.productId || "",
                            name: orderInfo.productName,
                            price: orderInfo.price,
                            image: orderInfo.productImage || "",
                            quantity: q,
                            size: orderInfo.selectedSize || "N/A",
                            return: isOrderReturnable,
                            returnPolicy: isOrderReturnable,
                            isReturnable: isOrderReturnable,
                            deliveryDate: actualDeliveryDate
                        }];
                    }

                    // 1. Save primary order
                    const primaryOrderRef = set(ref(db, `orders/${fields.phone}/${orderId}`), finalOrder);

                    // 2. Save referral order with Return-Policy logic
                    let referralOrderRef = Promise.resolve();
                    if (refUser) {
                        const cleanRefCode = refUser.toString().replace(/[.#$\[\]]/g, "_");
                        
                        // Calculate 7 Days Expiry Date
                        const returnExpiryDate = new Date();
                        returnExpiryDate.setDate(now.getDate() + 7);

                        const referralOrderData = {
                            ...finalOrder,
                            referralStatus: "Pending", // Direct creation time is always Pending until delivered
                            returnPolicy: isOrderReturnable ? "7 Days Return Policy" : "No Return",
                            isReturnable: isOrderReturnable,
                            returnPeriodDays: isOrderReturnable ? 7 : 0,
                            returnEligibleUntil: isOrderReturnable ? returnExpiryDate.toISOString() : null,
                            referralCreatedAt: now.toISOString()
                        };

                        referralOrderRef = set(ref(db, `referralOrders/${cleanRefCode}/${orderId}`), referralOrderData);
                    }

                    Promise.all([primaryOrderRef, referralOrderRef]).then(() => {
                        const activeUser = auth.currentUser;
                        const emailToSend = activeUser ? activeUser.email : currentUserEmail;

                        if (emailToSend) window.sendOrderEmail(finalOrder, emailToSend);

                        if(orderInfo.orderType === "Cart" && currentUserId) remove(ref(db, `cart/${currentUserId}`));
                        
                        localStorage.removeItem('pendingOrder');
                        localStorage.removeItem('referredBy');
                        localStorage.removeItem('commissionAmount');

                        showAlert('Success', 'Order Placed Successfully!', 'success');
                        setTimeout(() => location.href = 'orders.html', 1500);
                    }).catch((err) => {
                        console.error("Order save error:", err);
                        showAlert('Error', 'Order could not be saved.', 'error');
                    });
                }
            });
        };
    </script>
</body>
</html>
