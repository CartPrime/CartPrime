<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CartPrime</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        // തീം സെറ്റ് ചെയ്യാൻ
        (function() {
            const savedTheme = localStorage.getItem('theme') || localStorage.getItem('darkMode');
            if (savedTheme === 'dark' || savedTheme === 'true') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        
        .dark {
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        
        * {
            outline: none !important;
        }
        *:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        .hidden { display: none !important; }
        
        .swal-custom-popup {
            border-radius: 16px !important;
            padding: 2rem !important;
            font-family: 'Segoe UI', sans-serif !important;
            width: 90% !important;
            max-width: 500px !important;
        }
        .swal-custom-title {
            font-size: 1.3rem !important;
            font-weight: 700 !important;
        }
        .swal-custom-confirm {
            background-color: var(--primary) !important;
            border-radius: 8px !important;
            padding: 12px 24px !important;
            font-weight: 600 !important;
        }
        .swal-custom-cancel {
            background-color: #ef4444 !important;
            border-radius: 8px !important;
            padding: 12px 24px !important;
            font-weight: 600 !important;
        }
        
        .prod-item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        @media (max-width: 400px) {
            .prod-item-row {
                align-items: flex-start;
            }
        }
        .prod-item-row img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            flex-shrink: 0;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .qty-btn:hover {
            opacity: 0.8;
        }
        .total-checkout-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px dashed var(--border);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen pb-12 transition-colors duration-200">

    <!-- Page Loader -->
    <div id="pageLoader" class="fixed inset-0 z-[100] bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center gap-4 transition-opacity duration-500">
        <div class="relative w-16 h-16">
            <div class="w-16 h-16 border-4 border-slate-200 dark:border-slate-700 border-t-blue-600 rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                <i class="fa-solid fa-cart-shopping text-lg animate-pulse"></i>
            </div>
        </div>
        <p class="text-sm font-semibold text-slate-600 dark:text-slate-300 tracking-wide animate-pulse">Loading Checkout...</p>
    </div>

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50 backdrop-blur-md bg-white/90 dark:bg-slate-800/90">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">

                <i class="fa-solid fa-arrow-left text-lg"></i>
                <span class="hidden sm:inline">Back</span>
            </a>
            <h1 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-white tracking-tight">Checkout</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 sm:mt-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
            
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                        <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-blue-600"></i> Delivery Address
                        </h2>

                        <!-- Current Location Button -->
                        <button type="button" id="locBtn" onclick="getCurrentLocation()" class="text-xs bg-blue-50 dark:bg-blue-900/40 hover:bg-blue-100 text-blue-600 dark:text-blue-400 font-bold py-2 px-3 rounded-xl transition-all flex items-center gap-2 border border-blue-200 dark:border-blue-800 cursor-pointer">
                            <i class="fa-solid fa-crosshairs text-sm"></i> 
                            <span id="locBtnText">Use Current Location</span>

                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Full Name</label>
                                <input type="text" id="custName" placeholder="John Doe" autocomplete="off" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-slate-800 dark:text-white transition-all text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Phone Number</label>
                                <input type="tel" id="custPhone" maxlength="10" inputmode="numeric" pattern="[0-9]*" placeholder="10-digit number" autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-slate-800 dark:text-white transition-all text-sm font-medium">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Country / Region</label>
                            <select id="country" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-sm font-medium text-slate-800 dark:text-white">
                                <option value="India" selected>India</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">House No, Building, Street</label>
                            <input type="text" id="house" placeholder="Flat/House No., Colony" autocomplete="off" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-slate-800 dark:text-white transition-all text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Area, Colony, Road, Landmark</label>
                            <input type="text" id="area" placeholder="Nearby landmark, local area" autocomplete="off" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-slate-800 dark:text-white transition-all text-sm font-medium">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Town/City</label>
                                <input type="text" id="city" placeholder="City name" autocomplete="off" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-slate-800 dark:text-white transition-all text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">State</label>
                                <select id="state" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-sm font-medium text-slate-700 dark:text-slate-200">
                                    <option value="">Select State</option>
                                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                    <option value="Assam">Assam</option>
                                    <option value="Bihar">Bihar</option>
                                    <option value="Chhattisgarh">Chhattisgarh</option>
                                    <option value="Goa">Goa</option>
                                    <option value="Gujarat">Gujarat</option>
                                    <option value="Haryana">Haryana</option>
                                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                                    <option value="Jharkhand">Jharkhand</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Kerala">Kerala</option>
                                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Manipur">Manipur</option>
                                    <option value="Meghalaya">Meghalaya</option>
                                    <option value="Mizoram">Mizoram</option>
                                    <option value="Nagaland">Nagaland</option>
                                    <option value="Odisha">Odisha</option>
                                    <option value="Punjab">Punjab</option>
                                    <option value="Rajasthan">Rajasthan</option>
                                    <option value="Sikkim">Sikkim</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Telangana">Telangana</option>
                                    <option value="Tripura">Tripura</option>
                                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                                    <option value="Uttarakhand">Uttarakhand</option>
                                    <option value="West Bengal">West Bengal</option>
                                    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                                    <option value="Chandigarh">Chandigarh</option>
                                    <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                                    <option value="Ladakh">Ladakh</option>
                                    <option value="Lakshadweep">Lakshadweep</option>
                                    <option value="Puducherry">Puducherry</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Pincode</label>
                            <input type="text" id="pincode" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="6-digit PIN" autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 text-slate-800 dark:text-white transition-all text-sm font-medium">
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-6 shadow-sm">
                    <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-credit-card text-blue-600"></i> Payment Method
                    </h2>
                    
                    <div class="grid grid-cols-1 gap-4 mb-4">
                        <label id="codLabel" class="relative flex flex-col p-4 bg-emerald-50 dark:bg-emerald-950/40 border-2 border-emerald-600 rounded-xl cursor-default">
                            <input type="radio" name="paymentMethod" value="COD" id="codRadio" checked class="absolute top-4 right-4 text-emerald-600" disabled>
                            <span class="font-bold text-sm text-slate-800 dark:text-slate-200 mb-1"><i class="fa-solid fa-truck-ramp-box mr-1 text-emerald-600"></i> Pay on Delivery</span>
                            <span class="text-xs text-emerald-700 dark:text-emerald-400 font-medium">Cash on Delivery (Online UPI is currently disabled)</span>
                        </label>
                    </div>

                    <div class="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/50 rounded-xl p-4 flex items-start gap-3">
                        <i class="fa-solid fa-circle-check text-emerald-600 mt-0.5 text-sm"></i>
                        <div>
                            <h4 class="font-bold text-sm text-emerald-900 dark:text-emerald-300">Cash on Delivery Selected</h4>
                            <p class="text-xs text-emerald-700 dark:text-emerald-400 font-medium mt-0.5">Please keep the exact amount ready at the time of delivery. No extra handling charges apply.</p>

            </div>

            <div class="lg:col-span-5 space-y-6 lg:sticky lg:top-24">
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-6 shadow-sm">
                    <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-basket-shopping text-blue-600"></i> Order Summary
                    </h2>
                    
                    <div id="productPreview" class="space-y-1"></div>

                    <button onclick="placeOrder()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold text-base py-4 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-bag-shopping"></i> Complete Order
                    </button>
                    
                    <p class="text-center text-xs text-slate-400 dark:text-slate-500 font-medium mt-4"><i class="fa-solid fa-lock mr-1 text-slate-300 dark:text-slate-600"></i> Secure 256-bit SSL Encrypted Connection</p>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const EMAILJS_PUBLIC_KEY = "v9Kubn2pDJOSM8iL8";

        if (typeof emailjs !== 'undefined') {
            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc",
            authDomain: "cartprime-shopping.firebaseapp.com",
            projectId: "cartprime-shopping",
            storageBucket: "cartprime-shopping.firebasestorage.app",
            messagingSenderId: "570068438689",
            appId: "1:570068438689:web:17b25f49f2b561fd29eae0",
            measurementId: "G-9GREWHMEYL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let orderInfo = JSON.parse(localStorage.getItem('pendingOrder'));
        let currentUserId = null;
        let currentUserEmail = null; 

        const showAlert = (title, text, icon) => {
            const isDark = document.documentElement.classList.contains('dark');
            Swal.fire({
                title: title, text: text, icon: icon,
                background: isDark ? '#1e293b' : '#fff',
                color: isDark ? '#f8fafc' : '#0f172a',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
            });
        };

        // --- CURRENT LOCATION (GPS) AUTO-FILL LOGIC ---
        window.getCurrentLocation = function() {
            const locBtnText = document.getElementById('locBtnText');
            
            if (!navigator.geolocation) {
                showAlert('Not Supported', 'Geolocation is not supported by your browser.', 'error');
                return;
            }

            locBtnText.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Fetching...`;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                        const data = await response.json();

                        if (data && data.address) {
                            const addr = data.address;
                            
                            if (addr.postcode) {
                                document.getElementById('pincode').value = addr.postcode.replace(/\s+/g, '').slice(0, 6);
                            }

                            const city = addr.city || addr.town || addr.village || addr.suburb || addr.county || "";
                            document.getElementById('city').value = city;

                            const localArea = [addr.road, addr.neighbourhood, addr.suburb].filter(Boolean).join(", ");
                            document.getElementById('area').value = localArea || city;

                            if (addr.state) {
                                const stateSelect = document.getElementById('state');
                                const stateOptions = Array.from(stateSelect.options);
                                const matchingOption = stateOptions.find(opt => 
                                    opt.value.toLowerCase() === addr.state.toLowerCase() ||
                                    addr.state.toLowerCase().includes(opt.value.toLowerCase())
                                );
                                if (matchingOption) {
                                    stateSelect.value = matchingOption.value;
                                }
                            }

                            showAlert('Success', 'Address details loaded from current location!', 'success');
                        } else {
                            showAlert('Warning', 'Could not detect complete address details.', 'warning');
                        }
                    } catch (err) {
                        showAlert('Error', 'Failed to fetch location address. Please enter manually.', 'error');
                    } finally {
                        locBtnText.textContent = "Use Current Location";
                    }
                },
                (error) => {
                    locBtnText.textContent = "Use Current Location";
                    let msg = "Unable to retrieve location.";
                    if (error.code === error.PERMISSION_DENIED) msg = "Location access denied. Please allow location access in browser settings.";
                    showAlert('Location Error', msg, 'error');
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                currentUserEmail = user.email; 
            }
        });

        window.changeQuantity = (index, delta) => {
            if (!orderInfo) return;

            if (orderInfo.orderType === "Cart" && Array.isArray(orderInfo.items)) {
                let currentQty = parseInt(orderInfo.items[index].quantity) || 1;
                let newQty = currentQty + delta;
                if (newQty < 1) newQty = 1;
                orderInfo.items[index].quantity = newQty;
            } else {
                let currentQty = parseInt(orderInfo.quantity) || 1;
                let newQty = currentQty + delta;
                if (newQty < 1) newQty = 1;
                orderInfo.quantity = newQty;
            }

            localStorage.setItem('pendingOrder', JSON.stringify(orderInfo));
            renderOrderPreview();
        };

        function renderOrderPreview() {
            if (!orderInfo) {
                location.href = 'index.html';
                return;
            }

            let previewHtml = "";
            let finalPriceToPay = 0;

            if (orderInfo.orderType === "Cart" && Array.isArray(orderInfo.items)) {
                orderInfo.items.forEach((item, idx) => {
                    let productImg = item.image || (item.images && item.images[0]) || "https://via.placeholder.com/150";
                    let unitPrice = parseFloat(item.price.toString().replace(/,/g, '')) || 0;
                    let qty = parseInt(item.quantity) || 1;
                    let itemTotal = unitPrice * qty;
                    let itemSize = item.selectedSize || item.size || 'N/A';
                    
                    finalPriceToPay += itemTotal;

                    previewHtml += `
                    <div class="prod-item-row">
                        <img src="${productImg}">
                        <div class="prod-item-details" style="flex: 1; min-width: 0;">
                            <p style="font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" class="text-slate-800 dark:text-slate-100">${item.name || item.title}</p>
                            <p class="text-slate-500 dark:text-slate-400" style="font-size: 0.82rem; font-weight: 600; margin-top: 2px;">
                                Size: <span class="text-slate-900 dark:text-slate-200" style="font-weight: 800;">${itemSize}</span>
                            </p>
                            <p class="text-slate-900 dark:text-slate-100" style="font-weight: 800; font-size: 0.9rem; margin-top: 2px;">₹${itemTotal.toLocaleString('en-IN')}</p>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                            <button onclick="changeQuantity(${idx}, -1)" class="qty-btn">-</button>
                            <span class="font-bold text-sm px-1 text-slate-800 dark:text-slate-200">${qty}</span>
                            <button onclick="changeQuantity(${idx}, 1)" class="qty-btn">+</button>
                        </div>
                    </div>`;
                });
                previewHtml += `<div class="total-checkout-price"><span>Total Payable:</span><span>₹${finalPriceToPay.toLocaleString('en-IN')}</span></div>`;
            } else {
                let unitPrice = parseFloat(orderInfo.price.toString().replace(/,/g, '')) || 0;
                let qty = parseInt(orderInfo.quantity) || 1;
                let itemSize = orderInfo.selectedSize || 'N/A';
                finalPriceToPay = unitPrice * qty;

                previewHtml = `
                <div class="prod-item-row">
                    <img src="${orderInfo.productImage}">
                    <div class="prod-item-details" style="flex: 1; min-width: 0;">
                        <p style="font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" class="text-slate-800 dark:text-slate-100">${orderInfo.productName}</p>
                        <p class="text-slate-500 dark:text-slate-400" style="font-size: 0.82rem; font-weight: 600; margin-top: 2px;">
                            Size: <span class="text-slate-900 dark:text-slate-200" style="font-weight: 800;">${itemSize}</span>
                        </p>
                        <p class="text-slate-900 dark:text-slate-100" style="font-weight: 800; font-size: 0.95rem; margin-top: 4px;">₹${finalPriceToPay.toLocaleString('en-IN')}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                        <button onclick="changeQuantity(0, -1)" class="qty-btn">-</button>
                        <span class="font-bold text-sm px-1 text-slate-800 dark:text-slate-200">${qty}</span>
                        <button onclick="changeQuantity(0, 1)" class="qty-btn">+</button>
                    </div>
                </div>
                <div class="total-checkout-price"><span>Total Payable:</span><span>₹${finalPriceToPay.toLocaleString('en-IN')}</span></div>`;
            }
            
            const previewContainer = document.getElementById('productPreview');
            if (previewContainer) previewContainer.innerHTML = previewHtml;
        }

        function hideLoader() {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loader.remove(), 500);
            }
        }

        renderOrderPreview();
        hideLoader();

        window.sendOrderEmail = function(orderData, userEmail) {
            if (!userEmail || typeof emailjs === 'undefined') return;

            let productDetailsText = "";
            if (orderData.items && Array.isArray(orderData.items)) {
                orderData.items.forEach((item, index) => {
                    productDetailsText += `${index + 1}. ${item.name} (Size: ${item.size || 'N/A'}, Qty: ${item.quantity}) - ₹${item.price}\n`;
                });
            }

            const templateParams = {
                to_email: userEmail,
                customer_name: orderData.customerName,
                order_id: orderData.orderId,
                total_price: orderData.price,
                payment_method: orderData.paymentMethod,
                delivery_address: orderData.address,
                product_details: productDetailsText
            };

            try {
                emailjs.send('service_crbmtvy', 'template_rd6d6w6', templateParams, EMAILJS_PUBLIC_KEY);
            } catch (e) { console.error(e); }
        };

        window.placeOrder = () => {
            const fields = {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                country: document.getElementById('country').value.trim(),
                house: document.getElementById('house').value.trim(),
                area: document.getElementById('area').value.trim(),
                city: document.getElementById('city').value.trim(),
                state: document.getElementById('state').value.trim(),
                pin: document.getElementById('pincode').value.trim(),
                utr: 'COD'
            };

            if(!fields.name || !fields.phone || !fields.country || !fields.house || !fields.city || !fields.state || !fields.pin) {
                return showAlert('Address Missing', 'Please fill all required delivery address fields.', 'warning');
            }

            if (fields.phone.length !== 10) {
                return showAlert('Invalid Phone Number', 'Please enter a valid 10-digit phone number.', 'warning');
            }

            if (fields.pin.length !== 6) {
                return showAlert('Invalid Pincode', 'Please enter a valid 6-digit pincode.', 'warning');
            }

            const isDark = document.documentElement.classList.contains('dark');
            Swal.fire({
                title: 'Confirm Order?', text: "Confirm your order with Cash on Delivery?", icon: 'question',
                showCancelButton: true, confirmButtonText: 'Yes, Confirm',
                cancelButtonText: 'Cancel',
                background: isDark ? '#1e293b' : '#fff',
                color: isDark ? '#f8fafc' : '#0f172a',
                customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-custom-confirm', cancelButton: 'swal-custom-cancel' }
            }).then((res) => {
                if(res.isConfirmed) {
                    const orderId = Date.now(); 
                    
                    let finalOrder = { 
                        customerName: fields.name, 
                        customerPhone: fields.phone, 
                        phone: fields.phone, 
                        address: `${fields.house}, ${fields.area}, ${fields.city}, ${fields.state}, ${fields.country} - ${fields.pin}`, 
                        transactionId: 'COD', 
                        date: new Date().toISOString().split('T')[0], 
                        status: "Order Confirmed", 
                        paymentStatus: "COD",
                        paymentMethod: "COD",
                        orderId: orderId
                    };

                    if (orderInfo.orderType === "Cart" && orderInfo.items) {
                        finalOrder.orderType = "Cart";
                        let calcTotal = 0;
                        
                        finalOrder.items = orderInfo.items.map(item => {
                            let p = parseFloat(item.price.toString().replace(/,/g, '')) || 0;
                            let q = parseInt(item.quantity) || 1;
                            calcTotal += (p * q);
                            return { 
                                id: item.id || "", 
                                name: item.name || item.title || "Product", 
                                price: item.price, 
                                image: item.image || "", 
                                quantity: q, 
                                size: item.selectedSize || item.size || "N/A", 
                                return: item.return === true || item.return === 'true' 
                            };
                        });
                        
                        finalOrder.price = calcTotal.toLocaleString('en-IN');
                        finalOrder.productName = orderInfo.items.map(i => `${i.name || i.title} (Size: ${i.selectedSize || i.size || 'N/A'}, Qty: ${i.quantity})`).join(', ');
                    } else {
                        let unitPrice = parseFloat(orderInfo.price.toString().replace(/,/g, '')) || 0;
                        let q = parseInt(orderInfo.quantity) || 1;
                        let calcTotal = unitPrice * q;

                        finalOrder.orderType = "Single";
                        finalOrder.productName = `${orderInfo.productName} (Size: ${orderInfo.selectedSize || 'N/A'}, Qty: ${q})`;
                        finalOrder.price = calcTotal.toLocaleString('en-IN');
                        finalOrder.selectedSize = orderInfo.selectedSize || "N/A";
                        
                        finalOrder.items = [{
                            id: orderInfo.productId || "",
                            name: orderInfo.productName,
                            price: orderInfo.price,
                            image: orderInfo.productImage || "",
                            quantity: q,
                            size: orderInfo.selectedSize || "N/A",
                            return: orderInfo.return === true || orderInfo.return === 'true'
                        }];
                    }

                    set(ref(db, `orders/${fields.phone}/${orderId}`), finalOrder).then(() => {
                        const activeUser = auth.currentUser;
                        const emailToSend = activeUser ? activeUser.email : currentUserEmail;

                        if (emailToSend) window.sendOrderEmail(finalOrder, emailToSend);

                        if(orderInfo.orderType === "Cart" && currentUserId) remove(ref(db, `cart/${currentUserId}`));
                        localStorage.removeItem('pendingOrder');
                        showAlert('Success', 'Order Placed Successfully!', 'success');
                        setTimeout(() => location.href = 'orders.html', 1500);
                    }).catch(() => showAlert('Error', 'Order could not be saved.', 'error'));
                }
            });
        };
    </script>
</body>  
</html>
