<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartPrime | Master Admin Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #0b0b0f;
      --card-bg: #151922;
      --surface: #1e293b;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
      --danger: #ef4444;
      --info: #0ea5e9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5%;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i { color: var(--accent); }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 25px 5% 10px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .stat-info h4 { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .stat-info span { font-size: 1.5rem; font-weight: 800; }

    .main-container {
      padding: 15px 5%;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0b0f;
      border-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-delete { background: var(--danger); color: #fff; }
    .btn-edit { background: var(--info); color: #fff; }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .input-field {
      width: 100%;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .size-checkboxes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .size-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .spec-row {
      display: grid;
      grid-template-columns: 1fr 1fr 40px;
      gap: 10px;
      margin-bottom: 10px;
    }

    .gallery-image-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn-secondary-action {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-upload {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b0b0f;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav>
    <div class="logo">
      <i class="fa-solid fa-cart-shopping"></i> CartPrime Seller Dashboard
    </div>
    <div class="user-profile-badge">
      <i class="fa-solid fa-user-check" style="color: var(--accent);"></i>
      <span id="activeUserDisplay">Loading User...</span>
    </div>
  </nav>

  <!-- Statistics Overview -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon" style="color: var(--success);"><i class="fa-solid fa-boxes-stacked"></i></div>
      <div class="stat-info">
        <h4>MY PRODUCTS</h4>
        <span id="statMyProducts">0</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="color: #38bdf8;"><i class="fa-solid fa-bag-shopping"></i></div>
      <div class="stat-info">
        <h4>MY ORDERS</h4>
        <span id="statMyOrders">0</span>
      </div>
    </div>
  </div>

  <div class="main-container">
    
    <!-- Tab Controls -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-add-product"><i class="fa-solid fa-circle-plus"></i> <span id="formTitleText">Add New Product</span></button>
      <button class="tab-btn" data-tab="tab-products"><i class="fa-solid fa-boxes-stacked"></i> Manage My Products</button>
      <button class="tab-btn" data-tab="tab-orders"><i class="fa-solid fa-truck-fast"></i> Customer Orders</button>
    </div>

    <!-- TAB 1: ADD / EDIT PRODUCT -->
    <div class="tab-content active" id="tab-add-product">
      <div class="form-card">
        <h3 id="formHeading" style="margin-bottom: 6px;"><i class="fa-solid fa-circle-plus" style="color: var(--accent);"></i> Add New Product</h3>
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 20px;">Publish or update products directly to your seller inventory</p>
        
        <form id="adminProductForm">
          <input type="hidden" id="editingProductId" value="">

          <div class="form-group">
            <label>PRODUCT NAME</label>
            <input type="text" id="pName" class="input-field" placeholder="Short Brand / Product Name" required>
          </div>

          <div class="form-group">
            <label>FULL DISPLAY TITLE</label>
            <input type="text" id="pFullTitle" class="input-field" placeholder="Full descriptive title displayed on product page">
          </div>

          <div class="form-group">
            <label>CATEGORY</label>
            <select id="pCategory" class="input-field" style="background: var(--surface);" required>
              <option value="">SELECT CATEGORY</option>
              <option value="Gadgets">Gadgets</option>
              <option value="Fashion">Fashion</option>
              <option value="Watches">Watches</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>

          <div class="form-group">
            <label>AVAILABLE SIZES (OPTIONAL):</label>
            <div class="size-checkboxes">
              <label class="size-chip"><input type="checkbox" name="sizes" value="S"> S</label>
              <label class="size-chip"><input type="checkbox" name="sizes" value="M"> M</label>
              <label class="size-chip"><input type="checkbox" name="sizes" value="L"> L</label>
              <label class="size-chip"><input type="checkbox" name="sizes" value="XL"> XL</label>
              <label class="size-chip"><input type="checkbox" name="sizes" value="XXL"> XXL</label>
              <label class="size-chip"><input type="checkbox" name="sizes" value="Free Size"> Free Size</label>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>MRP (₹ STRIKE-THROUGH PRICE)</label>
              <input type="number" id="pMrp" class="input-field" placeholder="e.g. 1999" required>
            </div>
            <div class="form-group">
              <label>SELLING PRICE (₹)</label>
              <input type="number" id="pPrice" class="input-field" placeholder="e.g. 899" required>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>SHIPPED FROM</label>
              <input type="text" id="pShippedFrom" class="input-field" placeholder="Warehouse Location / Hub">
            </div>
            <div class="form-group">
              <label>ESTIMATED DELIVERY (DAYS)</label>
              <input type="number" id="pDeliveryDays" class="input-field" value="7">
            </div>
          </div>

          <div class="form-group">
            <label>PRODUCT DESCRIPTION</label>
            <textarea id="pDesc" class="input-field" rows="3" placeholder="Enter features with bullet points..."></textarea>
          </div>

          <!-- Specifications Section -->
          <div class="form-group">
            <label>SPECIFICATIONS</label>
            <div id="specContainer">
              <div class="spec-row">
                <input type="text" class="input-field spec-key" placeholder="Key (e.g. Color)">
                <input type="text" class="input-field spec-value" placeholder="Value (e.g. Black)">
                <button type="button" class="btn-secondary-action" onclick="this.parentElement.remove()" style="color:#ef4444;"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <button type="button" class="btn-secondary-action" id="btnAddSpec"><i class="fa-solid fa-plus"></i> Add Specification</button>
          </div>

          <!-- Gallery Images Section with ImgBB Integration -->
          <div class="form-group">
            <label>PRODUCT GALLERY IMAGES</label>
            <div id="galleryContainer">
              <div class="gallery-image-row">
                <input type="url" class="input-field gallery-url" placeholder="IMAGE URL 1" required>
                <input type="file" class="file-input" accept="image/*" style="display: none;" onchange="uploadImageToImgBB(this)">
                <button type="button" class="btn-upload" onclick="this.previousElementSibling.click()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
              </div>
            </div>
            <button type="button" class="btn-secondary-action" id="btnAddGallery"><i class="fa-solid fa-plus"></i> Add Additional Image</button>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>RETURN POLICY</label>
              <select id="pReturnPolicy" class="input-field" style="background: var(--surface);">
                <option value="7 Days Hassle-Free Return">7 Days Hassle-Free Return</option>
                <option value="No Returns Allowed">No Returns Allowed</option>
              </select>
            </div>
            <div class="form-group">
              <label>STORE VISIBILITY</label>
              <select id="pVisibility" class="input-field" style="background: var(--surface);">
                <option value="true">Show on Home & Search</option>
                <option value="false">Search Only (Hidden from Home)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>PAYMENT TYPE ALLOWED</label>
            <select id="pPaymentType" class="input-field" style="background: var(--surface);">
              <option value="Cash On Delivery & Online">Cash On Delivery & Online</option>
              <option value="Online Payment Only">Online Payment Only</option>
            </select>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button type="submit" class="btn-submit" id="submitBtnText">SAVE PRODUCT</button>
            <button type="button" id="cancelEditBtn" class="btn" style="background: var(--surface); color: var(--text); display: none;" onclick="resetProductForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- TAB 2: MANAGE MY PRODUCTS ONLY -->
    <div class="tab-content" id="tab-products">
      <div class="products-grid" id="productsGrid">
        <div class="empty-state">Loading your products...</div>
      </div>
    </div>

    <!-- TAB 3: CUSTOMER ORDERS -->
    <div class="tab-content" id="tab-orders">
      <div class="products-grid" id="ordersGrid">
        <div class="empty-state">Loading your orders...</div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { 
      apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc", 
      authDomain: "cartprime-shopping.firebaseapp.com", 
      projectId: "cartprime-shopping", 
      storageBucket: "cartprime-shopping.firebasestorage.app", 
      messagingSenderId: "570068438689", 
      appId: "1:570068438689:web:17b25f49f2b561fd29eae0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Identify current user/seller session phone
    const loggedUserPhone = localStorage.getItem('userPhone') || localStorage.getItem('sellerSessionPhone') || "Admin";
    const loggedUserName = localStorage.getItem('userName') || "Seller Admin";

    document.getElementById('activeUserDisplay').textContent = `${loggedUserName} (+91 ${loggedUserPhone})`;

    // Tab Navigation Logic
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
      });
    });

    // ImgBB Direct Image Upload Handler
    window.uploadImageToImgBB = function(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const btn = fileInput.nextElementSibling;
      const urlInput = fileInput.previousElementSibling;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function () {
        const base64Image = reader.result.split(',')[1];
        const formData = new FormData();
        formData.append('image', base64Image);

        fetch('https://api.imgbb.com/1/upload?key=ae2576cbbfe74ed3e3a4dd415b7fc373', {
          method: 'POST',
          body: formData
        })
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          if (data && data.success && data.data && data.data.url) {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Uploaded';
            urlInput.value = data.data.url;
            alert("Image uploaded successfully!");
          } else {
            const errDetail = (data && data.error && data.error.message) ? data.error.message : "Upload failed";
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Upload';
            alert("ImgBB Error: " + errDetail);
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Upload';
          alert("Network / Connection error: " + err.message);
        });
      };
      reader.onerror = function () {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Upload';
        alert("Failed to read image file.");
      };
    };

    // Add Specification Row
    document.getElementById('btnAddSpec').addEventListener('click', () => {
      addSpecRow("", "");
    });

    function addSpecRow(key, val) {
      const container = document.getElementById('specContainer');
      const div = document.createElement('div');
      div.className = 'spec-row';
      div.innerHTML = `
        <input type="text" class="input-field spec-key" placeholder="Key (e.g. Color)" value="${key}">
        <input type="text" class="input-field spec-value" placeholder="Value (e.g. Black)" value="${val}">
        <button type="button" class="btn-secondary-action" onclick="this.parentElement.remove()" style="color:#ef4444;"><i class="fa-solid fa-xmark"></i></button>
      `;
      container.appendChild(div);
    }

    // Add Gallery Image Row
    document.getElementById('btnAddGallery').addEventListener('click', () => {
      addGalleryRow("");
    });

    function addGalleryRow(url) {
      const container = document.getElementById('galleryContainer');
      const count = container.querySelectorAll('.gallery-image-row').length + 1;
      const div = document.createElement('div');
      div.className = 'gallery-image-row';
      div.innerHTML = `
        <input type="url" class="input-field gallery-url" placeholder="IMAGE URL ${count}" value="${url}" required>
        <input type="file" class="file-input" accept="image/*" style="display: none;" onchange="uploadImageToImgBB(this)">
        <button type="button" class="btn-upload" onclick="this.previousElementSibling.click()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
        <button type="button" class="btn-secondary-action" onclick="this.parentElement.remove()" style="color:#ef4444;"><i class="fa-solid fa-xmark"></i></button>
      `;
      container.appendChild(div);
    }

    // 1. ADD / UPDATE PRODUCT FORM SUBMIT (SAVED TO seller-products/{phone})
    const adminProductForm = document.getElementById('adminProductForm');
    adminProductForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const editingId = document.getElementById('editingProductId').value;
      const selectedSizes = [];
      document.querySelectorAll('input[name="sizes"]:checked').forEach(cb => selectedSizes.push(cb.value));

      const specs = {};
      document.querySelectorAll('.spec-row').forEach(row => {
        const k = row.querySelector('.spec-key').value.trim();
        const v = row.querySelector('.spec-value').value.trim();
        if (k && v) specs[k] = v;
      });

      const images = [];
      document.querySelectorAll('.gallery-url').forEach(inp => {
        if (inp.value.trim()) images.push(inp.value.trim());
      });

      const productData = {
        name: document.getElementById('pName').value.trim(),
        fullTitle: document.getElementById('pFullTitle').value.trim(),
        price: document.getElementById('pPrice').value.trim(),
        mrp: document.getElementById('pMrp').value.trim(),
        category: document.getElementById('pCategory').value,
        sizes: selectedSizes,
        shippedFrom: document.getElementById('pShippedFrom').value.trim(),
        deliveryDays: document.getElementById('pDeliveryDays').value.trim(),
        description: document.getElementById('pDesc').value.trim(),
        specifications: specs,
        images: images,
        returnPolicy: document.getElementById('pReturnPolicy').value,
        showOnHome: document.getElementById('pVisibility').value === 'true',
        paymentType: document.getElementById('pPaymentType').value,
        addedByPhone: loggedUserPhone
      };

      const sellerProductsRef = ref(db, `seller-products/${loggedUserPhone}`);

      if (editingId) {
        // Update existing product in seller-products/{phone}
        update(ref(db, `seller-products/${loggedUserPhone}/${editingId}`), productData).then(() => {
          alert("Product updated successfully!");
          resetProductForm();
        });
      } else {
        // Create new product under seller-products/{phone}
        productData.createdAt = Date.now();
        const newRef = push(sellerProductsRef);
        set(newRef, productData).then(() => {
          alert("Product added successfully to your store!");
          resetProductForm();
        });
      }
    });

    // Reset Form back to Add mode
    window.resetProductForm = function() {
      adminProductForm.reset();
      document.getElementById('editingProductId').value = "";
      document.getElementById('formHeading').innerHTML = '<i class="fa-solid fa-circle-plus" style="color: var(--accent);"></i> Add New Product';
      document.getElementById('formTitleText').textContent = "Add New Product";
      document.getElementById('submitBtnText').textContent = "SAVE PRODUCT";
      document.getElementById('cancelEditBtn').style.display = "none";
      
      document.getElementById('specContainer').innerHTML = `
        <div class="spec-row">
          <input type="text" class="input-field spec-key" placeholder="Key (e.g. Color)">
          <input type="text" class="input-field spec-value" placeholder="Value (e.g. Black)">
          <button type="button" class="btn-secondary-action" onclick="this.parentElement.remove()" style="color:#ef4444;"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `;
      document.getElementById('galleryContainer').innerHTML = `
        <div class="gallery-image-row">
          <input type="url" class="input-field gallery-url" placeholder="IMAGE URL 1" required>
          <input type="file" class="file-input" accept="image/*" style="display: none;" onchange="uploadImageToImgBB(this)">
          <button type="button" class="btn-upload" onclick="this.previousElementSibling.click()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
        </div>
      `;
    };

    // Edit Product Function (Loads data into form)
    window.editProduct = function(id, itemJson) {
      const item = JSON.parse(decodeURIComponent(itemJson));
      
      document.getElementById('editingProductId').value = id;
      document.getElementById('pName').value = item.name || '';
      document.getElementById('pFullTitle').value = item.fullTitle || '';
      document.getElementById('pCategory').value = item.category || '';
      document.getElementById('pMrp').value = item.mrp || '';
      document.getElementById('pPrice').value = item.price || '';
      document.getElementById('pShippedFrom').value = item.shippedFrom || '';
      document.getElementById('pDeliveryDays').value = item.deliveryDays || 7;
      document.getElementById('pDesc').value = item.description || '';
      document.getElementById('pReturnPolicy').value = item.returnPolicy || '7 Days Hassle-Free Return';
      document.getElementById('pVisibility').value = item.showOnHome !== false ? 'true' : 'false';
      document.getElementById('pPaymentType').value = item.paymentType || 'Cash On Delivery & Online';

      document.querySelectorAll('input[name="sizes"]').forEach(cb => {
        cb.checked = item.sizes && item.sizes.includes(cb.value);
      });

      const specContainer = document.getElementById('specContainer');
      specContainer.innerHTML = '';
      if (item.specifications && Object.keys(item.specifications).length > 0) {
        Object.keys(item.specifications).forEach(k => {
          addSpecRow(k, item.specifications[k]);
        });
      } else {
        addSpecRow('', '');
      }

      const galleryContainer = document.getElementById('galleryContainer');
      galleryContainer.innerHTML = '';
      if (item.images && item.images.length > 0) {
        item.images.forEach(url => {
          addGalleryRow(url);
        });
      } else {
        addGalleryRow('');
      }

      document.getElementById('formHeading').innerHTML = '<i class="fa-solid fa-pen-to-square" style="color: var(--info);"></i> Edit Product';
      document.getElementById('formTitleText').textContent = "Edit Product";
      document.getElementById('submitBtnText').textContent = "UPDATE PRODUCT";
      document.getElementById('cancelEditBtn').style.display = "block";

      document.querySelector('[data-tab="tab-add-product"]').click();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // 2. LISTEN AND DISPLAY PRODUCTS FROM 'seller-products/{phone}'
    onValue(ref(db, `seller-products/${loggedUserPhone}`), (snapshot) => {
      const grid = document.getElementById('productsGrid');
      if (!snapshot.exists()) {
        grid.innerHTML = '<div class="empty-state">No products added yet.</div>';
        document.getElementById('statMyProducts').textContent = "0";
        return;
      }

      const products = snapshot.val();
      grid.innerHTML = "";
      let myCount = 0;

      Object.keys(products).forEach(id => {
        const item = products[id];
        myCount++;
        const encodedItem = encodeURIComponent(JSON.stringify(item));
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.images ? item.images[0] : ''}" style="width:100%; height:160px; object-fit:cover; border-radius:12px;" alt="Product">
          <h4 style="margin-top:8px; font-size:0.95rem;">${item.name}</h4>
          <div style="font-weight:800; color:var(--accent); font-size:1.05rem;">₹${item.price} <span style="font-size:0.75rem; color:var(--text-muted); text-decoration:line-through;">₹${item.mrp}</span></div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn btn-edit" onclick="editProduct('${id}', '${encodedItem}')"><i class="fa-solid fa-pen"></i> Edit</button>
            <button class="btn btn-delete" onclick="deleteProduct('${id}')"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('statMyProducts').textContent = myCount;
    });

    window.deleteProduct = (id) => {
      if (confirm("Are you sure you want to delete this product?")) {
        remove(ref(db, `seller-products/${loggedUserPhone}/${id}`));
      }
    };

    // 3. LISTEN AND FILTER ORDERS FOR THIS SELLER
    onValue(ref(db, 'orders'), (snapshot) => {
      const grid = document.getElementById('ordersGrid');
      if (!snapshot.exists()) {
        grid.innerHTML = '<div class="empty-state">No orders received yet.</div>';
        document.getElementById('statMyOrders').textContent = "0";
        return;
      }

      const allOrders = snapshot.val();
      let myOrderCount = 0;
      grid.innerHTML = "";

      Object.keys(allOrders).forEach(phone => {
        const userOrders = allOrders[phone];
        Object.keys(userOrders).forEach(orderId => {
          const order = userOrders[orderId];

          if (order.sellerPhone === loggedUserPhone || loggedUserPhone === "Admin") {
            myOrderCount++;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:8px;">
                <span style="font-weight:800; font-size:0.85rem;">ORDER #${orderId.substring(0,8)}</span>
                <span style="color:var(--success); font-weight:800; font-size:0.8rem;">${order.status || 'Placed'}</span>
              </div>
              <p style="font-weight:700; font-size:0.9rem; margin-top:8px;">Item: ${order.productName || 'CartItem'}</p>
              <p style="font-size:0.8rem; color:var(--text-muted);">Customer Phone: +91 ${phone}</p>
              <div style="margin-top:8px; font-weight:800; color:var(--accent); font-size:1.05rem;">Amount: ₹${order.price || order.totalAmount || 0}</div>
            `;
            grid.appendChild(card);
          }
        });
      });

      if (myOrderCount === 0) {
        grid.innerHTML = '<div class="empty-state">No orders received for your products yet.</div>';
      }

      document.getElementById('statMyOrders').textContent = myOrderCount;
    });
  </script>
</body>
</html>
