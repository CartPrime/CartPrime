<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartPrime - Admin Dashboard</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --primary-yellow: #f5a623;
      --primary-hover: #d48b16;
      --text-white: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --status-pending: #e74c3c;
      --status-resolved: #2ecc71;
      --btn-delete: #d9534f;
      --btn-delete-hover: #c9302c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 15px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: bold;
    }

    .logo-text span {
      color: var(--primary-yellow);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border-left: 4px solid var(--primary-yellow);
      padding: 12px 16px;
      border-radius: 6px;
    }

    .stat-card h3 {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stat-card p {
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (min-width: 768px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-box {
      width: 100%;
    }

    @media (min-width: 768px) {
      .search-box {
        width: auto;
      }
    }

    .search-box input {
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 4px;
      outline: none;
      width: 100%;
    }

    @media (min-width: 768px) {
      .search-box input {
        width: 260px;
      }
    }

    .search-box input:focus {
      border-color: var(--primary-yellow);
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
      flex: 1;
      text-align: center;
    }

    @media (min-width: 600px) {
      .filter-btn {
        flex: none;
      }
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary-yellow);
      color: var(--bg-dark);
      font-weight: bold;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 700px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    th {
      background-color: #262626;
      color: var(--primary-yellow);
      font-weight: 600;
    }

    tr:hover {
      background-color: #2a2a2a;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-pending {
      background-color: rgba(231, 76, 60, 0.2);
      color: var(--status-pending);
      border: 1px solid var(--status-pending);
    }

    .badge-resolved {
      background-color: rgba(46, 204, 113, 0.2);
      color: var(--status-resolved);
      border: 1px solid var(--status-resolved);
    }

    .action-group {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background-color: var(--primary-yellow);
      color: var(--bg-dark);
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-btn:hover {
      background-color: var(--primary-hover);
    }

    .action-btn:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }

    .view-btn {
      background-color: #3498db;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .view-btn:hover {
      background-color: #2980b9;
    }

    .delete-btn {
      background-color: var(--btn-delete);
      color: var(--text-white);
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .delete-btn:hover {
      background-color: var(--btn-delete-hover);
    }

    .msg-preview {
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--primary-yellow);
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      font-size: 18px;
      color: var(--primary-yellow);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-white);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-body {
      font-size: 14px;
      line-height: 1.6;
    }

    .modal-field {
      margin-bottom: 12px;
    }

    .modal-field label {
      color: var(--text-muted);
      font-size: 12px;
      display: block;
    }

    .modal-field span, .modal-field div {
      color: var(--text-white);
      font-size: 15px;
    }

    .full-msg-box {
      background: #121212;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 4px;
      margin-top: 5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-text">Cart<span>Prime</span> Admin</div>
      </div>
      <div style="color: var(--text-muted); font-size: 14px;">Complaint Resolution Portal</div>
    </header>

    <div class="dashboard-summary">
      <div class="stat-card">
        <h3>Total Complaints</h3>
        <p id="total-count">0</p>
      </div>
      <div class="stat-card">
        <h3>Pending</h3>
        <p id="pending-count">0</p>
      </div>
      <div class="stat-card">
        <h3>Resolved</h3>
        <p id="resolved-count">0</p>
      </div>
    </div>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" id="btn-all">All</button>
        <button class="filter-btn" id="btn-pending">Pending</button>
        <button class="filter-btn" id="btn-resolved">Resolved</button>
      </div>
      <div class="search-box">
        <input type="text" id="search-phone" placeholder="Search by Phone Number...">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Customer Phone</th>
            <th>Complaint Preview</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="complaint-table-body">
          <tr><td colspan="6" style="text-align: center;">Loading complaints...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="message-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Complaint Details</h2>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Ticket ID</label>
          <span id="modal-ticket-id">-</span>
        </div>
        <div class="modal-field">
          <label>Phone Number</label>
          <span id="modal-phone">-</span>
        </div>
        <div class="modal-field">
          <label>Date</label>
          <span id="modal-date">-</span>
        </div>
        <div class="modal-field">
          <label>Full Complaint Message</label>
          <div class="full-msg-box" id="modal-message">-</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc",
      authDomain: "cartprime-shopping.firebaseapp.com",
      databaseURL: "https://cartprime-shopping-default-rtdb.firebaseio.com",
      projectId: "cartprime-shopping",
      storageBucket: "cartprime-shopping.firebasestorage.app",
      messagingSenderId: "570068438689",
      appId: "1:570068438689:web:17b25f49f2b561fd29eae0",
      measurementId: "G-9GREWHMEYL"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let allComplaints = [];
    let currentFilter = 'All';

    // Helper: Date format cheyan
    function parseDate(itemData) {
      if (itemData.date) return itemData.date;
      if (itemData.createdAt) return itemData.createdAt;
      if (itemData.timestamp) {
        return new Date(itemData.timestamp).toLocaleDateString();
      }
      return 'N/A';
    }

    // Firebase Data Listener
    const complaintsRef = ref(database, 'complaints');
    onValue(complaintsRef, (snapshot) => {
      const data = snapshot.val();
      allComplaints = [];
      
      if (data) {
        Object.keys(data).forEach(key => {
          const item = data[key];
          allComplaints.push({
            id: key,
            phone: item.phone || item.userPhone || item.number || item.phoneNumber || 'N/A',
            message: item.message || item.issue || item.complaint || 'No Message Available',
            date: parseDate(item),
            status: item.status || 'Pending'
          });
        });
      }
      applyFiltersAndRender();
    });

    function renderTable(data) {
      const tbody = document.getElementById("complaint-table-body");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No complaints found</td></tr>`;
        return;
      }

      data.forEach((item) => {
        const row = document.createElement("tr");
        const statusClass = item.status === "Pending" ? "badge-pending" : "badge-resolved";
        const isResolved = item.status === "Resolved";

        row.innerHTML = `
          <td><strong>${item.id}</strong></td>
          <td>${item.phone}</td>
          <td><div class="msg-preview">${item.message}</div></td>
          <td>${item.date}</td>
          <td><span class="badge ${statusClass}">${item.status}</span></td>
          <td>
            <div class="action-group">
              <button class="view-btn">View</button>
              <button class="action-btn resolve-btn" ${isResolved ? "disabled" : ""}>
                ${isResolved ? "Solved" : "Solve"}
              </button>
              <button class="delete-btn">Delete</button>
            </div>
          </td>
        `;

        // View Button
        const viewBtn = row.querySelector('.view-btn');
        viewBtn.addEventListener('click', () => openModal(item));

        // Mark Resolved Button
        const resolveBtn = row.querySelector('.resolve-btn');
        if (!isResolved) {
          resolveBtn.addEventListener('click', () => resolveComplaint(item.id));
        }

        // Delete Button
        const deleteBtn = row.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => deleteComplaint(item.id));

        tbody.appendChild(row);
      });

      updateStats();
    }

    // Open Modal
    function openModal(item) {
      document.getElementById('modal-ticket-id').innerText = item.id;
      document.getElementById('modal-phone').innerText = item.phone;
      document.getElementById('modal-date').innerText = item.date;
      document.getElementById('modal-message').innerText = item.message;
      document.getElementById('message-modal').style.display = 'flex';
    }

    // Close Modal
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('message-modal').style.display = 'none';
    });

    // Close Modal on Overlay Click
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('message-modal');
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });

    // Mark Resolved
    function resolveComplaint(id) {
      const targetRef = ref(database, 'complaints/' + id);
      update(targetRef, { status: 'Resolved' })
        .catch((error) => console.error("Update failed: ", error));
    }

    // Delete Complaint
    function deleteComplaint(id) {
      if (confirm("Ee complaint delete cheyyanam enn urappanao?")) {
        const targetRef = ref(database, 'complaints/' + id);
        remove(targetRef)
          .catch((error) => console.error("Delete failed: ", error));
      }
    }

    function applyFiltersAndRender() {
      const searchQuery = document.getElementById("search-phone").value.trim().toLowerCase();
      let filtered = allComplaints;

      if (currentFilter !== 'All') {
        filtered = filtered.filter(c => c.status === currentFilter);
      }

      if (searchQuery !== '') {
        filtered = filtered.filter(c => String(c.phone).toLowerCase().includes(searchQuery));
      }

      renderTable(filtered);
    }

    function updateStats() {
      document.getElementById("total-count").innerText = allComplaints.length;
      document.getElementById("pending-count").innerText = allComplaints.filter(c => c.status === "Pending").length;
      document.getElementById("resolved-count").innerText = allComplaints.filter(c => c.status === "Resolved").length;
    }

    // Filter Buttons
    document.getElementById("btn-all").addEventListener("click", (e) => setFilter('All', e.target));
    document.getElementById("btn-pending").addEventListener("click", (e) => setFilter('Pending', e.target));
    document.getElementById("btn-resolved").addEventListener("click", (e) => setFilter('Resolved', e.target));

    function setFilter(status, element) {
      currentFilter = status;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");
      applyFiltersAndRender();
    }

    // Live Phone Search Input
    document.getElementById("search-phone").addEventListener("input", applyFiltersAndRender);
  </script>
</body>
</html>
