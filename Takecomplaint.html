<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartPrime - Complaint Management Dashboard</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --primary-yellow: #f5a623;
      --primary-hover: #d48b16;
      --text-white: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --status-pending: #e74c3c;
      --status-resolved: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      font-size: 26px;
      font-weight: bold;
    }

    .logo-text span {
      color: var(--primary-yellow);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      border-left: 4px solid var(--primary-yellow);
      padding: 15px 20px;
      border-radius: 6px;
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .stat-card p {
      font-size: 24px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 4px;
      outline: none;
      width: 250px;
    }

    .search-box input:focus {
      border-color: var(--primary-yellow);
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary-yellow);
      color: var(--bg-dark);
      font-weight: bold;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #262626;
      color: var(--primary-yellow);
      font-weight: 600;
    }

    tr:hover {
      background-color: #2a2a2a;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-pending {
      background-color: rgba(231, 76, 60, 0.2);
      color: var(--status-pending);
      border: 1px solid var(--status-pending);
    }

    .badge-resolved {
      background-color: rgba(46, 204, 113, 0.2);
      color: var(--status-resolved);
      border: 1px solid var(--status-resolved);
    }

    .action-btn {
      background-color: var(--primary-yellow);
      color: var(--bg-dark);
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-btn:hover {
      background-color: var(--primary-hover);
    }

    .action-btn:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-text">Cart<span>Prime</span> Admin</div>
      </div>
      <div>Complaint Resolution Portal</div>
    </header>

    <div class="dashboard-summary">
      <div class="stat-card">
        <h3>Total Complaints</h3>
        <p id="total-count">0</p>
      </div>
      <div class="stat-card">
        <h3>Pending</h3>
        <p id="pending-count">0</p>
      </div>
      <div class="stat-card">
        <h3>Resolved</h3>
        <p id="resolved-count">0</p>
      </div>
    </div>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" id="btn-all">All</button>
        <button class="filter-btn" id="btn-pending">Pending</button>
        <button class="filter-btn" id="btn-resolved">Resolved</button>
      </div>
      <div class="search-box">
        <input type="text" id="search-phone" placeholder="Search by Phone Number...">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Ticket ID</th>
            <th>Customer Phone</th>
            <th>Issue Title</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="complaint-table-body">
          <tr><td colspan="6" style="text-align: center;">Loading complaints...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc",
      authDomain: "cartprime-shopping.firebaseapp.com",
      databaseURL: "https://cartprime-shopping-default-rtdb.firebaseio.com",
      projectId: "cartprime-shopping",
      storageBucket: "cartprime-shopping.firebasestorage.app",
      messagingSenderId: "570068438689",
      appId: "1:570068438689:web:17b25f49f2b561fd29eae0",
      measurementId: "G-9GREWHMEYL"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let allComplaints = [];
    let currentFilter = 'All';

    // Firebase-il ninnu Complaints load cheyyunnu
    const complaintsRef = ref(database, 'complaints');
    onValue(complaintsRef, (snapshot) => {
      const data = snapshot.val();
      allComplaints = [];
      
      if (data) {
        Object.keys(data).forEach(key => {
          allComplaints.push({
            id: key,
            phone: data[key].phone || data[key].userPhone || data[key].number || 'N/A',
            issue: data[key].issue || data[key].complaint || 'No Details',
            date: data[key].date || 'N/A',
            status: data[key].status || 'Pending'
          });
        });
      }
      applyFiltersAndRender();
    });

    function renderTable(data) {
      const tbody = document.getElementById("complaint-table-body");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No complaints found</td></tr>`;
        return;
      }

      data.forEach((item) => {
        const row = document.createElement("tr");
        const statusClass = item.status === "Pending" ? "badge-pending" : "badge-resolved";
        const isResolved = item.status === "Resolved";

        row.innerHTML = `
          <td><strong>${item.id}</strong></td>
          <td>${item.phone}</td>
          <td>${item.issue}</td>
          <td>${item.date}</td>
          <td><span class="badge ${statusClass}">${item.status}</span></td>
          <td>
            <button class="action-btn" ${isResolved ? "disabled" : ""} data-id="${item.id}">
              ${isResolved ? "Solved" : "Mark Solved"}
            </button>
          </td>
        `;

        const btn = row.querySelector('.action-btn');
        if (!isResolved) {
          btn.addEventListener('click', () => resolveComplaint(item.id));
        }

        tbody.appendChild(row);
      });

      updateStats();
    }

    // Status maattan (Resolved aakkan)
    function resolveComplaint(id) {
      const complaintRef = ref(database, 'complaints/' + id);
      update(complaintRef, { status: 'Resolved' })
        .then(() => {
          alert('Complaint marked as Resolved!');
        })
        .catch((error) => {
          console.error("Error updating status: ", error);
        });
    }

    function applyFiltersAndRender() {
      const searchQuery = document.getElementById("search-phone").value.trim().toLowerCase();
      
      let filtered = allComplaints;

      if (currentFilter !== 'All') {
        filtered = filtered.filter(c => c.status === currentFilter);
      }

      if (searchQuery !== '') {
        filtered = filtered.filter(c => String(c.phone).toLowerCase().includes(searchQuery));
      }

      renderTable(filtered);
    }

    function updateStats() {
      document.getElementById("total-count").innerText = allComplaints.length;
      document.getElementById("pending-count").innerText = allComplaints.filter(c => c.status === "Pending").length;
      document.getElementById("resolved-count").innerText = allComplaints.filter(c => c.status === "Resolved").length;
    }

    // Event Listeners for Filters
    document.getElementById("btn-all").addEventListener("click", (e) => setFilter('All', e.target));
    document.getElementById("btn-pending").addEventListener("click", (e) => setFilter('Pending', e.target));
    document.getElementById("btn-resolved").addEventListener("click", (e) => setFilter('Resolved', e.target));

    function setFilter(status, element) {
      currentFilter = status;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");
      applyFiltersAndRender();
    }

    // Event Listener for Phone Search
    document.getElementById("search-phone").addEventListener("input", applyFiltersAndRender);

  </script>
</body>
</html>
