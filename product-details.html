<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details - CartPrime</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #000000;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --green: #16a34a;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-main); 
            padding-bottom: 90px; 
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: #f1f5f9;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1rem;
            transition: 0.2s;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: 32px;
            }
        }

        .image-section {
            position: relative;
        }

        .main-img-container {
            position: relative;
            width: 100%;
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .image-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .image-slider::-webkit-scrollbar { display: none; }

        .image-slide {
            min-width: 100%;
            scroll-snap-align: start;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-container {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            background: #fff;
            transition: 0.2s;
        }

        .thumb.active {
            border-color: var(--primary);
        }

        .wishlist-container, .share-container {
            position: absolute;
            top: 12px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
            z-index: 2;
        }

        .wishlist-container { right: 12px; }
        .share-container { right: 58px; }

        .wishlist-container i { color: #64748b; transition: 0.2s; }
        .wishlist-container.active i { color: #ef4444; }

        .info-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .p-name {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 16px;
        }

        .price {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .mrp {
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .discount {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--green);
            background: #dcfce7;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .earn-banner {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            color: #0284c7;
            padding: 12px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .earn-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .size-box-wrapper {
            margin-bottom: 20px;
        }

        .size-title {
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .size-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .size-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .policy-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .delivery-highlight-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .policy-row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .policy-tag-card {
            padding: 10px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .return-available { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .return-not-available { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .cod-highlight-tag { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
        .cod-disabled-tag { background: #f8fafc; color: #64748b; }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .trust-item i {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .trust-item span {
            display: block;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .specs-box {
            margin-bottom: 20px;
        }

        .specs-box h4 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.82rem;
        }

        .spec-key { color: var(--text-muted); font-weight: 600; }
        .spec-val { font-weight: 700; }

        .desc-text {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .reviews-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .rating-summary-container {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .avg-score-box {
            text-align: center;
            padding-right: 16px;
            border-right: 1px solid var(--border-color);
        }

        .avg-score {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1;
        }

        .rating-bars {
            flex-grow: 1;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .progress-bg {
            flex-grow: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill { height: 100%; border-radius: 3px; }

        .review-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .reviewer-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-bottom: 6px;
        }

        .reviewer-name { font-weight: 700; }
        .review-date { color: var(--text-muted); }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .star-green { color: #16a34a; }
        .star-yellow { color: #f59e0b; }
        .star-orange { color: #f97316; }
        .star-red { color: #ef4444; }

        .sticky-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            border-top: 1px solid var(--border-color);
            z-index: 99;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            justify-content: flex-end;
        }

        .buy-now {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            max-width: 220px;
        }

        .buy-now:active { transform: scale(0.98); }

        .out-btn {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .opacity-0 { opacity: 0; }
        .pointer-events-none { pointer-events: none; }
    </style>
</head>
<body>

    <div class="loader-overlay" id="pageLoader">
        <div class="spinner"></div>
    </div>

    <header>
        <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
        <span class="header-title">Product Details</span>
        <div style="width: 38px;"></div>
    </header>

    <div class="container">
        <div class="product-grid" id="productDetail"></div>
    </div>

    <div class="sticky-action" id="stickyAction"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc", 
            authDomain: "cartprime-shopping.firebaseapp.com", 
            projectId: "cartprime-shopping", 
            storageBucket: "cartprime-shopping.firebasestorage.app", 
            messagingSenderId: "570068438689", 
            appId: "1:570068438689:web:17b25f49f2b561fd29eae0", 
            measurementId: "G-9GREWHMEYL" 
        };
        
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app); 
        
        const urlParams = new URLSearchParams(window.location.search); 
        const productId = urlParams.get('id'); 
        
        const refCode = urlParams.get('ref');
        if (refCode) {
            localStorage.setItem('referredBy', refCode);
        }

        let selectedProductSize = null;
        let isApprovedEarner = false;

        const userId = localStorage.getItem('userId');
        const guestKey = localStorage.getItem('guestUserId') || 'guest_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('guestUserId', guestKey);

        const currentActiveUserId = userId || guestKey;

        async function checkEarnerStatus() {
            if (!userId) return false;
            try {
                const earnerSnap = await get(ref(db, `earners/${userId}`));
                if (earnerSnap.exists() && earnerSnap.val().status === 'approved') {
                    return true;
                }
            } catch (err) {
                console.error("Error checking earner status:", err);
            }
            return false;
        }

        function getEstimatedDeliveryDate() {
            const today = new Date();
            const startDate = new Date(today);
            startDate.setDate(today.getDate() + 5);
            
            const endDate = new Date(today);
            endDate.setDate(today.getDate() + 7);
            
            const options = { month: 'short', day: 'numeric' };
            const startStr = startDate.toLocaleDateString('en-US', options);
            const endStr = endDate.toLocaleDateString('en-US', options);
            
            return `Delivered by ${startStr} - ${endStr}`;
        }

        function hideLoader() {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                loader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loader.remove(), 500);
            }
        }

        function track6SecView(pId) {
            if (!pId) return;
            setTimeout(() => {
                const viewRef = ref(db, `products/${pId}/views`);
                get(viewRef).then((snapshot) => {
                    let currentViews = snapshot.exists() ? snapshot.val() : 0;
                    set(viewRef, currentViews + 1);
                }).catch(err => console.error("View count update failed:", err));
            }, 6000); 
        }

        get(child(ref(db), `wishlist/${currentActiveUserId}/${productId}`)).then(snap => { 
            if(snap.exists() && document.getElementById('wishlistHeart')) {
                document.getElementById('wishlistHeart').classList.add('active'); 
            }
        });

        async function initPage() {
            isApprovedEarner = await checkEarnerStatus();

            if (productId) {
                get(child(ref(db), `products/${productId}`)).then((productSnap) => {
                    if (productSnap.exists()) {
                        const productData = productSnap.val();
                        const reviewsData = productData.reviews || null;
                        renderProduct(productData, reviewsData); 
                        track6SecView(productId);
                    } else {
                        document.getElementById('productDetail').innerHTML = "<p style='padding: 20px; font-weight: 700;'>Product not found!</p>";
                    }
                    hideLoader();
                }).catch(() => {
                    hideLoader();
                });
            } else {
                hideLoader();
            }
        }

        initPage();

        function getStarClass(rating) {
            const r = Math.round(rating);
            if (r === 1) return 'star-red';
            if (r === 2) return 'star-orange';
            if (r === 3) return 'star-yellow';
            return 'star-green';
        }

        function getBgColor(rating) {
            const r = Math.round(rating);
            if (r === 1) return '#ef4444';
            if (r === 2) return '#f97316';
            if (r === 3) return '#f59e0b';
            return '#16a34a';
        }

        function renderColorStars(rating) {
            let stars = '';
            const colorClass = getStarClass(rating);
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) {
                    stars += `<i class="fa-solid fa-star ${colorClass}"></i>`;
                } else if (i - 0.5 <= rating) {
                    stars += `<i class="fa-solid fa-star-half-stroke ${colorClass}"></i>`;
                } else {
                    stars += `<i class="fa-regular fa-star" style="color:#cbd5e1;"></i>`;
                }
            }
            return stars;
        }

        function renderProduct(p, reviews) {
            let specsHTML = ""; 
            if (p.specs) {
                const specEntries = Object.entries(p.specs);
                specsHTML += `<div class="specs-grid">`;
                specEntries.forEach(([k, v]) => {
                    specsHTML += `
                        <div class="spec-item">
                            <span class="spec-key">${k}</span>
                            <span class="spec-val">${v}</span>
                        </div>`;
                });
                specsHTML += `</div>`;
            }

            let reviewsBoxHTML = '';
            if (reviews && Object.keys(reviews).length > 0) {
                let reviewsListHTML = '';
                let totalRatingSum = 0;
                const reviewsArr = Object.values(reviews);
                const reviewCount = reviewsArr.length;
                let starCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };

                reviewsArr.forEach(r => {
                    const ratingVal = parseInt(r.rating || 5);
                    totalRatingSum += ratingVal;
                    if (starCounts[ratingVal] !== undefined) {
                        starCounts[ratingVal]++;
                    }

                    const dateStr = r.date || '';
                    const starBg = getBgColor(ratingVal);

                    reviewsListHTML += `
                        <div class="review-card">
                            <div class="reviewer-info">
                                <span class="reviewer-name">${r.userName || r.name || 'Verified Customer'}</span>
                                <span class="review-date">${dateStr}</span>
                            </div>
                            <div class="rating-badge" style="background:${starBg};">
                                <span>${ratingVal}</span> <i class="fa-solid fa-star" style="font-size: 0.65rem;"></i>
                            </div>
                            <p style="font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;">${r.comment || r.review || ''}</p>
                        </div>
                    `;
                });

                const avgRating = (totalRatingSum / reviewCount).toFixed(1);

                let ratingBarsHTML = '';
                [5, 4, 3, 2, 1].forEach(starNum => {
                    const count = starCounts[starNum];
                    const pct = Math.round((count / reviewCount) * 100);
                    const barColor = getBgColor(starNum);

                    ratingBarsHTML += `
                        <div class="bar-row">
                            <span style="width: 15px;">${starNum}★</span>
                            <div class="progress-bg">
                                <div class="progress-fill" style="width: ${pct}%; background: ${barColor};"></div>
                            </div>
                            <span style="width: 35px; text-align: right;">${pct}%</span>
                        </div>
                    `;
                });

                reviewsBoxHTML = `
                    <div class="reviews-box">
                        <div class="reviews-header">
                            <h4 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; margin-bottom: 12px;">Ratings & Reviews</h4>
                            <div class="rating-summary-container">
                                <div class="avg-score-box">
                                    <span class="avg-score">${avgRating}</span>
                                    <div style="font-size: 0.85rem; margin: 4px 0;">${renderColorStars(avgRating)}</div>
                                    <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700;">${reviewCount} Rating${reviewCount !== 1 ? 's' : ''}</span>
                                </div>
                                <div class="rating-bars">
                                    ${ratingBarsHTML}
                                </div>
                            </div>
                        </div>
                        <div class="reviews-list">
                            ${reviewsListHTML}
                        </div>
                    </div>
                `;
            }
            
            const isOut = p.outOfStock === true; 
            const returnStatus = p.return ? (p.return.toString().toLowerCase().trim() === 'true' || p.return === true || p.return.toString().toLowerCase().trim() === 'available') : false;
            const codStatus = p.cod ? (p.cod.toString().toLowerCase().trim() === 'yes' || p.cod.toString().toLowerCase().trim() === 'true' || p.cod === true || p.cod.toString().toLowerCase().trim() === 'available') : false;

            const fullTitle = p.title || p.pTitle || p.name; 
            const cleanPrice = p.price.toString().replace(/,/g, '').replace(/[^\d.]/g, ''); 
            const displayPrice = parseFloat(cleanPrice) || 0;

            const baseMrp = p.mrp ? parseFloat(p.mrp.toString().replace(/,/g, '').replace(/[^\d.]/g, '')) : Math.round(displayPrice * 1.35);
            const discountPct = baseMrp > displayPrice ? Math.round(((baseMrp - displayPrice) / baseMrp) * 100) : 0;

            const commissionAmount = p.commission ? parseFloat(p.commission) : Math.round(displayPrice * 0.05);

            const availableSizes = p.sizes || [];
            const freeSizeFound = availableSizes.find(sz => sz.toString().toLowerCase().trim() === 'free size');
            if (freeSizeFound) {
                selectedProductSize = freeSizeFound;
            } else {
                selectedProductSize = null;
            }

            let sizeHTML = "";
            if (availableSizes.length > 0) {
                sizeHTML = `
                <div class="size-box-wrapper">
                    <div class="size-title">
                        <span>Select Size:</span>
                        <span id="selectedSizeLabel" style="color: var(--text-muted); font-weight: 600;">${selectedProductSize ? selectedProductSize : 'None'}</span>
                    </div>
                    <div class="size-container">
                        ${availableSizes.map(sz => {
                            const isFree = sz.toString().toLowerCase().trim() === 'free size';
                            return `<button class="size-btn ${isFree ? 'active' : ''}" onclick="window.selectSize(this, '${sz}')">${sz}</button>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            const estimatedDeliveryText = getEstimatedDeliveryDate();

            const earnBannerHTML = isApprovedEarner ? `
                <div class="earn-banner">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-coins" style="color: #0284c7; font-size: 1.1rem;"></i>
                        <span>Earn <b>₹${commissionAmount}</b> commission on successful sale!</span>
                    </div>
                    <button class="earn-btn" id="earnMoneyBtn">
                        <i class="fa-solid fa-share-nodes"></i> Earn Money
                    </button>
                </div>
            ` : '';

            document.getElementById('productDetail').innerHTML = `
                <div class="image-section">
                    <div class="main-img-container">
                        <div class="image-slider" id="mainSlider">
                            ${p.images.map(img => `<div class="image-slide"><img src="${img}" class="main-img"></div>`).join('')}
                        </div>
                        
                        <div class="share-container" id="productShareBtn" title="Share Product">
                            <i class="fa-solid fa-share-nodes"></i>
                        </div>

                        <div class="wishlist-container" id="wishlistHeart">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                    </div>
                    <div class="thumb-container">${p.images.map((img, i) => `<img src="${img}" class="thumb ${i === 0 ? 'active' : ''}" onclick="window.changeImg(this, ${i})">`).join('')}</div>
                </div>
                <div class="info-section">
                    <h1 class="p-name">${fullTitle}</h1> 
                    
                    <div class="price-box" id="animatedPriceBox">
                        ${discountPct > 0 ? `<span class="mrp">₹${baseMrp.toLocaleString('en-IN')}</span>` : ''}
                        <span class="price">₹${displayPrice.toLocaleString('en-IN')}</span>
                        ${discountPct > 0 ? `<span class="discount">${discountPct}% off</span>` : ''}
                    </div>

                    ${earnBannerHTML}

                    ${sizeHTML}

                    <div class="policy-container">
                        <div class="delivery-highlight-box">
                            <i class="fa-solid fa-truck-fast text-lg"></i> 
                            <span>${estimatedDeliveryText}</span>
                        </div>

                        <div class="policy-row-grid">
                            <div class="policy-tag-card ${returnStatus ? 'return-available' : 'return-not-available'}">
                                <i class="fa ${returnStatus ? 'fa-arrow-rotate-left' : 'fa-times-circle'}"></i> 
                                <span>${returnStatus ? '7 Days Return Available' : 'No Return Policy'}</span>
                            </div>
                            <div class="policy-tag-card ${codStatus ? 'cod-highlight-tag' : 'cod-disabled-tag'}">
                                <i class="fa ${codStatus ? 'fa-wallet' : 'fa-times-circle'}"></i> 
                                <span>${codStatus ? 'Cash on Delivery Available' : 'COD Not Available'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="trust-grid">
                        <div class="trust-item">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>100% Authentic Product</span>
                        </div>
                        <div class="trust-item">
                            <i class="fa-solid fa-truck-fast"></i>
                            <span>Fast & Free Shipping</span>
                        </div>
                        <div class="trust-item">
                            <i class="fa-solid fa-lock"></i>
                            <span>Secure Checkout</span>
                        </div>
                    </div>

                    <div class="specs-box">
                        <h4>Specifications</h4>
                        ${specsHTML || '<p style="color: var(--text-muted); font-size: 0.9rem;">No specifications available.</p>'}
                    </div>

                    <div class="desc-text">${p.desc || ''}</div>

                    ${reviewsBoxHTML}
                </div>`;
                
            document.getElementById('stickyAction').innerHTML = `
                <div style="display: flex; flex-direction: column; line-height: 1.2;">
                    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px;">Total Price</span>
                    <span style="font-size: 1.2rem; font-weight: 800;">₹${displayPrice.toLocaleString('en-IN')}</span>
                </div>
                <div class="btn-group">
                    <button class="buy-now ${isOut ? 'out-btn' : ''}" ${isOut ? 'disabled' : ''} 
                        onclick="window.proceedToCheckout('${productId}', \`${fullTitle.replace(/'/g, "\\'")}\`, ${displayPrice}, ${baseMrp}, ${discountPct}, '${p.images[0]}', ${returnStatus}, ${codStatus}, ${availableSizes.length > 0}, ${commissionAmount})">
                        ${isOut ? 'OUT OF STOCK' : 'BUY NOW'}
                    </button>
                </div>`;
            
            document.getElementById('productShareBtn').addEventListener('click', () => {
                window.shareProduct(fullTitle, false);
            });

            if (isApprovedEarner && document.getElementById('earnMoneyBtn')) {
                document.getElementById('earnMoneyBtn').addEventListener('click', () => {
                    window.shareProduct(fullTitle, true);
                });
            }

            document.getElementById('wishlistHeart').addEventListener('click', () => {
                window.toggleWishlist(productId, fullTitle, displayPrice, p.images[0]);
            });

            setTimeout(() => {
                const slider = document.getElementById('mainSlider');
                if (slider) {
                    slider.addEventListener('scroll', () => {
                        const index = Math.round(slider.scrollLeft / slider.offsetWidth);
                        const thumbs = document.querySelectorAll('.thumb');
                        thumbs.forEach((t, i) => t.classList.toggle('active', i === index));
                    });
                }
            }, 50);
        }

        window.selectSize = (btn, size) => {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedProductSize = size;
            const label = document.getElementById('selectedSizeLabel');
            if(label) label.innerText = size;
        };

        window.shareProduct = (title, isAffiliateShare = false) => {
            const activeRefUser = userId || guestKey;
            const baseUrl = window.location.origin + window.location.pathname;
            const affiliateUrl = `${baseUrl}?id=${productId}&ref=${activeRefUser}`;
            
            const shareMessage = isAffiliateShare
                ? `🛒 *Check out this product on CartPrime!* \n\n🔥 ${title}\n\n👇 Buy now using my link:`
                : `🛒 *Check out this product on CartPrime!* \n\n🔥 ${title}\n\n👇 Buy now:`;
            
            const shareData = {
                title: title,
                text: `${shareMessage} ${affiliateUrl}`,
                url: affiliateUrl
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage + " " + affiliateUrl)}`;
                window.open(whatsappUrl, '_blank');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(affiliateUrl).then(() => {
                        Swal.fire({ 
                            title: isAffiliateShare ? 'Earn Link Copied!' : 'Link Copied!', 
                            text: isAffiliateShare ? 'Share this link to earn commission when someone buys.' : 'Product link copied to clipboard.', 
                            icon: 'success', 
                            toast: true, 
                            position: 'top-end', 
                            showConfirmButton: false, 
                            timer: 2500 
                        });
                    });
                }
            }
        };

        window.toggleWishlist = (id, name, price, img) => {
            const heart = document.getElementById('wishlistHeart'); 
            const wRef = ref(db, `wishlist/${currentActiveUserId}/${id}`);
            
            get(wRef).then(snap => { 
                if (snap.exists()) { 
                    set(wRef, null).then(() => heart.classList.remove('active')); 
                } else { 
                    set(wRef, { id, name, price, image: img }).then(() => heart.classList.add('active')); 
                } 
            });
        };
        
        window.changeImg = (el, index) => { 
            const slider = document.getElementById('mainSlider');
            if (slider) {
                slider.scrollTo({ left: slider.offsetWidth * index, behavior: 'smooth' });
            }
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active')); 
            el.classList.add('active'); 
        };
        
        window.proceedToCheckout = (id, name, price, mrp, discount, img, ret, cod, hasSizes, comm) => { 
            if (hasSizes && !selectedProductSize) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Please Select a Size',
                    text: 'Choose a size before proceeding to checkout.',
                    confirmButtonColor: '#000'
                });
                return;
            }

            const referredBy = localStorage.getItem('referredBy') || null;

            localStorage.setItem('pendingOrder', JSON.stringify({ 
                productId: id, 
                productName: name, 
                price: parseFloat(price), 
                mrp: parseFloat(mrp),
                discount: parseInt(discount),
                productImage: img, 
                return: ret,
                returnPolicy: ret, 
                isReturnable: ret, 
                cod: cod,
                selectedSize: selectedProductSize || 'N/A',
                referredBy: referredBy,
                commissionAmount: comm
            })); 
            location.href = 'checkout.html'; 
        };
    </script>
</body>
</html>
