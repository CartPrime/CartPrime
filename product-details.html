<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | CartPrime</title>
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/v4rQ6Th6/545404-200-removebg-preview.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Theme Script -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        :root { 
            --primary: #0f172a; 
            --primary-invert: #fff;
            --bg: #ffffff; 
            --grey: #f8fafc; 
            --border-color: #e2e8f0;
            --red: #ef4444; 
            --surface: #f8fafc;
            --text-muted: #64748b;
            --green: #16a34a;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --drawer-bg: #fff;
        }

        [data-theme="dark"] {
            --primary: #f8fafc; 
            --primary-invert: #0f172a;
            --bg: #0f172a; 
            --grey: #1e293b; 
            --border-color: #334155;
            --surface: #1e293b;
            --text-muted: #94a3b8;
            --nav-bg: rgba(15, 23, 42, 0.9);
            --drawer-bg: #0f172a;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            outline: none !important;
        }

        *:focus {
            outline: none !important;
            box-shadow: none !important;
        }
        
        body { 
            background: var(--bg); 
            color: var(--primary); 
            overflow-x: hidden; 
            padding-bottom: 120px; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Nav Bar */
        .nav { 
            padding: 16px 6%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color); 
            position: sticky; 
            top: 0; 
            background: var(--nav-bg); 
            backdrop-filter: blur(12px);
            z-index: 100; 
        }
        .nav a { 
            text-decoration: none; 
            color: var(--primary); 
            font-weight: 700; 
            font-size: 0.85rem; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }
        .nav a:hover { color: var(--text-muted); }

        .brand-badge {
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(34, 197, 94, 0.1);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Main Container */
        .product-container { 
            display: flex; 
            flex-wrap: wrap; 
            padding: 30px 6%; 
            gap: 40px; 
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .image-section { flex: 1; min-width: 340px; }
        
        .main-img-container { 
            width: 100%; 
            height: 480px; 
            background: var(--surface); 
            border-radius: 20px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid var(--border-color); 
            position: relative; 
        }
        .main-img { max-width: 85%; max-height: 85%; object-fit: contain; transition: 0.3s; }
        
        .image-slider {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .image-slider::-webkit-scrollbar { display: none; }
        .image-slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Action Floating Icons */
        .wishlist-container, .share-container { 
            position: absolute; 
            z-index: 10; 
            cursor: pointer; 
            background: var(--bg); 
            border-radius: 50%; 
            transition: 0.2s; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border-color);
        }
        .share-container { top: 15px; right: 15px; color: var(--primary); }
        .wishlist-container { top: 65px; right: 15px; color: var(--text-muted); }
        .wishlist-container.active { color: #ef4444; }

        /* Thumbnails */
        .thumb-container { 
            display: flex; 
            gap: 12px; 
            margin-top: 16px; 
            overflow-x: auto; 
            padding: 4px 2px; 
            scrollbar-width: none; 
        }
        .thumb-container::-webkit-scrollbar { display: none; }
        .thumb { 
            width: 70px; 
            height: 70px; 
            object-fit: contain; 
            background: var(--surface);
            border-radius: 12px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            flex-shrink: 0; 
            padding: 6px;
            transition: 0.2s;
        }
        .thumb.active { border-color: var(--primary); background: var(--bg); }
        
        /* Info Section */
        .info-section { flex: 1.2; min-width: 340px; }
        .p-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; line-height: 1.3; color: var(--primary); }
        
        .price-box { 
            display: flex; 
            align-items: baseline; 
            gap: 12px; 
            margin: 15px 0; 
        }
        .price { font-size: 2.2rem; font-weight: 800; color: var(--primary); }
        .mrp { font-size: 1.1rem; font-weight: 600; color: var(--text-muted); text-decoration: line-through; }
        .discount { font-size: 1.1rem; font-weight: 700; color: var(--green); background: rgba(22, 163, 74, 0.1); padding: 2px 8px; border-radius: 6px; }

        /* Guarantee Grid Box */
        .trust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            margin: 20px 0;
            text-align: center;
        }
        .trust-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: var(--primary); }
        .trust-item i { font-size: 1.2rem; color: var(--green); }

        /* Size Selection */
        .size-box-wrapper { margin: 20px 0; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .size-title { font-size: 0.85rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .size-container { display: flex; gap: 10px; flex-wrap: wrap; }
        .size-btn {
            padding: 10px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .size-btn.active { background: var(--primary); color: var(--primary-invert); border-color: var(--primary); }

        /* Pincode Check Feature */
        .pincode-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            background: var(--surface);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .pincode-input {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .pincode-btn {
            background: var(--primary);
            color: var(--primary-invert);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Specs & Reviews */
        .specs-box, .reviews-box { 
            margin-top: 25px; 
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }
        .specs-box h4, .reviews-header h4 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 800; }
        
        .spec-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; }
        .spec-row:last-child { border-bottom: none; }
        .spec-key { width: 140px; color: var(--text-muted); font-weight: 600; }
        .spec-val { font-weight: 700; }

        .review-card { background: var(--bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-top: 10px; }
        .reviewer-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .reviewer-name { font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }
        .verified-badge { color: var(--green); font-size: 0.75rem; }

        /* Sticky Action Bar */
        .bottom-action-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: var(--bg); padding: 14px 6%; 
            box-shadow: 0 -10px 25px rgba(0,0,0,0.05); 
            display: flex; align-items: center; justify-content: space-between; 
            z-index: 1000; border-top: 1px solid var(--border-color); 
        }
        .buy-now { 
            width: 100%; padding: 15px 30px; background: var(--primary); color: var(--primary-invert); 
            border: none; border-radius: 12px; font-weight: 800; font-size: 0.95rem; 
            cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .buy-now:hover { opacity: 0.95; }
    </style>
</head>
<body>

    <div id="pageLoader" class="fixed inset-0 z-[9999] bg-[var(--bg)] flex flex-col items-center justify-center gap-4">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-[var(--primary)] rounded-full animate-spin"></div>
    </div>

    <nav class="nav">
        <a href="index.html"><i class="fa fa-arrow-left"></i> STORE</a>
        <div class="brand-badge"><i class="fa-solid fa-shield-halved"></i> 100% Authentic</div>
    </nav>
    
    <div class="product-container" id="productDetail"></div>
    
    <div class="bottom-action-bar" id="stickyAction"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc", 
            authDomain: "cartprime-shopping.firebaseapp.com", 
            projectId: "cartprime-shopping", 
            storageBucket: "cartprime-shopping.firebasestorage.app", 
            messagingSenderId: "570068438689", 
            appId: "1:570068438689:web:17b25f49f2b561fd29eae0", 
            measurementId: "G-9GREWHMEYL" 
        };
        
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app); 
        
        const urlParams = new URLSearchParams(window.location.search); 
        const productId = urlParams.get('id'); 
        let selectedProductSize = null;

        const guestKey = localStorage.getItem('guestUserId') || 'guest_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('guestUserId', guestKey);

        function hideLoader() {
            const loader = document.getElementById('pageLoader');
            if (loader) loader.remove();
        }

        if (productId) {
            get(child(ref(db), `products/${productId}`)).then((productSnap) => {
                if (productSnap.exists()) {
                    renderProduct(productSnap.val(), productSnap.val().reviews || null); 
                } else {
                    document.getElementById('productDetail').innerHTML = "<p>Product not found!</p>";
                }
                hideLoader();
            }).catch(hideLoader);
        } else {
            hideLoader();
        }

        function renderProduct(p, reviews) {
            const fullTitle = p.title || p.pTitle || p.name; 
            const cleanPrice = p.price.toString().replace(/,/g, '').replace(/[^\d.]/g, ''); 
            const displayPrice = parseFloat(cleanPrice) || 0;
            const baseMrp = p.mrp ? parseFloat(p.mrp.toString().replace(/,/g, '').replace(/[^\d.]/g, '')) : Math.round(displayPrice * 1.35);
            const discountPct = baseMrp > displayPrice ? Math.round(((baseMrp - displayPrice) / baseMrp) * 100) : 0;

            const availableSizes = p.sizes || [];

            document.getElementById('productDetail').innerHTML = `
                <div class="image-section">
                    <div class="main-img-container">
                        <div class="image-slider" id="mainSlider">
                            ${p.images.map(img => `<div class="image-slide"><img src="${img}" class="main-img"></div>`).join('')}
                        </div>
                        <div class="share-container" onclick="window.shareProduct('${fullTitle}')"><i class="fa-solid fa-share-nodes"></i></div>
                        <div class="wishlist-container" id="wishlistHeart" onclick="window.toggleWishlist('${productId}')"><i class="fa-solid fa-heart"></i></div>
                    </div>
                    <div class="thumb-container">${p.images.map((img, i) => `<img src="${img}" class="thumb ${i === 0 ? 'active' : ''}" onclick="window.changeImg(this, ${i})">`).join('')}</div>
                </div>

                <div class="info-section">
                    <h1 class="p-name">${fullTitle}</h1> 
                    
                    <div class="price-box">
                        <span class="price">₹${displayPrice.toLocaleString('en-IN')}</span>
                        ${discountPct > 0 ? `<span class="mrp">₹${baseMrp.toLocaleString('en-IN')}</span>` : ''}
                        ${discountPct > 0 ? `<span class="discount">${discountPct}% OFF</span>` : ''}
                    </div>

                    <!-- Trust Signals Badge Box -->
                    <div class="trust-grid">
                        <div class="trust-item"><i class="fa-solid fa-truck-fast"></i> Express Shipping</div>
                        <div class="trust-item"><i class="fa-solid fa-shield-check"></i> Quality Assured</div>
                        <div class="trust-item"><i class="fa-solid fa-rotate-left"></i> Easy Returns</div>
                    </div>

                    <!-- Delivery Check Feature -->
                    <div class="pincode-box">
                        <i class="fa-solid fa-location-dot" style="align-self:center; color:var(--text-muted)"></i>
                        <input type="text" id="pincodeInput" class="pincode-input" placeholder="Enter Pincode for Delivery" maxlength="6">
                        <button class="pincode-btn" onclick="checkPincode()">Check</button>
                    </div>
                    <p id="pincodeStatus" style="font-size:0.78rem; font-weight:700; margin-top:-12px; margin-bottom:15px;"></p>

                    ${availableSizes.length > 0 ? `
                    <div class="size-box-wrapper">
                        <div class="size-title"><span>Select Size</span></div>
                        <div class="size-container">
                            ${availableSizes.map(sz => `<button class="size-btn" onclick="window.selectSize(this, '${sz}')">${sz}</button>`).join('')}
                        </div>
                    </div>` : ''}

                    <div class="specs-box">
                        <h4>Product Details</h4>
                        <div class="desc-text" style="font-size:0.9rem; color:var(--text-muted); line-height:1.6">${p.desc || 'No description available.'}</div>
                    </div>
                </div>`;
                
            document.getElementById('stickyAction').innerHTML = `
                <div>
                    <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700;">TOTAL PRICE</div>
                    <div style="font-size: 1.3rem; font-weight: 800;">₹${displayPrice.toLocaleString('en-IN')}</div>
                </div>
                <button class="buy-now" onclick="window.proceedToCheckout('${productId}', \`${fullTitle}\`, ${displayPrice}, ${baseMrp}, ${discountPct}, '${p.images[0]}')">
                    <i class="fa-solid fa-bolt"></i> Order Now
                </button>`;
        }

        window.checkPincode = () => {
            const pin = document.getElementById('pincodeInput').value;
            const status = document.getElementById('pincodeStatus');
            if(pin.length === 6 && !isNaN(pin)) {
                status.style.color = "var(--green)";
                status.innerHTML = "<i class='fa-solid fa-circle-check'></i> Delivery Available! Standard delivery in 3-5 days.";
            } else {
                status.style.color = "var(--red)";
                status.innerText = "Please enter a valid 6-digit pincode.";
            }
        };

        window.selectSize = (btn, size) => {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedProductSize = size;
        };

        window.changeImg = (el, index) => { 
            const slider = document.getElementById('mainSlider');
            if (slider) slider.scrollTo({ left: slider.offsetWidth * index, behavior: 'smooth' });
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active')); 
            el.classList.add('active'); 
        };

        window.proceedToCheckout = (id, name, price, mrp, discount, img) => { 
            localStorage.setItem('pendingOrder', JSON.stringify({ productId: id, productName: name, price, mrp, discount, productImage: img, selectedSize: selectedProductSize || 'N/A' })); 
            location.href = 'checkout.html'; 
        };
    </script>
</body> 
</html>
