<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wallet-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 20px;
            color: #2b3674;
        }

        .card {
            background: linear-gradient(135deg, #4318ff 0%, #868CFF 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
            margin-bottom: 24px;
        }

        .card .balance-title {
            font-size: 14px;
            opacity: 0.8;
        }

        .card .balance {
            font-size: 32px;
            font-weight: bold;
            margin: 8px 0 20px 0;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add {
            background-color: #4318ff;
            color: white;
        }

        .btn-add:hover {
            background-color: #3311cc;
        }

        .btn-send {
            background-color: #f4f7fe;
            color: #2b3674;
        }

        .btn-send:hover {
            background-color: #e2e8f0;
        }

        .transactions h3 {
            font-size: 16px;
            color: #2b3674;
            margin-bottom: 16px;
        }

        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-title {
            font-weight: 600;
            color: #2b3674;
            font-size: 14px;
        }

        .item-date {
            font-size: 12px;
            color: #a3edd9;
            color: #a3aed0;
        }

        .amount {
            font-weight: 600;
            font-size: 14px;
        }

        .credit {
            color: #05cd99;
        }

        .debit {
            color: #ee5d50;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <!-- Header -->
        <div class="header">
            <h2>My Wallet</h2>
            <span style="font-size: 20px;">🔔</span>
        </div>

        <!-- Virtual Card -->
        <div class="card">
            <div class="balance-title">Total Balance</div>
            <div class="balance">₹ <span id="total-balance">24,500.00</span></div>
            <div class="card-details">
                <span>**** **** **** 4821</span>
                <span>12/28</span>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="actions">
            <button class="btn btn-add" onclick="addMoney()">+ Add Money</button>
            <button class="btn btn-send" onclick="sendMoney()">- Send</button>
        </div>

        <!-- Transaction History -->
        <div class="transactions">
            <h3>Recent Transactions</h3>
            <ul class="transaction-list" id="transaction-list">
                <li class="transaction-item">
                    <div class="item-info">
                        <span class="item-title">Salary Credit</span>
                        <span class="item-date">01 Sep 2026</span>
                    </div>
                    <span class="amount credit">+ ₹30,000.00</span>
                </li>
                <li class="transaction-item">
                    <div class="item-info">
                        <span class="item-title">Shopping</span>
                        <span class="item-date">02 Sep 2026</span>
                    </div>
                    <span class="amount debit">- ₹5,500.00</span>
                </li>
            </ul>
        </div>
    </div>

    <script>
        let currentBalance = 24500.00;

        function updateBalanceDisplay() {
            document.getElementById('total-balance').innerText = currentBalance.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function addMoney() {
            let amount = prompt("Enter amount to add:", "1000");
            if (amount && !isNaN(amount) && Number(amount) > 0) {
                amount = parseFloat(amount);
                currentBalance += amount;
                updateBalanceDisplay();
                addTransaction("Money Added", amount, "credit");
            }
        }

        function sendMoney() {
            let amount = prompt("Enter amount to send:", "500");
            if (amount && !isNaN(amount) && Number(amount) > 0) {
                amount = parseFloat(amount);
                if (amount <= currentBalance) {
                    currentBalance -= amount;
                    updateBalanceDisplay();
                    addTransaction("Transfer Out", amount, "debit");
                } else {
                    alert("Insufficient balance!");
                }
            }
        }

        function addTransaction(title, amount, type) {
            const list = document.getElementById('transaction-list');
            const li = document.createElement('li');
            li.className = 'transaction-item';
            
            const isCredit = type === 'credit';
            const sign = isCredit ? '+' : '-';
            const amountClass = isCredit ? 'credit' : 'debit';
            const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            li.innerHTML = `
                <div class="item-info">
                    <span class="item-title">${title}</span>
                    <span class="item-date">${today}</span>
                </div>
                <span class="amount ${amountClass}">${sign} ₹${amount.toFixed(2)}</span>
            `;
            
            list.prepend(li);
        }
    </script>
</body>
</html>
