<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartprime - Affiliate Wallet & Sales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wallet-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-logo h1 {
            font-size: 24px;
            color: #4318ff;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            background: #e9e3ff;
            color: #4318ff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .card {
            background: linear-gradient(135deg, #4318ff 0%, #868CFF 100%);
            border-radius: 20px;
            padding: 22px;
            color: white;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: "CARTPRIME";
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 32px;
            font-weight: 900;
            opacity: 0.1;
            letter-spacing: 2px;
        }

        .card .balance-title {
            font-size: 12px;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .balance {
            font-size: 32px;
            font-weight: bold;
            margin: 6px 0 16px 0;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 12px;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            font-size: 13px;
        }

        .btn-sale {
            background-color: #05cd99;
            color: white;
        }

        .btn-sale:hover {
            background-color: #04b385;
        }

        .btn-withdraw {
            background-color: #4318ff;
            color: white;
        }

        .btn-withdraw:hover {
            background-color: #3311cc;
        }

        .section-title {
            font-size: 15px;
            color: #2b3674;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .product-list {
            list-style: none;
            max-height: 260px;
            overflow-y: auto;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid #edf2f7;
        }

        .product-info {
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-weight: 600;
            color: #2b3674;
            font-size: 13px;
        }

        .product-meta {
            font-size: 11px;
            color: #a3aed0;
            margin-top: 2px;
        }

        .commission-amt {
            font-weight: bold;
            font-size: 13px;
            color: #05cd99;
            text-align: right;
        }

        .sale-amt {
            font-size: 11px;
            color: #a3aed0;
            display: block;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <!-- Cartprime Header -->
        <div class="brand-header">
            <div class="brand-logo">
                <h1>Cartprime</h1>
            </div>
            <span class="brand-badge">Affiliate Partner</span>
        </div>

        <!-- Wallet Balance Card -->
        <div class="card">
            <div class="balance-title">Available Commission Balance</div>
            <div class="balance">₹ <span id="total-balance">12,500.00</span></div>
            <div class="card-stats">
                <div>Pending: <b>₹ <span id="pending-amt">3,200.00</span></b></div>
                <div>Withdrawn: <b>₹ <span id="withdrawn-amt">45,000.00</span></b></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <button class="btn btn-sale" onclick="simulateAffiliateSale()">+ Record Sale</button>
            <button class="btn btn-withdraw" onclick="requestWithdrawal()">Payout Request</button>
        </div>

        <!-- Sales History -->
        <div class="history-section">
            <div class="section-title">Cartprime Sales & Earnings</div>
            <ul class="product-list" id="product-list">
                <li class="product-item">
                    <div class="product-info">
                        <span class="product-name">Wireless Headphones</span>
                        <span class="product-meta">Qty: 1 • Rate: 10% • 03 Sep 2026</span>
                    </div>
                    <div>
                        <span class="commission-amt">+ ₹250.00</span>
                        <span class="sale-amt">Sale: ₹2,500</span>
                    </div>
                </li>
                <li class="product-item">
                    <div class="product-info">
                        <span class="product-name">Smart Watch</span>
                        <span class="product-meta">Qty: 2 • Rate: 10% • 02 Sep 2026</span>
                    </div>
                    <div>
                        <span class="commission-amt">+ ₹700.00</span>
                        <span class="sale-amt">Sale: ₹7,000</span>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // System State Data
        let walletData = {
            balance: 12500.00,
            pending: 3200.00,
            withdrawn: 45000.00,
            commissionRate: 0.10 // 10% Affiliate Commission Rate
        };

        // Update UI Function
        function updateUI() {
            document.getElementById('total-balance').innerText = walletData.balance.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            document.getElementById('pending-amt').innerText = walletData.pending.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            document.getElementById('withdrawn-amt').innerText = walletData.withdrawn.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Record New Product Sale
        function simulateAffiliateSale() {
            let productName = prompt("Enter Sold Product Name:", "Bluetooth Speaker");
            if (!productName) return;

            let saleAmount = prompt("Enter Product Total Price (₹):", "1500");
            
            if (saleAmount && !isNaN(saleAmount) && Number(saleAmount) > 0) {
                saleAmount = parseFloat(saleAmount);
                
                // Calculating Commission (10%)
                let commission = saleAmount * walletData.commissionRate;

                walletData.balance += commission;
                updateUI();

                addSalesHistory(productName, 1, saleAmount, commission);
            }
        }

        // Payout Request Functionality
        function requestWithdrawal() {
            let amount = prompt("Enter withdrawal amount (₹):", walletData.balance);
            if (amount && !isNaN(amount) && Number(amount) > 0) {
                amount = parseFloat(amount);
                if (amount <= walletData.balance) {
                    walletData.balance -= amount;
                    walletData.withdrawn += amount;
                    updateUI();
                    alert("Payout request submitted successfully!");
                } else {
                    alert("Insufficient commission balance!");
                }
            }
        }

        // Append Sold Product to List
        function addSalesHistory(name, qty, saleAmt, commission) {
            const list = document.getElementById('product-list');
            const li = document.createElement('li');
            li.className = 'product-item';
            
            const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            li.innerHTML = `
                <div class="product-info">
                    <span class="product-name">${name}</span>
                    <span class="product-meta">Qty: ${qty} • Rate: 10% • ${today}</span>
                </div>
                <div>
                    <span class="commission-amt">+ ₹${commission.toFixed(2)}</span>
                    <span class="sale-amt">Sale: ₹${saleAmt.toFixed(2)}</span>
                </div>
            `;
            
            list.prepend(li);
        }
    </script>
</body>
</html>
