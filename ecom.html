<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartPrime - Admin Panel</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background: #f8fafc; color: #1e293b; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { width: 250px; background: #0f172a; color: #fff; display: flex; flex-direction: column; }
        .sidebar .brand { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; border-bottom: 1px solid #1e293b; color: #38bdf8; }
        .tablinks { background: none; border: none; color: #94a3b8; width: 100%; text-align: left; padding: 15px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .tablinks:hover, .tablinks.active { background: #1e293b; color: #38bdf8; border-left: 4px solid #38bdf8; }
        
        /* Main Content Styling */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #0f172a; }
        
        /* Admin Card & Table Styling */
        .admin-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th, td { padding: 14px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f1f5f9; color: #475569; font-weight: 700; }
        tr:hover { background: #f8fafc; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand"><i class="fa fa-shopping-cart"></i> CartPrime Admin</div>
        <button onclick="openTab('dashboard', this)" class="tablinks active" id="btn-dashboard">
            <i class="fa fa-home"></i> <span>Dashboard</span>
        </button>
        <button onclick="openTab('users', this)" class="tablinks" id="btn-users">
            <i class="fa fa-users"></i> <span>Users</span>
        </button>
        <button onclick="openTab('complaints', this)" class="tablinks" id="btn-complaints">
            <i class="fa fa-exclamation-triangle"></i> <span>Complaints</span>
        </button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="main-content">
        
        <!-- DASHBOARD TAB -->
        <div id="dashboard" class="tab-content active">
            <h2 class="tab-title">Dashboard Overview</h2>
            <div class="admin-card">
                <p>Welcome to the CartPrime Admin Panel.</p>
            </div>
        </div>

        <!-- USERS TAB -->
        <div id="users" class="tab-content">
            <h2 class="tab-title">Registered Users</h2>
            <div class="admin-card">
                <p>User details will appear here.</p>
            </div>
        </div>

        <!-- COMPLAINTS TAB -->
        <div id="complaints" class="tab-content">
            <h2 class="tab-title">User Complaints & Support</h2>
            <div class="admin-card">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Customer & Contact</th>
                                <th>Order ID</th>
                                <th>Complaint Details</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="complaintList">
                            <tr>
                                <td colspan="5" style="text-align:center; color:#64748b;">Loading complaints...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- FIREBASE MODULE & JS CODE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration (നിങ്ങളുടെ വിവരങ്ങൾ ഇവിടെ ചേർക്കുക)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Tab Switching Logic
        window.openTab = function(tabName, element) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            const tabs = document.querySelectorAll('.tablinks');
            tabs.forEach(tab => tab.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            element.classList.add('active');
        };

        // Real-time Complaint Fetching
        onValue(ref(db, 'complaints'), snap => {
            const list = document.getElementById('complaintList');
            if (!list) return;
            list.innerHTML = "";
            
            if (!snap.exists()) {
                list.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">No complaints found.</td></tr>`;
                return;
            }

            snap.forEach(child => {
                const c = child.val();
                const key = child.key;
                const status = c.status || 'Pending';
                const statusColor = status === 'Resolved' ? '#166534' : '#b91c1c';
                const statusBg = status === 'Resolved' ? '#dcfce7' : '#fee2e2';

                list.innerHTML += `
                <tr>
                    <td>
                        <strong>${c.userName || 'Customer'}</strong><br>
                        <small style="color:#64748b;">${c.phone || c.email || 'N/A'}</small>
                    </td>
                    <td><span style="font-weight:700;">#${c.orderId || 'N/A'}</span></td>
                    <td style="max-width:300px; word-break:break-word;">
                        <p style="font-size:13px; font-weight:600;">${c.subject || 'Complaint'}</p>
                        <small style="color:#475569;">${c.message || ''}</small>
                    </td>
                    <td>
                        <span style="font-size:11px; padding:4px 8px; border-radius:6px; font-weight:800; background:${statusBg}; color:${statusColor};">
                            ${status}
                        </span>
                    </td>
                    <td>
                        <div style="display:flex; gap:6px;">
                            ${status !== 'Resolved' ? `
                                <button style="background:#16a34a; color:#fff; border:none; padding:6px 10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;" onclick="resolveComplaint('${key}')">
                                    <i class="fa fa-check"></i> Resolve
                                </button>
                            ` : ''}
                            <button style="background:#ef4444; color:#fff; border:none; padding:6px 10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;" onclick="deleteComplaint('${key}')">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            });
        });

        // Mark Complaint as Resolved
        window.resolveComplaint = (key) => {
            update(ref(db, `complaints/${key}`), { status: 'Resolved' })
            .then(() => {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Complaint marked as Resolved!',
                    showConfirmButton: false,
                    timer: 1500
                });
            })
            .catch(err => Swal.fire('Error', err.message, 'error'));
        };

        // Delete Complaint
        window.deleteComplaint = (key) => {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmColor: '#ef4444',
                cancelColor: '#64748b',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    remove(ref(db, `complaints/${key}`))
                    .then(() => Swal.fire('Deleted!', 'Complaint has been removed.', 'success'))
                    .catch(err => Swal.fire('Error', err.message, 'error'));
                }
            });
        };
    </script>
</body>
</html>
