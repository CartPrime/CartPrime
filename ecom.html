<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartprime - Wallet & Sales Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wallet-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        /* Branding Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo h1 {
            font-size: 22px;
            color: #4318ff;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            background: #e9e3ff;
            color: #4318ff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* Virtual Card */
        .card {
            background: linear-gradient(135deg, #4318ff 0%, #868CFF 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: "CARTPRIME";
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 32px;
            font-weight: 900;
            opacity: 0.1;
            letter-spacing: 2px;
        }

        .card .balance-title {
            font-size: 13px;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .balance {
            font-size: 32px;
            font-weight: bold;
            margin: 8px 0 16px 0;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            font-size: 14px;
        }

        .btn-sell {
            background-color: #05cd99;
            color: white;
        }

        .btn-sell:hover {
            background-color: #04b385;
        }

        .btn-add {
            background-color: #4318ff;
            color: white;
        }

        .btn-add:hover {
            background-color: #3311cc;
        }

        /* History Section */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            color: #2b3674;
            font-weight: 700;
        }

        .product-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid #edf2f7;
        }

        .product-info {
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-weight: 600;
            color: #2b3674;
            font-size: 14px;
        }

        .product-meta {
            font-size: 12px;
            color: #a3aed0;
            margin-top: 2px;
        }

        .product-price {
            font-weight: bold;
            font-size: 14px;
            color: #05cd99;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <!-- Cartprime Header -->
        <div class="brand-header">
            <div class="brand-logo">
                <h1>Cartprime</h1>
                <span class="brand-badge">Pay</span>
            </div>
            <span style="font-size: 20px; cursor: pointer;">🔔</span>
        </div>

        <!-- Cartprime Virtual Balance Card -->
        <div class="card">
            <div class="balance-title">Cartprime Balance</div>
            <div class="balance">₹ <span id="total-balance">45,200.00</span></div>
            <div class="card-details">
                <span>Acc: **** 4821</span>
                <span>Active</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <button class="btn btn-sell" onclick="sellProduct()">+ New Sale</button>
            <button class="btn btn-add" onclick="addMoney()">+ Add Funds</button>
        </div>

        <!-- Sales History -->
        <div class="history-section">
            <div class="history-header">
                <div class="section-title">Cartprime Sales History</div>
            </div>
            <ul class="product-list" id="product-list">
                <li class="product-item">
                    <div class="product-info">
                        <span class="product-name">Wireless Headphones</span>
                        <span class="product-meta">Qty: 1 • 03 Sep 2026</span>
                    </div>
                    <span class="product-price">+ ₹2,500.00</span>
                </li>
                <li class="product-item">
                    <div class="product-info">
                        <span class="product-name">Smart Watch</span>
                        <span class="product-meta">Qty: 2 • 02 Sep 2026</span>
                    </div>
                    <span class="product-price">+ ₹7,000.00</span>
                </li>
            </ul>
        </div>
    </div>

    <script>
        let currentBalance = 45200.00;

        function updateBalanceDisplay() {
            document.getElementById('total-balance').innerText = currentBalance.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function sellProduct() {
            let name = prompt("Enter Product Name:", "E.g., Wireless Mouse");
            if (!name) return;

            let qty = prompt("Enter Quantity:", "1");
            let price = prompt("Enter Sale Price (₹):", "1200");

            if (price && !isNaN(price) && Number(price) > 0) {
                price = parseFloat(price);
                currentBalance += price;
                updateBalanceDisplay();

                addProductHistory(name, qty || 1, price);
            }
        }

        function addMoney() {
            let amount = prompt("Enter amount to add to Cartprime Wallet:", "1000");
            if (amount && !isNaN(amount) && Number(amount) > 0) {
                amount = parseFloat(amount);
                currentBalance += amount;
                updateBalanceDisplay();
            }
        }

        function addProductHistory(name, qty, price) {
            const list = document.getElementById('product-list');
            const li = document.createElement('li');
            li.className = 'product-item';
            
            const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            li.innerHTML = `
                <div class="product-info">
                    <span class="product-name">${name}</span>
                    <span class="product-meta">Qty: ${qty} • ${today}</span>
                </div>
                <span class="product-price">+ ₹${price.toFixed(2)}</span>
            `;
            
            list.prepend(li);
        }
    </script>
</body>
</html>
