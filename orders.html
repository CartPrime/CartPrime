                                </div>
                                <div class="order-price-row">
                                    <span class="order-price">₹${Number(price).toLocaleString('en-IN')}</span>
                                    <span class="order-payment-tag">${(order.paymentMethod || 'COD').toUpperCase()}</span>
                                </div>
                            </div>
                        </div>

                        ${effStatus !== 'cancelled' ? `
                            <div class="stepper-wrap">
                                <div class="stepper-progress">
                                    <div class="stepper-progress-fill" style="width: ${progressWidth};"></div>
                                    <div class="step-node ${step1}"><i class="fa-solid fa-check"></i></div>
                                    <div class="step-node ${step2}"><i class="fa-solid fa-truck"></i></div>
                                    <div class="step-node ${step3}"><i class="fa-solid fa-truck-fast"></i></div>
                                    <div class="step-node ${step4}"><i class="fa-solid fa-house"></i></div>
                                </div>
                                <div class="step-labels">
                                    <span class="${step1 ? 'active' : ''}">Placed</span>
                                    <span class="${step2 ? 'active' : ''}">Shipped</span>
                                    <span class="${step3 ? 'active' : ''}">Out for Delivery</span>
                                    <span class="${step4 ? 'active' : ''}">Delivered</span>
                                </div>
                            </div>
                        ` : ''}

                        ${noteHtml}

                        <div class="order-card-actions" onclick="event.stopPropagation()">
                            <button type="button" class="meesho-btn meesho-btn-outline" onclick="window.viewOrderDetails('${orderId}')">
                                <i class="fa-solid fa-receipt"></i> Details
                            </button>

                            ${effStatus === 'placed' ? `
                                <button type="button" class="meesho-btn meesho-btn-danger" onclick="window.requestCancelOrder('${orderId}')">
                                    <i class="fa-solid fa-xmark"></i> Cancel
                                </button>
                            ` : ''}

                            <!-- Return button hides automatically after 7 days -->
                            ${canReturn ? `
                                <button type="button" class="meesho-return-btn" onclick="window.requestReturnOrder('${orderId}')">
                                    <i class="fa-solid fa-rotate-left"></i> Return
                                </button>
                            ` : ''}

                            <a href="https://wa.me/${SUPPORT_WHATSAPP}?text=Hi%20CartPrime%20Support,%20I%20need%20help%20with%20Order%20%23${orderId}" target="_blank" class="meesho-btn meesho-btn-outline" style="color: #16a34a; border-color: #bbf7d0;">
                                <i class="fa-brands fa-whatsapp"></i> Help
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // View Order Details
        window.viewOrderDetails = function(orderId) {
            const order = displayedOrders.find(o => String(o.id || o.orderId) === String(orderId));
            if (!order) return;

            const effStatus = getEffectiveStatus(order);
            const returnInfo = getReturnEligibility(order);
            const canReturn = (effStatus === 'delivered' && returnInfo.hasPolicy && !returnInfo.isExpired);

            const modalTitle = document.getElementById('modalOrderTitle');
            const modalBody = document.getElementById('modalOrderBody');
            modalTitle.textContent = `Order #${orderId}`;

            let itemsHtml = '';
            const items = getOrderItemsList(order);
            items.forEach(it => {
                const itImg = extractItemImage(it, order);
                const itTitle = it.title || it.productTitle || order.productTitle || 'Item';
                const itPrice = it.price || order.totalAmount || 0;
                const itQty = it.quantity || it.qty || 1;
                itemsHtml += `
                    <div style="display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9;">
                        <img src="${itImg}" style="width: 54px; height: 54px; border-radius: 8px; object-fit: cover; border: 1px solid #e2e8f0;" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_SVG}'">
                        <div style="flex: 1;">
                            <div style="font-size: 0.88rem; font-weight: 700; color: var(--primary);">${itTitle}</div>
                            <div style="font-size: 0.78rem; color: var(--text-muted);">Qty: ${itQty} ${it.size ? `• Size: ${it.size}` : ''}</div>
                        </div>
                        <div style="font-weight: 800; font-size: 0.95rem; color: var(--primary);">₹${Number(itPrice * itQty).toLocaleString('en-IN')}</div>
                    </div>
                `;
            });

            const addr = order.address || order.shippingAddress || {};
            const addressString = typeof addr === 'string' ? addr : `
                <strong>${addr.name || order.customerName || 'Customer'}</strong><br>
                ${addr.house || addr.addressLine1 || addr.street || ''} ${addr.area || addr.landmark ? '<br>' + (addr.area || addr.landmark) : ''}<br>
                ${addr.city || ''} ${addr.state || ''} - ${addr.pincode || addr.pin || ''}<br>
                <i class="fa-solid fa-phone" style="margin-right: 4px; font-size: 0.8rem;"></i> ${addr.phone || order.customerPhone || 'N/A'}
            `;

            modalBody.innerHTML = `
                <div style="padding: 12px; border-radius: 12px; margin-bottom: 16px; background: ${effStatus === 'out_for_delivery' ? '#fffbeb' : '#f8fafc'}; border: 1px solid ${effStatus === 'out_for_delivery' ? '#fde68a' : '#e2e8f0'}; display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Current Status</div>
                        <div style="font-size: 0.95rem; font-weight: 800; color: var(--primary); text-transform: capitalize;">
                            ${effStatus === 'out_for_delivery' ? '🚀 Out for Delivery (Arriving Today)' : effStatus}
                        </div>
                    </div>
                    <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">
                        ${formatDatePretty(order.date || order.createdAt)}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Items Ordered</div>
                    <div class="detail-box">${itemsHtml}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Delivery Address</div>
                    <div class="detail-box" style="font-size: 0.86rem; line-height: 1.5;">${addressString}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Payment Summary</div>
                    <div class="detail-box">
                        <div class="detail-row"><span>Items Total</span> <span>₹${Number(order.totalAmount || order.price || 0).toLocaleString('en-IN')}</span></div>
                        <div class="detail-row"><span>Delivery Charge</span> <span style="color: var(--success); font-weight: 700;">FREE</span></div>
                        <div class="detail-row bold"><span>Total Paid</span> <span>₹${Number(order.totalAmount || order.price || 0).toLocaleString('en-IN')}</span></div>
                        <div class="detail-row" style="color: var(--text-muted); font-size: 0.78rem;">
                            <span>Payment Mode</span> <span style="font-weight: 700;">${(order.paymentMethod || 'Cash on Delivery').toUpperCase()}</span>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    ${effStatus === 'placed' ? `
                        <button type="button" class="meesho-btn meesho-btn-danger" style="flex: 1; justify-content: center;" onclick="window.requestCancelOrder('${orderId}')">
                            <i class="fa-solid fa-xmark"></i> Cancel Order
                        </button>
                    ` : ''}

                    ${canReturn ? `
                        <button type="button" class="meesho-return-btn" style="flex: 1; justify-content: center;" onclick="window.requestReturnOrder('${orderId}')">
                            <i class="fa-solid fa-rotate-left"></i> Return Item (${returnInfo.daysLeft}d left)
                        </button>
                    ` : ''}

                    <a href="https://wa.me/${SUPPORT_WHATSAPP}?text=Hi%20CartPrime,%20need%20help%20with%20order%20%23${orderId}" target="_blank" class="meesho-btn meesho-btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-brands fa-whatsapp"></i> Support
                    </a>
                </div>
            `;

            document.getElementById('orderDetailsModal').style.display = 'flex';
        };

        window.closeOrderModal = function(e) {
            if (!e || e.target.id === 'orderDetailsModal' || !e.target) {
                document.getElementById('orderDetailsModal').style.display = 'none';
            }
        };

        // Helper to convert Image File to compressed Base64
        function convertImageFileToBase64(file) {
            return new Promise((resolve) => {
                if (!file) return resolve('');
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxDim = 600;
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = (h * maxDim) / w; w = maxDim; }
                            else { w = (w * maxDim) / h; h = maxDim; }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = () => resolve(e.target.result);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        // ============================================================
        // 6. ENHANCED RETURN REQUEST (UPI ID, Email ID, Optional Image)
        // ============================================================
        window.requestReturnOrder = function(orderId) {
            const order = displayedOrders.find(o => String(o.id || o.orderId) === String(orderId));
            if (!order) return;

            const returnInfo = getReturnEligibility(order);
            if (returnInfo.isExpired) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Return Window Closed',
                    text: `The ${returnInfo.returnDaysLimit || 7}-day return period for this order has expired.`,
                    confirmButtonColor: '#0b0b0f'
                });
                return;
            }

            const detectedEmail = localStorage.getItem('cartprime_user_email') || localStorage.getItem('customerEmail') || '';

            Swal.fire({
                title: 'Request Return',
                html: `
                    <div style="text-align: left; font-size: 0.88rem; color: #1e293b;">
                        <!-- Return Reason -->
                        <label style="font-weight: 700; display: block; margin-bottom: 4px;">Reason for Return <span style="color:#ef4444;">*</span></label>
                        <select id="swalReturnReason" style="width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; margin-bottom: 12px; font-size: 0.88rem; outline: none;">
                            <option value="">-- Select Reason --</option>
                            <option value="Defective / Damaged Product">Defective / Damaged Product</option>
                            <option value="Wrong Item Delivered">Wrong Item Delivered</option>
                            <option value="Quality Not As Expected">Quality Not As Expected</option>
                            <option value="Size / Fit Issue">Size / Fit Issue</option>
                            <option value="Color / Design Mismatch">Color / Design Mismatch</option>
                            <option value="Other">Other Reason</option>
                        </select>

                        <!-- UPI ID -->
                        <label style="font-weight: 700; display: block; margin-bottom: 4px;">Refund UPI ID <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="swalReturnUpi" placeholder="e.g. ${loggedInPhone || '7356587790'}@upi or name@oksbi" style="width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; margin-bottom: 4px; font-size: 0.88rem; outline: none;" />
                        <div style="font-size: 0.72rem; color: #64748b; margin-bottom: 12px;">Refund will be credited to this UPI ID after pickup inspection.</div>

                        <!-- Email ID -->
                        <label style="font-weight: 700; display: block; margin-bottom: 4px;">Email ID <span style="color:#ef4444;">*</span></label>
                        <input type="email" id="swalReturnEmail" value="${detectedEmail}" placeholder="e.g. yourname@gmail.com" style="width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; margin-bottom: 4px; font-size: 0.88rem; outline: none;" />
                        <div style="font-size: 0.72rem; color: #64748b; margin-bottom: 12px;">For return pickup updates & refund confirmation receipt.</div>

                        <!-- Product Photo (Optional) -->
                        <label style="font-weight: 700; display: block; margin-bottom: 4px;">Product Photo <span style="font-size: 0.75rem; font-weight: 600; color: #64748b;">(Optional)</span></label>
                        <input type="file" id="swalReturnImgFile" accept="image/*" style="width: 100%; font-size: 0.82rem; padding: 8px; border: 1.5px dashed #cbd5e1; border-radius: 10px; background: #f8fafc; margin-bottom: 4px;" />
                        <div style="font-size: 0.72rem; color: #64748b; margin-bottom: 12px;">Attach a picture showing the issue if you wish.</div>

                        <!-- Additional Comments -->
                        <label style="font-weight: 700; display: block; margin-bottom: 4px;">Additional Details <span style="font-size: 0.75rem; font-weight: 600; color: #64748b;">(Optional)</span></label>
                        <textarea id="swalReturnComment" placeholder="Explain the problem..." style="width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 0.88rem; outline: none; height: 60px; resize: none;"></textarea>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Submit Return Request',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#f59e0b',
                cancelButtonColor: '#64748b',
                preConfirm: async () => {
                    const reason = document.getElementById('swalReturnReason').value;
                    const upi = document.getElementById('swalReturnUpi').value.trim();
                    const email = document.getElementById('swalReturnEmail').value.trim();
                    const comment = document.getElementById('swalReturnComment').value.trim();
                    const imgFileInput = document.getElementById('swalReturnImgFile');

                    if (!reason) {
                        Swal.showValidationMessage('Please select a reason for return!');
                        return false;
                    }
                    if (!upi || upi.length < 4) {
                        Swal.showValidationMessage('Please enter a valid Refund UPI ID!');
                        return false;
                    }
                    if (!email || !email.includes('@') || !email.includes('.')) {
                        Swal.showValidationMessage('Please enter a valid Email ID!');
                        return false;
                    }

                    let imgBase64 = '';
                    if (imgFileInput && imgFileInput.files && imgFileInput.files[0]) {
                        imgBase64 = await convertImageFileToBase64(imgFileInput.files[0]);
                    }

                    return { reason, upi, email, comment, imgBase64 };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const { reason, upi, email, comment, imgBase64 } = result.value;
                    try {
                        const targetPhone = order.customerPhone ? normalizePhone(order.customerPhone) : loggedInPhone;
                        const phonePath = targetPhone ? `${targetPhone}/${orderId}` : orderId;

                        const returnPayload = {
                            status: 'return_requested',
                            returnReason: reason,
                            returnUpiId: upi,
                            returnEmail: email,
                            returnImage: imgBase64 || '',
                            returnComment: comment || '',
                            returnRequestedAt: new Date().toISOString()
                        };

                        if (db) {
                            const ordRef = ref(db, `orders/${phonePath}`);
                            await update(ordRef, returnPayload);
                        }

                        // Also push via REST to guarantee immediate DB write
                        try {
                            await fetch(`${FIREBASE_RTDB_URL}/orders/${phonePath}.json`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(returnPayload)
                            });
                        } catch(e) {}

                        // Update local object
                        order.status = 'return_requested';
                        order.returnReason = reason;
                        order.returnUpiId = upi;
                        order.returnEmail = email;
                        order.returnImage = imgBase64;

                        Swal.fire({
                            icon: 'success',
                            title: 'Return Request Submitted!',
                            html: `
                                <div style="font-size: 0.9rem; line-height: 1.5; text-align: center;">
                                    Your return request has been submitted successfully.<br>
                                    Refund will be credited to <strong>${upi}</strong> upon pickup inspection.<br>
                                    Updates sent to <strong>${email}</strong>.
                                </div>
                            `,
                            confirmButtonColor: '#0b0b0f'
                        });

                        closeOrderModal();
                        updateCounts();
                        applyFilters();
                    } catch (e) {
                        Swal.fire({ icon: 'error', title: 'Error', text: e.message, confirmButtonColor: '#0b0b0f' });
                    }
                }
            });
        };

        // Cancel Order Flow
        window.requestCancelOrder = function(orderId) {
            Swal.fire({
                title: 'Cancel Order?',
                text: 'Are you sure you want to cancel this order? This action cannot be undone.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Yes, Cancel Order',
                cancelButtonText: 'Keep Order'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const ord = displayedOrders.find(o => String(o.id || o.orderId) === String(orderId));
                        const targetPhone = (ord && ord.customerPhone) ? normalizePhone(ord.customerPhone) : loggedInPhone;
                        const phonePath = targetPhone ? `${targetPhone}/${orderId}` : orderId;

                        if (db) {
                            const ordRef = ref(db, `orders/${phonePath}`);
                            await update(ordRef, {
                                status: 'cancelled',
                                cancelledAt: new Date().toISOString()
                            });
                        }

                        try {
                            await fetch(`${FIREBASE_RTDB_URL}/orders/${phonePath}.json`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ status: 'cancelled', cancelledAt: new Date().toISOString() })
                            });
                        } catch(e) {}

                        if (ord) ord.status = 'cancelled';

                        Swal.fire({
                            icon: 'success',
                            title: 'Order Cancelled',
                            text: 'Your order has been cancelled successfully.',
                            confirmButtonColor: '#0b0b0f'
                        });

                        closeOrderModal();
                        updateCounts();
                        applyFilters();
                    } catch (e) {
                        Swal.fire({ icon: 'error', title: 'Error', text: e.message });
                    }
                }
            });
        };

        // Preload Products Cache
        async function preloadProductsCache() {
            try {
                const res = await fetch(`${FIREBASE_RTDB_URL}/products.json`);
                if (res.ok) {
                    const data = await res.json();
                    if (data) {
                        Object.keys(data).forEach(k => {
                            const p = data[k];
                            if (p) {
                                productsCache[k] = p;
                                if (p.id) productsCache[p.id] = p;
                                if (p.name) productsCache[p.name.toLowerCase().trim()] = p;
                                if (p.title) productsCache[p.title.toLowerCase().trim()] = p;
                            }
                        });
                    }
                }
            } catch(e) {}
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            loggedInPhone = detectHomePageLoggedInPhone();
            updateAccountStripUI();

            preloadProductsCache();
            fetchOrders();

            document.querySelectorAll('.filter-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.getAttribute('data-filter');
                    applyFilters();
                });
            });

            const searchInput = document.getElementById('orderSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.trim();
                    applyFilters();
                });
            }
        });
    </script>
</body>
