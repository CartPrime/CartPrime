<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders | CartPrime</title>

    <!-- Shopping Bag Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b0b0f'/><path d='M17 8h-1.5c0-1.93-1.57-3.5-3.5-3.5S8.5 6.07 8.5 8H7c-.83 0-1.5.67-1.5 1.5v8C5.5 18.33 6.17 19 7 19h10c.83 0 1.5-.67 1.5-1.5v-8C18.5 8.67 17.83 8 17 8zm-5-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm5 11.5H7v-8h10v8z' fill='%23f59e0b'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b0b0f'/><path d='M17 8h-1.5c0-1.93-1.57-3.5-3.5-3.5S8.5 6.07 8.5 8H7c-.83 0-1.5.67-1.5 1.5v8C5.5 18.33 6.17 19 7 19h10c.83 0 1.5-.67 1.5-1.5v-8C18.5 8.67 17.83 8 17 8zm-5-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm5 11.5H7v-8h10v8z' fill='%23f59e0b'/></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --primary: #0b0b0f; 
            --bg: #f4f6fa; 
            --white: #ffffff; 
            --surface: #ffffff;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --accent-soft: rgba(245, 158, 11, 0.12);
            --accent-border: rgba(245, 158, 11, 0.35);
            --border-color: #e6e9f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.12);
            --info: #3b82f6;
            --info-soft: rgba(59, 130, 246, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Top Sticky Navbar */
        .top-navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
        }

        .nav-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #f1f5f9;
            color: var(--primary);
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }

        .btn-back:hover {
            background: #e2e8f0;
        }

        .page-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title span.badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            border-radius: 20px;
            border: 1px solid var(--accent-border);
        }

        .nav-right a {
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 8px;
            transition: color 0.2s;
            text-decoration: none;
        }

        .nav-right a:hover {
            color: var(--primary);
        }

        /* Main Container */
        .main-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Logged In User Strip */
        .user-account-strip {
            background: var(--white);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .user-account-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .user-avatar-pill {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 1px solid var(--accent-border);
            flex-shrink: 0;
        }

        .user-meta-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-meta-phone {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            font-size: 0.7rem;
            color: var(--success);
            background: var(--success-soft);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 700;
        }

        .btn-switch-account {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-switch-account:hover {
            background: #e2e8f0;
        }

        /* Search Box */
        .search-box-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-box-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--border-color);
            background: var(--white);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        /* Filter Chips */
        .filter-scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            white-space: nowrap;
            padding: 7px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--white);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(11, 11, 15, 0.2);
        }

        .filter-chip .chip-count {
            font-size: 0.72rem;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }

        .filter-chip:not(.active) .chip-count {
            background: #e2e8f0;
            color: var(--text-main);
        }

        /* Order Card */
        .order-card {
            background: var(--white);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .order-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        /* Card Header */
        .order-card-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #fafbfc;
        }

        .order-id-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .order-id-meta strong {
            color: var(--primary);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status-badge.placed {
            background: var(--info-soft);
            color: var(--info);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .status-badge.shipped {
            background: var(--accent-soft);
            color: var(--accent-dark);
            border: 1px solid var(--accent-border);
        }

        .status-badge.out-delivery {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fcd34d;
            animation: pulse-border 1.8s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .status-badge.delivered {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.cancelled {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .status-badge.returned {
            background: #f3e8ff;
            color: #7e22ce;
            border: 1px solid #d8b4fe;
        }

        /* Card Body */
        .order-card-body {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .order-item-img {
            width: 76px;
            height: 76px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            flex-shrink: 0;
        }

        .order-item-info {
            flex: 1;
            min-width: 0;
        }

        .order-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.35;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .order-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .order-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary);
        }

        .order-payment-tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* Stepper Progress Bar */
        .stepper-wrap {
            padding: 12px 16px 14px;
            background: #fafbfc;
            border-top: 1px solid #f1f5f9;
        }

        .stepper-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-bottom: 6px;
        }

        .stepper-progress::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 14px;
            right: 14px;
            height: 3px;
            background: #e2e8f0;
            z-index: 1;
        }

        .stepper-progress-fill {
            position: absolute;
            top: 11px;
            left: 14px;
            height: 3px;
            background: var(--accent);
            z-index: 2;
            transition: width 0.3s ease;
        }

        .step-node {
            position: relative;
            z-index: 3;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--white);
            border: 3px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--white);
            transition: all 0.3s;
        }

        .step-node.completed {
            background: var(--accent);
            border-color: var(--accent);
        }

        .step-node.current {
            background: var(--primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }

        .step-node.current.out-delivery {
            background: #f59e0b;
            border-color: #0b0b0f;
            animation: pulse-step 1.5s infinite;
        }

        @keyframes pulse-step {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .step-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .step-labels span.active {
            color: var(--primary);
            font-weight: 700;
        }

        /* Delivery Announcement Strip */
        .delivery-note-strip {
            margin: 8px 16px 0;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delivery-note-strip.out {
            background: #fffbeb;
            border: 1px dashed #fde68a;
            color: #b45309;
        }

        .delivery-note-strip.delivered {
            background: #ecfdf5;
            border: 1px dashed #a7f3d0;
            color: #047857;
        }

        .delivery-note-strip.shipped {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            color: var(--text-main);
        }

        /* Action Buttons */
        .order-card-actions {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            background: var(--white);
        }

        .meesho-btn {
            border: none;
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .meesho-btn-outline {
            background: var(--white);
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
        }

        .meesho-btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .meesho-btn-primary {
            background: var(--primary);
            color: var(--white);
            border: 1.5px solid var(--primary);
        }

        .meesho-btn-primary:hover {
            background: #1e293b;
        }

        .meesho-btn-accent {
            background: var(--accent);
            color: var(--primary);
            border: 1.5px solid var(--accent);
        }

        .meesho-btn-accent:hover {
            background: var(--accent-dark);
            color: var(--white);
        }

        .meesho-return-btn {
            background: #fffbeb;
            border: 1.5px solid #fcd34d;
            color: #b45309;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .meesho-return-btn:hover {
            background: #fef3c7;
            border-color: #f59e0b;
        }

        .meesho-btn-danger {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #dc2626;
        }

        .meesho-btn-danger:hover {
            background: #fee2e2;
        }

        /* Empty State */
        .empty-orders-view {
            text-align: center;
            padding: 45px 20px;
            background: var(--white);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        .empty-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-dark);
            font-size: 1.8rem;
        }

        .empty-orders-view h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .empty-orders-view p {
            font-size: 0.86rem;
            color: var(--text-muted);
            max-width: 380px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }

        /* Modal Styles */
        .order-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        @media (min-width: 640px) {
            .order-modal-backdrop {
                align-items: center;
                padding: 20px;
            }
        }

        .order-modal-sheet {
            background: var(--white);
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
        }

        @media (min-width: 640px) {
            .order-modal-sheet {
                border-radius: 20px;
            }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 10;
        }

        .modal-header h4 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .modal-close-btn {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .detail-box {
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.88rem;
        }

        .detail-row.bold {
            font-weight: 800;
            border-top: 1px dashed var(--border-color);
            margin-top: 6px;
            padding-top: 10px;
            font-size: 0.98rem;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header class="top-navbar">
        <div class="nav-inner">
            <div class="nav-left">
                <a href="index.html" class="btn-back" title="Back to Store">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="page-title">
                    My Orders
                    <span class="badge" id="ordersCountBadge">0</span>
                </h1>
            </div>
            <div class="nav-right">
                <a href="index.html" title="Shopping"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Home Page Login Account Detection Strip -->
        <div class="user-account-strip">
            <div class="user-account-left">
                <div class="user-avatar-pill"><i class="fa-solid fa-user-check"></i></div>
                <div style="min-width: 0;">
                    <div class="user-meta-sub">Logged In Account</div>
                    <div class="user-meta-phone" id="userLoginPhoneDisplay">
                        <span>Detecting login...</span>
                    </div>
                </div>
            </div>
            <button type="button" class="btn-switch-account" onclick="promptSwitchNumber()">
                <i class="fa-solid fa-arrow-right-arrow-left"></i> Switch
            </button>
        </div>

        <!-- Search Bar -->
        <div class="search-box-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="orderSearchInput" class="search-input" placeholder="Search by Product Name or Order ID..." autocomplete="off">
        </div>

        <!-- Filter Chips -->
        <div class="filter-scroll-container">
            <button class="filter-chip active" data-filter="all">All <span class="chip-count" id="count-all">0</span></button>
            <button class="filter-chip" data-filter="placed">Placed <span class="chip-count" id="count-placed">0</span></button>
            <button class="filter-chip" data-filter="shipped">Shipped <span class="chip-count" id="count-shipped">0</span></button>
            <button class="filter-chip" data-filter="out_for_delivery">Out for Delivery <span class="chip-count" id="count-out_for_delivery">0</span></button>
            <button class="filter-chip" data-filter="delivered">Delivered <span class="chip-count" id="count-delivered">0</span></button>
            <button class="filter-chip" data-filter="cancelled">Cancelled <span class="chip-count" id="count-cancelled">0</span></button>
        </div>

        <!-- Orders List Container -->
        <div id="ordersList">
            <div id="loadingIndicator" style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--accent); margin-bottom: 10px;"></i>
                <div>Loading your orders...</div>
            </div>
        </div>
    </main>

    <!-- Details Modal -->
    <div class="order-modal-backdrop" id="orderDetailsModal" onclick="closeOrderModal(event)">
        <div class="order-modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h4 id="modalOrderTitle">Order Details</h4>
                <button type="button" class="modal-close-btn" onclick="closeOrderModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalOrderBody"></div>
        </div>
    </div>

    <!-- Firebase SDK & Main Script -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ============================================================
        // 🎯 EXACT FIREBASE CONFIGURATION
        // ============================================================
        const FIREBASE_RTDB_URL = "https://cartprime-shopping-default-rtdb.firebaseio.com";

        const firebaseConfig = {
            databaseURL: FIREBASE_RTDB_URL,
            projectId: "cartprime-shopping",
            authDomain: "cartprime-shopping.firebaseapp.com",
            storageBucket: "cartprime-shopping.appspot.com"
        };

        let app, auth, db;
        try {
            app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Firebase Init note:", e.message);
        }

        const SUPPORT_WHATSAPP = "919000000000"; 
        const DEFAULT_RETURN_DAYS = 7;

        // Guaranteed Inline SVG Fallback
        const DEFAULT_FALLBACK_SVG = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22%23f1f5f9%22%2F%3E%3Cpath%20d%3D%22M76%2042h-6c0-7.7-6.3-14-14-14s-14%206.3-14%2014h-6c-3.3%200-6%202.7-6%206v32c0%203.3%202.7%206%206%206h40c3.3%200%206-2.7%206-6V48c0-3.3-2.7-6-6-6zm-20-8c4.4%200%208%203.6%208%208h-16c0-4.4%203.6-8%208-8zm20%2046H42V48h40v32z%22%20fill%3D%22%23f59e0b%22%2F%3E%3C%2Fsvg%3E";

        let dbAllOrders = [];
        let displayedOrders = [];
        let filteredOrders = [];
        let activeFilter = 'all';
        let searchQuery = '';
        let loggedInPhone = '';
        let productsCache = {};

        // Normalize Phone to last 10 digits
        function normalizePhone(val) {
            if (!val) return '';
            const digits = String(val).replace(/\D/g, '');
            return digits.length >= 10 ? digits.slice(-10) : digits;
        }

        // Detect Home Page Logged-in Phone
        function detectHomePageLoggedInPhone() {
            const directKeys = [
                'cartprime_user_phone', 'cartprime_phone', 'user_phone', 'userPhone', 
                'customerPhone', 'phone', 'userMobile', 'cartprime_mobile', 'user'
            ];
            for (const key of directKeys) {
                const val = localStorage.getItem(key);
                if (val) {
                    const norm = normalizePhone(val);
                    if (norm.length >= 10) return norm;
                }
            }

            const objKeys = ['cartprime_user', 'user', 'currentUser', 'authUser', 'profile', 'cartprimeUser'];
            for (const key of objKeys) {
                try {
                    const raw = localStorage.getItem(key);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && typeof parsed === 'object') {
                            const p = parsed.phone || parsed.phoneNumber || parsed.mobile || parsed.userPhone;
                            if (p && normalizePhone(p).length >= 10) {
                                return normalizePhone(p);
                            }
                        }
                    }
                } catch(e) {}
            }

            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('firebase:authUser:')) {
                    try {
                        const u = JSON.parse(localStorage.getItem(k));
                        if (u && (u.phoneNumber || u.phone)) {
                            const p = normalizePhone(u.phoneNumber || u.phone);
                            if (p.length >= 10) return p;
                        }
                    } catch(e) {}
                }
            }

            return '';
        }

        // Extract Items List from any Order (Array or Object)
        function getOrderItemsList(order) {
            if (!order) return [];
            const candidates = [order.items, order.cart, order.products, order.orderItems, order.itemList, order.product];
            for (const c of candidates) {
                if (!c) continue;
                if (Array.isArray(c) && c.length > 0) return c;
                if (typeof c === 'object') {
                    const vals = Object.values(c).filter(v => v && typeof v === 'object');
                    if (vals.length > 0) return vals;
                    if (c.title || c.productTitle || c.name || c.price || c.image) return [c];
                }
            }
            return [order];
        }

        // Robust Image Extractor (Solves "ithil image illa")
        function extractItemImage(item, order) {
            // 1. Direct candidates from item and order
            const candidates = [
                item?.image, item?.imageUrl, item?.img, item?.productImage, item?.thumbnail, item?.photo, item?.src,
                order?.image, order?.imageUrl, order?.img, order?.productImage, order?.thumbnail, order?.photo, order?.src
            ];

            for (const url of candidates) {
                if (typeof url === 'string' && url.trim().length > 5) {
                    const clean = url.trim();
                    if (clean.startsWith('http://') || clean.startsWith('https://') || clean.startsWith('data:image/')) {
                        return clean;
                    }
                }
            }

            // 2. Search inside order items if given order
            if (order) {
                const items = getOrderItemsList(order);
                for (const it of items) {
                    if (it && it !== item) {
                        const sub = extractItemImage(it, null);
                        if (sub && sub !== DEFAULT_FALLBACK_SVG) return sub;
                    }
                }
            }

            // 3. Search in productsCache
            const pid = item?.id || item?.productId || order?.productId || order?.id;
            if (pid && productsCache[pid]) {
                const p = productsCache[pid];
                const pImg = p.image || p.imageUrl || p.img || p.productImage || (Array.isArray(p.images) && p.images[0]);
                if (pImg) return pImg;
            }

            const title = item?.title || item?.productTitle || item?.name || order?.productTitle || order?.title;
            if (title && productsCache[title.toLowerCase().trim()]) {
                const p = productsCache[title.toLowerCase().trim()];
                const pImg = p.image || p.imageUrl || p.img || p.productImage || (Array.isArray(p.images) && p.images[0]);
                if (pImg) return pImg;
            }

            return DEFAULT_FALLBACK_SVG;
        }

        // Safe Date Parser
        function parseDateSafe(val) {
            if (!val) return null;
            if (val instanceof Date && !isNaN(val.getTime())) return val;
            if (typeof val === 'number') {
                const d = new Date(val);
                return isNaN(d.getTime()) ? null : d;
            }
            if (typeof val === 'string') {
                const trimmed = val.trim();
                if (!trimmed) return null;
                const d = new Date(trimmed);
                if (!isNaN(d.getTime())) return d;
                const match = trimmed.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
                if (match) {
                    const day = parseInt(match[1], 10);
                    const month = parseInt(match[2], 10) - 1;
                    const year = parseInt(match[3], 10);
                    const testDate = new Date(year, month, day);
                    if (!isNaN(testDate.getTime())) return testDate;
                }
            }
            return null;
        }

        function isSameCalendarDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        // Check Out for Delivery (Today Arriving / Today Date)
        function checkIsOutForDelivery(order) {
            if (!order) return false;
            const textPool = [
                order.status,
                order.trackingStatus,
                order.deliveryStatus,
                order.adminStatus,
                order.deliveryNote,
                order.adminDeliveryNote,
                order.expectedDelivery,
                order.deliveryEstimate,
                order.deliveryDate
            ].filter(Boolean).map(s => String(s).toLowerCase()).join(' ');

            if (
                textPool.includes('today arriving') ||
                textPool.includes('arriving today') ||
                textPool.includes('today delivery') ||
                textPool.includes('delivery today') ||
                textPool.includes('out for delivery') ||
                textPool.includes('out_for_delivery') ||
                textPool.includes('out-for-delivery')
            ) {
                return true;
            }

            if (order.deliveryDate || order.expectedDelivery) {
                const d = parseDateSafe(order.deliveryDate || order.expectedDelivery);
                if (d && isSameCalendarDay(d, new Date())) {
                    return true;
                }
            }
            return false;
        }

        // Effective Status
        function getEffectiveStatus(order) {
            const raw = String(order.status || '').toLowerCase().trim();
            if (raw === 'delivered') return 'delivered';
            if (raw === 'cancelled' || raw === 'canceled') return 'cancelled';
            if (raw === 'returned') return 'returned';
            if (raw === 'return_requested') return 'return_requested';

            if (checkIsOutForDelivery(order)) {
                return 'out_for_delivery';
            }

            if (raw === 'shipped' || raw === 'in_transit' || raw === 'dispatched') {
                return 'shipped';
            }
            if (raw === 'confirmed' || raw === 'processing' || raw === 'placed') {
                return 'placed';
            }
            return raw || 'placed';
        }

        // Return Eligibility Check: Auto-hides after 7 days
        function getReturnEligibility(order) {
            if (!order) return { eligible: false, hasPolicy: false, isExpired: true, daysLeft: 0 };

            const policyStr = String(order.returnPolicy || order.return_policy || '').toLowerCase();
            const hasNoReturn = (order.isReturnable === false) ||
                                (order.hasReturnPolicy === false) ||
                                (order.returnEligible === false) ||
                                policyStr.includes('no return') ||
                                policyStr.includes('non-returnable') ||
                                policyStr.includes('not returnable');

            if (hasNoReturn) {
                return { eligible: false, hasPolicy: false, isExpired: true, daysLeft: 0 };
            }

            const statusStr = String(order.status || '').toLowerCase();
            if (statusStr === 'returned' || statusStr === 'return_requested' || order.returnStatus) {
                return { eligible: false, hasPolicy: true, isExpired: true, isRequested: true, daysLeft: 0 };
            }

            const returnDaysLimit = parseInt(order.returnDays || order.returnPeriod || DEFAULT_RETURN_DAYS, 10);
            const baseDate = parseDateSafe(order.deliveredDate || order.deliveredAt || order.deliveryDate || order.date || order.createdAt);

            if (!baseDate) {
                return { eligible: true, hasPolicy: true, isExpired: false, daysLeft: returnDaysLimit };
            }

            const diffMs = Date.now() - baseDate.getTime();
            const diffDays = diffMs / (1000 * 60 * 60 * 24);
            const isExpired = diffDays > returnDaysLimit;
            const daysLeft = Math.max(0, Math.ceil(returnDaysLimit - diffDays));

            return {
                eligible: !isExpired,
                hasPolicy: true,
                isExpired: isExpired,
                daysLeft: daysLeft,
                returnDaysLimit: returnDaysLimit,
                expiryDate: new Date(baseDate.getTime() + returnDaysLimit * 24 * 60 * 60 * 1000)
            };
        }

        function formatDatePretty(val) {
            const d = parseDateSafe(val);
            if (!d) return 'Recently';
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // Update Top Strip UI
        function updateAccountStripUI() {
            const el = document.getElementById('userLoginPhoneDisplay');
            if (loggedInPhone) {
                el.innerHTML = `+91 ${loggedInPhone} <span class="verified-badge"><i class="fa-solid fa-circle-check"></i> Verified</span>`;
            } else {
                el.innerHTML = `<span style="color: var(--accent-dark);">No Login Detected (Click Switch)</span>`;
            }
        }

        // Switch Number Modal
        window.promptSwitchNumber = function() {
            Swal.fire({
                title: 'Enter Mobile Number',
                text: 'Enter the 10-digit mobile number you used for orders:',
                input: 'tel',
                inputValue: loggedInPhone || '',
                inputPlaceholder: 'e.g. 7356587790',
                showCancelButton: true,
                confirmButtonText: 'View Orders',
                confirmButtonColor: '#0b0b0f',
                cancelButtonColor: '#64748b',
                inputValidator: (value) => {
                    const norm = normalizePhone(value);
                    if (!norm || norm.length < 10) {
                        return 'Please enter a valid 10-digit mobile number!';
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    loggedInPhone = normalizePhone(result.value);
                    localStorage.setItem('cartprime_user_phone', loggedInPhone);
                    updateAccountStripUI();
                    fetchOrders();
                }
            });
        };

        // Parse Orders from Database Structure
        function parseOrdersFromDatabase(data) {
            const orders = [];
            if (!data || typeof data !== 'object') return orders;

            Object.keys(data).forEach(key => {
                const val = data[key];
                if (!val || typeof val !== 'object') return;

                if (val.customerPhone || val.address || val.createdAt || val.date || val.deliveryDate) {
                    orders.push({ ...val, id: val.id || key });
                } else {
                    const phoneKey = normalizePhone(key);
                    Object.keys(val).forEach(orderId => {
                        const order = val[orderId];
                        if (order && typeof order === 'object') {
                            orders.push({
                                ...order,
                                id: order.id || orderId,
                                customerPhone: order.customerPhone || phoneKey
                            });
                        }
                    });
                }
            });

            return orders;
        }

        // Fetch Orders
        async function fetchOrders() {
            const loader = document.getElementById('loadingIndicator');

            try {
                if (loggedInPhone) {
                    const resDirect = await fetch(`${FIREBASE_RTDB_URL}/orders/${loggedInPhone}.json`);
                    if (resDirect.ok) {
                        const fetchedData = await resDirect.json();
                        if (fetchedData) {
                            const list = [];
                            Object.keys(fetchedData).forEach(oId => {
                                const ord = fetchedData[oId];
                                if (ord && typeof ord === 'object') {
                                    list.push({ ...ord, id: ord.id || oId, customerPhone: ord.customerPhone || loggedInPhone });
                                }
                            });
                            if (list.length > 0) {
                                dbAllOrders = list;
                                renderMatchingOrders();
                            }
                        }
                    }
                }

                if (!dbAllOrders.length) {
                    const resAll = await fetch(`${FIREBASE_RTDB_URL}/orders.json`);
                    if (resAll.ok) {
                        const allData = await resAll.json();
                        if (allData) {
                            dbAllOrders = parseOrdersFromDatabase(allData);
                            renderMatchingOrders();
                        }
                    }
                }
            } catch (err) {
                console.log("REST fetch note:", err.message);
            }

            if (db) {
                try {
                    const ordersRef = ref(db, 'orders');
                    onValue(ordersRef, (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            dbAllOrders = parseOrdersFromDatabase(data);
                            renderMatchingOrders();
                        }
                    });
                } catch(e) {}
            }

            setTimeout(() => {
                if (loader) loader.style.display = 'none';
                renderMatchingOrders();
            }, 600);
        }

        // Filter by Logged In Phone & Render
        function renderMatchingOrders() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.style.display = 'none';

            if (loggedInPhone && dbAllOrders.length) {
                displayedOrders = dbAllOrders.filter(ord => {
                    const p1 = normalizePhone(ord.customerPhone);
                    const p2 = normalizePhone(ord.phone);
                    const p3 = normalizePhone(ord.customerMobile);
                    const p4 = normalizePhone(ord.mobile);
                    const p5 = normalizePhone(ord.shippingAddress && (ord.shippingAddress.phone || ord.shippingAddress.mobile));
                    const p6 = normalizePhone(ord.address && (ord.address.phone || ord.address.mobile));

                    return p1 === loggedInPhone || p2 === loggedInPhone || p3 === loggedInPhone || 
                           p4 === loggedInPhone || p5 === loggedInPhone || p6 === loggedInPhone;
                });
            } else {
                displayedOrders = dbAllOrders;
            }

            displayedOrders.sort((a, b) => {
                const da = parseDateSafe(a.date || a.createdAt) || new Date(0);
                const db = parseDateSafe(b.date || b.createdAt) || new Date(0);
                return db - da;
            });

            updateCounts();
            applyFilters();
        }

        function updateCounts() {
            const counts = { all: displayedOrders.length, placed: 0, shipped: 0, out_for_delivery: 0, delivered: 0, cancelled: 0 };
            displayedOrders.forEach(ord => {
                const st = getEffectiveStatus(ord);
                if (counts[st] !== undefined) counts[st]++;
            });

            document.getElementById('ordersCountBadge').textContent = displayedOrders.length;
            document.getElementById('count-all').textContent = counts.all;
            document.getElementById('count-placed').textContent = counts.placed;
            document.getElementById('count-shipped').textContent = counts.shipped;
            document.getElementById('count-out_for_delivery').textContent = counts.out_for_delivery;
            document.getElementById('count-delivered').textContent = counts.delivered;
            document.getElementById('count-cancelled').textContent = counts.cancelled;
        }

        function applyFilters() {
            filteredOrders = displayedOrders.filter(ord => {
                const effStatus = getEffectiveStatus(ord);
                const filterMatch = (activeFilter === 'all') || (effStatus === activeFilter);
                if (!filterMatch) return false;

                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                const oid = String(ord.id || ord.orderId || '').toLowerCase();
                const title = String(ord.productTitle || ord.title || (ord.items && ord.items[0]?.title) || '').toLowerCase();
                return oid.includes(q) || title.includes(q);
            });

            renderOrdersList();
        }

        // Render Cards List
        function renderOrdersList() {
            const container = document.getElementById('ordersList');

            if (!filteredOrders.length) {
                container.innerHTML = `
                    <div class="empty-orders-view">
                        <div class="empty-icon-wrap">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h3>No Orders Found</h3>
                        <p>${loggedInPhone ? `No orders found for <strong>+91 ${loggedInPhone}</strong>. If your orders are under another number, click Switch.` : 'Please log in on the Home page or switch account to view orders.'}</p>
                        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                            <button type="button" class="meesho-btn meesho-btn-outline" onclick="promptSwitchNumber()">
                                <i class="fa-solid fa-arrow-right-arrow-left"></i> Switch Number
                            </button>
                            <a href="index.html" class="meesho-btn meesho-btn-accent">
                                <i class="fa-solid fa-bag-shopping"></i> Start Shopping
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            let html = '';
            filteredOrders.forEach(order => {
                const effStatus = getEffectiveStatus(order);
                const itemsList = getOrderItemsList(order);
                const firstItem = itemsList[0] || order;
                const imgUrl = extractItemImage(firstItem, order);
                const title = firstItem.title || firstItem.productTitle || order.productTitle || 'CartPrime Product';
                const price = order.totalAmount || order.total || order.price || (firstItem.price * (firstItem.quantity || 1)) || 0;
                const qty = firstItem.quantity || firstItem.qty || 1;
                const formattedDate = formatDatePretty(order.date || order.createdAt);
                const orderId = order.id || order.orderId || 'CP-ORD';

                let progressWidth = '15%';
                let step1 = 'completed', step2 = '', step3 = '', step4 = '';

                if (effStatus === 'placed') {
                    progressWidth = '15%';
                    step1 = 'current';
                } else if (effStatus === 'shipped') {
                    progressWidth = '48%';
                    step1 = 'completed';
                    step2 = 'current';
                } else if (effStatus === 'out_for_delivery') {
                    progressWidth = '78%';
                    step1 = 'completed';
                    step2 = 'completed';
                    step3 = 'current out-delivery';
                } else if (effStatus === 'delivered') {
                    progressWidth = '100%';
                    step1 = 'completed';
                    step2 = 'completed';
                    step3 = 'completed';
                    step4 = 'completed';
                } else if (effStatus === 'cancelled' || effStatus === 'returned') {
                    progressWidth = '0%';
                }

                const returnInfo = getReturnEligibility(order);
                const canReturn = (effStatus === 'delivered' && returnInfo.hasPolicy && !returnInfo.isExpired);

                let badgeHtml = '';
                if (effStatus === 'out_for_delivery') {
                    badgeHtml = `<span class="status-badge out-delivery"><i class="fa-solid fa-truck-fast"></i> Out for Delivery • Arriving Today</span>`;
                } else if (effStatus === 'delivered') {
                    badgeHtml = `<span class="status-badge delivered"><i class="fa-solid fa-circle-check"></i> Delivered</span>`;
                } else if (effStatus === 'shipped') {
                    badgeHtml = `<span class="status-badge shipped"><i class="fa-solid fa-truck"></i> Shipped</span>`;
                } else if (effStatus === 'placed') {
                    badgeHtml = `<span class="status-badge placed"><i class="fa-solid fa-clock"></i> Placed</span>`;
                } else if (effStatus === 'cancelled') {
                    badgeHtml = `<span class="status-badge cancelled"><i class="fa-solid fa-ban"></i> Cancelled</span>`;
                } else if (effStatus === 'return_requested' || returnInfo.isRequested) {
                    badgeHtml = `<span class="status-badge returned"><i class="fa-solid fa-rotate-left"></i> Return Requested</span>`;
                } else {
                    badgeHtml = `<span class="status-badge returned"><i class="fa-solid fa-rotate-left"></i> ${effStatus}</span>`;
                }

                let noteHtml = '';
                if (effStatus === 'out_for_delivery') {
                    noteHtml = `<div class="delivery-note-strip out"><i class="fa-solid fa-bolt"></i> Order is out for delivery and will reach you today!</div>`;
                } else if (effStatus === 'delivered') {
                    if (canReturn) {
                        noteHtml = `<div class="delivery-note-strip delivered"><i class="fa-solid fa-shield-check"></i> Delivered. Return available for next ${returnInfo.daysLeft} days.</div>`;
                    } else if (returnInfo.hasPolicy && returnInfo.isExpired) {
                        noteHtml = `<div class="delivery-note-strip shipped"><i class="fa-solid fa-circle-check"></i> Delivered on ${formatDatePretty(order.deliveredDate || order.date)}. Return window closed.</div>`;
                    }
                }

                html += `
                    <div class="order-card" onclick="window.viewOrderDetails('${orderId}')">
                        <div class="order-card-header">
                            <div class="order-id-meta">
                                Order <strong>#${orderId}</strong> • ${formattedDate}
                            </div>
                            <div>${badgeHtml}</div>
                        </div>

                        <div class="order-card-body">
                            <img src="${imgUrl}" class="order-item-img" alt="${title}" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_SVG}'" loading="lazy">
                            <div class="order-item-info">
                                <h3 class="order-item-title">${title}</h3>
                                <div class="order-item-meta">
                                    <span><i class="fa-solid fa-layer-group"></i> Qty: ${qty}</span>
                                    ${firstItem.size ? `<span><i class="fa-solid fa-ruler"></i> Size: ${firstItem.size}</span>` : ''}
