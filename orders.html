<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders | CartPrime</title>

    <!-- Shopping Bag Favicon (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b0b0f'/><path d='M17 8h-1.5c0-1.93-1.57-3.5-3.5-3.5S8.5 6.07 8.5 8H7c-.83 0-1.5.67-1.5 1.5v8C5.5 18.33 6.17 19 7 19h10c.83 0 1.5-.67 1.5-1.5v-8C18.5 8.67 17.83 8 17 8zm-5-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm5 11.5H7v-8h10v8z' fill='%23f59e0b'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b0b0f'/><path d='M17 8h-1.5c0-1.93-1.57-3.5-3.5-3.5S8.5 6.07 8.5 8H7c-.83 0-1.5.67-1.5 1.5v8C5.5 18.33 6.17 19 7 19h10c.83 0 1.5-.67 1.5-1.5v-8C18.5 8.67 17.83 8 17 8zm-5-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm5 11.5H7v-8h10v8z' fill='%23f59e0b'/></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --primary: #0b0b0f; 
            --bg: #f4f6fa; 
            --white: #ffffff; 
            --surface: #ffffff;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --accent-soft: rgba(245, 158, 11, 0.12);
            --accent-border: rgba(245, 158, 11, 0.35);
            --border-color: #e6e9f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.12);
            --info: #3b82f6;
            --info-soft: rgba(59, 130, 246, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Top Sticky Navbar */
        .top-navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
        }

        .nav-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #f1f5f9;
            color: var(--primary);
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }

        .btn-back:hover {
            background: #e2e8f0;
        }

        .page-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title span.badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            border-radius: 20px;
            border: 1px solid var(--accent-border);
        }

        .nav-right a {
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 8px;
            transition: color 0.2s;
            text-decoration: none;
        }

        .nav-right a:hover {
            color: var(--primary);
        }

        /* Main Container */
        .main-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Search Box */
        .search-box-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-box-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--border-color);
            background: var(--white);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        /* Filter Chips */
        .filter-scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            white-space: nowrap;
            padding: 7px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--white);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(11, 11, 15, 0.2);
        }

        .filter-chip .chip-count {
            font-size: 0.72rem;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }

        .filter-chip:not(.active) .chip-count {
            background: #e2e8f0;
            color: var(--text-main);
        }

        /* Order Card */
        .order-card {
            background: var(--white);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .order-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        /* Card Header */
        .order-card-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #fafbfc;
        }

        .order-id-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .order-id-meta strong {
            color: var(--primary);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status-badge.placed {
            background: var(--info-soft);
            color: var(--info);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .status-badge.shipped {
            background: var(--accent-soft);
            color: var(--accent-dark);
            border: 1px solid var(--accent-border);
        }

        .status-badge.out-delivery {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fcd34d;
            animation: pulse-border 1.8s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .status-badge.delivered {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.cancelled {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .status-badge.returned {
            background: #f3e8ff;
            color: #7e22ce;
            border: 1px solid #d8b4fe;
        }

        /* Card Body */
        .order-card-body {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .order-item-img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            flex-shrink: 0;
        }

        .order-item-info {
            flex: 1;
            min-width: 0;
        }

        .order-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.35;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .order-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .order-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary);
        }

        .order-payment-tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* Stepper Tracker */
        .stepper-wrap {
            padding: 12px 16px 14px;
            background: #fafbfc;
            border-top: 1px solid #f1f5f9;
        }

        .stepper-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-bottom: 6px;
        }

        .stepper-progress::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 14px;
            right: 14px;
            height: 3px;
            background: #e2e8f0;
            z-index: 1;
        }

        .stepper-progress-fill {
            position: absolute;
            top: 11px;
            left: 14px;
            height: 3px;
            background: var(--accent);
            z-index: 2;
            transition: width 0.3s ease;
        }

        .step-node {
            position: relative;
            z-index: 3;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--white);
            border: 3px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--white);
            transition: all 0.3s;
        }

        .step-node.completed {
            background: var(--accent);
            border-color: var(--accent);
        }

        .step-node.current {
            background: var(--primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }

        .step-node.current.out-delivery {
            background: #f59e0b;
            border-color: #0b0b0f;
            animation: pulse-step 1.5s infinite;
        }

        @keyframes pulse-step {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .step-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .step-labels span.active {
            color: var(--primary);
            font-weight: 700;
        }

        /* Delivery Note Strip */
        .delivery-note-strip {
            margin: 8px 16px 0;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delivery-note-strip.out {
            background: #fffbeb;
            border: 1px dashed #fde68a;
            color: #b45309;
        }

        .delivery-note-strip.delivered {
            background: #ecfdf5;
            border: 1px dashed #a7f3d0;
            color: #047857;
        }

        .delivery-note-strip.shipped {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            color: var(--text-main);
        }

        /* Action Buttons */
        .order-card-actions {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            background: var(--white);
        }

        .meesho-btn {
            border: none;
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .meesho-btn-outline {
            background: var(--white);
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
        }

        .meesho-btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .meesho-btn-primary {
            background: var(--primary);
            color: var(--white);
            border: 1.5px solid var(--primary);
        }

        .meesho-btn-primary:hover {
            background: #1e293b;
        }

        .meesho-btn-accent {
            background: var(--accent);
            color: var(--primary);
            border: 1.5px solid var(--accent);
        }

        .meesho-btn-accent:hover {
            background: var(--accent-dark);
            color: var(--white);
        }

        .meesho-return-btn {
            background: #fffbeb;
            border: 1.5px solid #fcd34d;
            color: #b45309;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .meesho-return-btn:hover {
            background: #fef3c7;
            border-color: #f59e0b;
        }

        .meesho-btn-danger {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #dc2626;
        }

        .meesho-btn-danger:hover {
            background: #fee2e2;
        }

        /* Empty State */
        .empty-orders-view {
            text-align: center;
            padding: 50px 20px;
            background: var(--white);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        .empty-icon-wrap {
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-dark);
            font-size: 2rem;
        }

        .empty-orders-view h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .empty-orders-view p {
            font-size: 0.88rem;
            color: var(--text-muted);
            max-width: 360px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }

        /* Modal Styles */
        .order-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        @media (min-width: 640px) {
            .order-modal-backdrop {
                align-items: center;
                padding: 20px;
            }
        }

        .order-modal-sheet {
            background: var(--white);
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
        }

        @media (min-width: 640px) {
            .order-modal-sheet {
                border-radius: 20px;
            }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 10;
        }

        .modal-header h4 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .modal-close-btn {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .detail-box {
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.88rem;
        }

        .detail-row.bold {
            font-weight: 800;
            border-top: 1px dashed var(--border-color);
            margin-top: 6px;
            padding-top: 10px;
            font-size: 0.98rem;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header class="top-navbar">
        <div class="nav-inner">
            <div class="nav-left">
                <a href="index.html" class="btn-back" title="Back to Store">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="page-title">
                    My Orders
                    <span class="badge" id="ordersCountBadge">0</span>
                </h1>
            </div>
            <div class="nav-right">
                <a href="index.html" title="Shopping"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Search Orders -->
        <div class="search-box-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="orderSearchInput" class="search-input" placeholder="Search by Product Name or Order ID..." autocomplete="off">
        </div>

        <!-- Filter Chips -->
        <div class="filter-scroll-container">
            <button class="filter-chip active" data-filter="all">All <span class="chip-count" id="count-all">0</span></button>
            <button class="filter-chip" data-filter="placed">Placed <span class="chip-count" id="count-placed">0</span></button>
            <button class="filter-chip" data-filter="shipped">Shipped <span class="chip-count" id="count-shipped">0</span></button>
            <button class="filter-chip" data-filter="out_for_delivery">Out for Delivery <span class="chip-count" id="count-out_for_delivery">0</span></button>
            <button class="filter-chip" data-filter="delivered">Delivered <span class="chip-count" id="count-delivered">0</span></button>
            <button class="filter-chip" data-filter="cancelled">Cancelled <span class="chip-count" id="count-cancelled">0</span></button>
        </div>

        <!-- Orders List Container -->
        <div id="ordersList"></div>
    </main>

    <!-- Details Modal -->
    <div class="order-modal-backdrop" id="orderDetailsModal" onclick="closeOrderModal(event)">
        <div class="order-modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h4 id="modalOrderTitle">Order Details</h4>
                <button type="button" class="modal-close-btn" onclick="closeOrderModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalOrderBody"></div>
        </div>
    </div>

    <!-- Main Logic Script (Self-contained, Fast, Non-blocking) -->
    <script>
        const SUPPORT_WHATSAPP = "919000000000"; 
        const DEFAULT_RETURN_DAYS = 7;

        // Guaranteed Inline SVG Fallback
        const DEFAULT_FALLBACK_SVG = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22%23f1f5f9%22%2F%3E%3Cpath%20d%3D%22M76%2042h-6c0-7.7-6.3-14-14-14s-14%206.3-14%2014h-6c-3.3%200-6%202.7-6%206v32c0%203.3%202.7%206%206%206h40c3.3%200%206-2.7%206-6V48c0-3.3-2.7-6-6-6zm-20-8c4.4%200%208%203.6%208%208h-16c0-4.4%203.6-8%208-8zm20%2046H42V48h40v32z%22%20fill%3D%22%23f59e0b%22%2F%3E%3C%2Fsvg%3E";

        let allOrders = [];
        let filteredOrders = [];
        let activeFilter = 'all';
        let searchQuery = '';

        // Safe Image Extractor
        function extractItemImage(item, order) {
            if (item) {
                if (typeof item.image === 'string' && item.image.trim()) return item.image.trim();
                if (typeof item.productImage === 'string' && item.productImage.trim()) return item.productImage.trim();
                if (typeof item.img === 'string' && item.img.trim()) return item.img.trim();
                if (typeof item.thumbnail === 'string' && item.thumbnail.trim()) return item.thumbnail.trim();
                if (Array.isArray(item.images) && item.images.length && typeof item.images[0] === 'string') return item.images[0].trim();
            }
            if (order) {
                if (typeof order.image === 'string' && order.image.trim()) return order.image.trim();
                if (typeof order.productImage === 'string' && order.productImage.trim()) return order.productImage.trim();
                if (typeof order.img === 'string' && order.img.trim()) return order.img.trim();
                if (typeof order.thumbnail === 'string' && order.thumbnail.trim()) return order.thumbnail.trim();
                if (Array.isArray(order.items) && order.items.length) {
                    const first = order.items[0];
                    if (first) {
                        if (typeof first.image === 'string' && first.image.trim()) return first.image.trim();
                        if (typeof first.productImage === 'string' && first.productImage.trim()) return first.productImage.trim();
                        if (typeof first.img === 'string' && first.img.trim()) return first.img.trim();
                    }
                }
            }
            return DEFAULT_FALLBACK_SVG;
        }

        // Safe Date Parser
        function parseDateSafe(val) {
            if (!val) return null;
            if (val instanceof Date && !isNaN(val.getTime())) return val;
            if (typeof val === 'number') {
                const d = new Date(val);
                return isNaN(d.getTime()) ? null : d;
            }
            if (typeof val === 'string') {
                const trimmed = val.trim();
                if (!trimmed) return null;
                const d = new Date(trimmed);
                if (!isNaN(d.getTime())) return d;
                const match = trimmed.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
                if (match) {
                    const day = parseInt(match[1], 10);
                    const month = parseInt(match[2], 10) - 1;
                    const year = parseInt(match[3], 10);
                    const testDate = new Date(year, month, day);
                    if (!isNaN(testDate.getTime())) return testDate;
                }
            }
            return null;
        }

        function isSameCalendarDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        // Check if Admin marked "Today Arriving" / "Arriving Today" / "Out for Delivery"
        function checkIsOutForDelivery(order) {
            if (!order) return false;
            const searchPool = [
                order.status,
                order.trackingStatus,
                order.deliveryStatus,
                order.adminStatus,
                order.deliveryNote,
                order.adminDeliveryNote,
                order.expectedDelivery,
                order.deliveryEstimate,
                order.deliveryDate
            ].filter(Boolean).map(s => String(s).toLowerCase()).join(' ');

            if (
                searchPool.includes('today arriving') ||
                searchPool.includes('arriving today') ||
                searchPool.includes('today delivery') ||
                searchPool.includes('delivery today') ||
                searchPool.includes('out for delivery') ||
                searchPool.includes('out_for_delivery') ||
                searchPool.includes('out-for-delivery')
            ) {
                return true;
            }

            if (order.deliveryDate || order.expectedDelivery) {
                const d = parseDateSafe(order.deliveryDate || order.expectedDelivery);
                if (d && isSameCalendarDay(d, new Date())) {
                    return true;
                }
            }
            return false;
        }

        // Determine Effective Status
        function getEffectiveStatus(order) {
            const raw = String(order.status || '').toLowerCase().trim();
            if (raw === 'delivered') return 'delivered';
            if (raw === 'cancelled' || raw === 'canceled') return 'cancelled';
            if (raw === 'returned') return 'returned';
            if (raw === 'return_requested') return 'return_requested';

            if (checkIsOutForDelivery(order)) {
                return 'out_for_delivery';
            }

            if (raw === 'shipped' || raw === 'in_transit' || raw === 'dispatched') {
                return 'shipped';
            }
            if (raw === 'confirmed' || raw === 'processing' || raw === 'placed') {
                return 'placed';
            }
            return raw || 'placed';
        }

        // Return Eligibility Check (Hides button if return period expired)
        function getReturnEligibility(order) {
            if (!order) return { eligible: false, hasPolicy: false, isExpired: true, daysLeft: 0 };

            const policyStr = String(order.returnPolicy || order.return_policy || '').toLowerCase();
            const hasNoReturn = (order.isReturnable === false) ||
                                (order.hasReturnPolicy === false) ||
                                (order.returnEligible === false) ||
                                policyStr.includes('no return') ||
                                policyStr.includes('non-returnable') ||
                                policyStr.includes('not returnable');

            if (hasNoReturn) {
                return { eligible: false, hasPolicy: false, isExpired: true, daysLeft: 0 };
            }

            const statusStr = String(order.status || '').toLowerCase();
            if (statusStr === 'returned' || statusStr === 'return_requested' || order.returnStatus) {
                return { eligible: false, hasPolicy: true, isExpired: true, isRequested: true, daysLeft: 0 };
            }

            const returnDaysLimit = parseInt(order.returnDays || order.returnPeriod || DEFAULT_RETURN_DAYS, 10);
            const baseDate = parseDateSafe(order.deliveredDate || order.deliveredAt || order.deliveryDate || order.date || order.createdAt);

            if (!baseDate) {
                return { eligible: true, hasPolicy: true, isExpired: false, daysLeft: returnDaysLimit };
            }

            const diffMs = Date.now() - baseDate.getTime();
            const diffDays = diffMs / (1000 * 60 * 60 * 24);
            const isExpired = diffDays > returnDaysLimit;
            const daysLeft = Math.max(0, Math.ceil(returnDaysLimit - diffDays));

            return {
                eligible: !isExpired,
                hasPolicy: true,
                isExpired: isExpired,
                daysLeft: daysLeft,
                returnDaysLimit: returnDaysLimit,
                expiryDate: new Date(baseDate.getTime() + returnDaysLimit * 24 * 60 * 60 * 1000)
            };
        }

        function formatDatePretty(val) {
            const d = parseDateSafe(val);
            if (!d) return 'Recently';
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // Load Orders From Local Storage (Instant 0ms Load)
        function loadLocalOrders() {
            const storageKeys = ['cartprime_orders', 'orders', 'my_orders', 'user_orders', 'cartprime_recent_orders'];
            for (const key of storageKeys) {
                try {
                    const raw = localStorage.getItem(key);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        let arr = Array.isArray(parsed) ? parsed : Object.values(parsed);
                        if (arr && arr.length > 0) {
                            return arr;
                        }
                    }
                } catch (e) {
                    console.warn("Storage read note for", key, e);
                }
            }
            return [];
        }

        // Update Counter Badges
        function updateCounts() {
            const counts = { all: allOrders.length, placed: 0, shipped: 0, out_for_delivery: 0, delivered: 0, cancelled: 0 };
            allOrders.forEach(ord => {
                const st = getEffectiveStatus(ord);
                if (counts[st] !== undefined) counts[st]++;
            });

            document.getElementById('ordersCountBadge').textContent = allOrders.length;
            document.getElementById('count-all').textContent = counts.all;
            document.getElementById('count-placed').textContent = counts.placed;
            document.getElementById('count-shipped').textContent = counts.shipped;
            document.getElementById('count-out_for_delivery').textContent = counts.out_for_delivery;
            document.getElementById('count-delivered').textContent = counts.delivered;
            document.getElementById('count-cancelled').textContent = counts.cancelled;
        }

        // Apply Filters & Search
        function applyFilters() {
            filteredOrders = allOrders.filter(ord => {
                const effStatus = getEffectiveStatus(ord);
                const filterMatch = (activeFilter === 'all') || (effStatus === activeFilter);
                if (!filterMatch) return false;

                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                const oid = String(ord.id || ord.orderId || '').toLowerCase();
                const title = String(ord.productTitle || ord.title || (ord.items && ord.items[0]?.title) || '').toLowerCase();
                return oid.includes(q) || title.includes(q);
            });

            renderOrders();
        }

        // Render Orders List
        function renderOrders() {
            const container = document.getElementById('ordersList');

            if (!filteredOrders.length) {
                container.innerHTML = `
                    <div class="empty-orders-view">
                        <div class="empty-icon-wrap">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h3>No Orders Found</h3>
                        <p>${searchQuery ? 'No orders match your search keyword.' : 'Looks like you haven’t placed any orders yet. Discover our top products today!'}</p>
                        <a href="index.html" class="meesho-btn meesho-btn-accent" style="display: inline-flex; margin: 0 auto;">
                            <i class="fa-solid fa-bag-shopping"></i> Start Shopping
                        </a>
                    </div>
                `;
                return;
            }

            let html = '';
            filteredOrders.forEach(order => {
                const effStatus = getEffectiveStatus(order);
                const firstItem = (order.items && order.items.length) ? order.items[0] : order;
                const imgUrl = extractItemImage(firstItem, order);
                const title = firstItem.title || firstItem.productTitle || order.productTitle || 'CartPrime Product';
                const price = order.totalAmount || order.total || order.price || (firstItem.price * (firstItem.quantity || 1)) || 0;
                const qty = firstItem.quantity || firstItem.qty || 1;
                const formattedDate = formatDatePretty(order.date || order.createdAt);
                const orderId = order.id || order.orderId || 'CP-ORD';

                let progressWidth = '15%';
                let step1 = 'completed', step2 = '', step3 = '', step4 = '';

                if (effStatus === 'placed') {
                    progressWidth = '15%';
                    step1 = 'current';
                } else if (effStatus === 'shipped') {
                    progressWidth = '48%';
                    step1 = 'completed';
                    step2 = 'current';
                } else if (effStatus === 'out_for_delivery') {
                    progressWidth = '78%';
                    step1 = 'completed';
                    step2 = 'completed';
                    step3 = 'current out-delivery';
                } else if (effStatus === 'delivered') {
                    progressWidth = '100%';
                    step1 = 'completed';
                    step2 = 'completed';
                    step3 = 'completed';
                    step4 = 'completed';
                } else if (effStatus === 'cancelled' || effStatus === 'returned') {
                    progressWidth = '0%';
                }

                // Return Eligibility Check: Button is ONLY shown if returnable AND not expired
                const returnInfo = getReturnEligibility(order);
                const canReturn = (effStatus === 'delivered' && returnInfo.hasPolicy && !returnInfo.isExpired);

                let badgeHtml = '';
                if (effStatus === 'out_for_delivery') {
                    badgeHtml = `<span class="status-badge out-delivery"><i class="fa-solid fa-truck-fast"></i> Out for Delivery • Arriving Today</span>`;
                } else if (effStatus === 'delivered') {
                    badgeHtml = `<span class="status-badge delivered"><i class="fa-solid fa-circle-check"></i> Delivered</span>`;
                } else if (effStatus === 'shipped') {
                    badgeHtml = `<span class="status-badge shipped"><i class="fa-solid fa-truck"></i> Shipped</span>`;
                } else if (effStatus === 'placed') {
                    badgeHtml = `<span class="status-badge placed"><i class="fa-solid fa-clock"></i> Placed</span>`;
                } else if (effStatus === 'cancelled') {
                    badgeHtml = `<span class="status-badge cancelled"><i class="fa-solid fa-ban"></i> Cancelled</span>`;
                } else if (effStatus === 'return_requested' || returnInfo.isRequested) {
                    badgeHtml = `<span class="status-badge returned"><i class="fa-solid fa-rotate-left"></i> Return Requested</span>`;
                } else {
                    badgeHtml = `<span class="status-badge returned"><i class="fa-solid fa-rotate-left"></i> ${effStatus}</span>`;
                }

                let noteHtml = '';
                if (effStatus === 'out_for_delivery') {
                    noteHtml = `<div class="delivery-note-strip out"><i class="fa-solid fa-bolt"></i> Order is out for delivery and will reach you today!</div>`;
                } else if (effStatus === 'delivered') {
                    if (canReturn) {
                        noteHtml = `<div class="delivery-note-strip delivered"><i class="fa-solid fa-shield-check"></i> Delivered. Return available for next ${returnInfo.daysLeft} days.</div>`;
                    } else if (returnInfo.hasPolicy && returnInfo.isExpired) {
                        noteHtml = `<div class="delivery-note-strip shipped"><i class="fa-solid fa-circle-check"></i> Delivered on ${formatDatePretty(order.deliveredDate || order.date)}. Return window closed.</div>`;
                    }
                }

                html += `
                    <div class="order-card" onclick="window.viewOrderDetails('${orderId}')">
                        <div class="order-card-header">
                            <div class="order-id-meta">
                                Order <strong>#${orderId}</strong> • ${formattedDate}
                            </div>
                            <div>${badgeHtml}</div>
                        </div>

                        <div class="order-card-body">
                            <img src="${imgUrl}" class="order-item-img" alt="${title}" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_SVG}'" loading="lazy">
                            <div class="order-item-info">
                                <h3 class="order-item-title">${title}</h3>
                                <div class="order-item-meta">
                                    <span><i class="fa-solid fa-layer-group"></i> Qty: ${qty}</span>
                                    ${firstItem.size ? `<span><i class="fa-solid fa-ruler"></i> Size: ${firstItem.size}</span>` : ''}
                                    ${order.items && order.items.length > 1 ? `<span style="color: var(--accent-dark); font-weight:700;">+${order.items.length - 1} more items</span>` : ''}
                                </div>
                                <div class="order-price-row">
                                    <span class="order-price">₹${Number(price).toLocaleString('en-IN')}</span>
                                    <span class="order-payment-tag">${(order.paymentMethod || 'COD').toUpperCase()}</span>
                                </div>
                            </div>
                        </div>

                        ${effStatus !== 'cancelled' ? `
                            <div class="stepper-wrap">
                                <div class="stepper-progress">
                                    <div class="stepper-progress-fill" style="width: ${progressWidth};"></div>
                                    <div class="step-node ${step1}"><i class="fa-solid fa-check"></i></div>
                                    <div class="step-node ${step2}"><i class="fa-solid fa-truck"></i></div>
                                    <div class="step-node ${step3}"><i class="fa-solid fa-truck-fast"></i></div>
                                    <div class="step-node ${step4}"><i class="fa-solid fa-house"></i></div>
                                </div>
                                <div class="step-labels">
                                    <span class="${step1 ? 'active' : ''}">Placed</span>
                                    <span class="${step2 ? 'active' : ''}">Shipped</span>
                                    <span class="${step3 ? 'active' : ''}">Out for Delivery</span>
                                    <span class="${step4 ? 'active' : ''}">Delivered</span>
                                </div>
                            </div>
                        ` : ''}

                        ${noteHtml}

                        <div class="order-card-actions" onclick="event.stopPropagation()">
                            <button type="button" class="meesho-btn meesho-btn-outline" onclick="window.viewOrderDetails('${orderId}')">
                                <i class="fa-solid fa-receipt"></i> Details
                            </button>

                            ${effStatus === 'placed' ? `
                                <button type="button" class="meesho-btn meesho-btn-danger" onclick="window.requestCancelOrder('${orderId}')">
                                    <i class="fa-solid fa-xmark"></i> Cancel
                                </button>
                            ` : ''}

                            <!-- Return button is automatically hidden if return period expired -->
                            ${canReturn ? `
                                <button type="button" class="meesho-return-btn" onclick="window.requestReturnOrder('${orderId}')">
                                    <i class="fa-solid fa-rotate-left"></i> Return
                                </button>
                            ` : ''}

                            <a href="https://wa.me/${SUPPORT_WHATSAPP}?text=Hi%20CartPrime%20Support,%20I%20need%20help%20with%20Order%20%23${orderId}" target="_blank" class="meesho-btn meesho-btn-outline" style="color: #16a34a; border-color: #bbf7d0;">
                                <i class="fa-brands fa-whatsapp"></i> Help
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // View Order Details
        window.viewOrderDetails = function(orderId) {
            const order = allOrders.find(o => String(o.id || o.orderId) === String(orderId));
            if (!order) return;

            const effStatus = getEffectiveStatus(order);
            const returnInfo = getReturnEligibility(order);
            const canReturn = (effStatus === 'delivered' && returnInfo.hasPolicy && !returnInfo.isExpired);

            const modalTitle = document.getElementById('modalOrderTitle');
            const modalBody = document.getElementById('modalOrderBody');
            modalTitle.textContent = `Order #${orderId}`;

            let itemsHtml = '';
            const items = (order.items && order.items.length) ? order.items : [order];
            items.forEach(it => {
                const itImg = extractItemImage(it, order);
                const itTitle = it.title || it.productTitle || order.productTitle || 'Item';
                const itPrice = it.price || order.totalAmount || 0;
                const itQty = it.quantity || it.qty || 1;
                itemsHtml += `
                    <div style="display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9;">
                        <img src="${itImg}" style="width: 54px; height: 54px; border-radius: 8px; object-fit: cover; border: 1px solid #e2e8f0;" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_SVG}'">
                        <div style="flex: 1;">
                            <div style="font-size: 0.88rem; font-weight: 700; color: var(--primary);">${itTitle}</div>
                            <div style="font-size: 0.78rem; color: var(--text-muted);">Qty: ${itQty} ${it.size ? `• Size: ${it.size}` : ''}</div>
                        </div>
                        <div style="font-weight: 800; font-size: 0.95rem; color: var(--primary);">₹${Number(itPrice * itQty).toLocaleString('en-IN')}</div>
                    </div>
                `;
            });

            const addr = order.shippingAddress || order.address || {};
            const addressString = typeof addr === 'string' ? addr : `
                <strong>${addr.name || order.customerName || 'Customer'}</strong><br>
                ${addr.house || addr.addressLine1 || addr.street || ''} ${addr.area || addr.landmark ? '<br>' + (addr.area || addr.landmark) : ''}<br>
                ${addr.city || ''} ${addr.state || ''} - ${addr.pincode || addr.pin || ''}<br>
                <i class="fa-solid fa-phone" style="margin-right: 4px; font-size: 0.8rem;"></i> ${addr.phone || order.customerPhone || 'N/A'}
            `;

            modalBody.innerHTML = `
                <div style="padding: 12px; border-radius: 12px; margin-bottom: 16px; background: ${effStatus === 'out_for_delivery' ? '#fffbeb' : '#f8fafc'}; border: 1px solid ${effStatus === 'out_for_delivery' ? '#fde68a' : '#e2e8f0'}; display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Current Status</div>
                        <div style="font-size: 0.95rem; font-weight: 800; color: var(--primary); text-transform: capitalize;">
                            ${effStatus === 'out_for_delivery' ? '🚀 Out for Delivery (Arriving Today)' : effStatus}
                        </div>
                    </div>
                    <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">
                        ${formatDatePretty(order.date || order.createdAt)}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Items Ordered</div>
                    <div class="detail-box">${itemsHtml}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Delivery Address</div>
                    <div class="detail-box" style="font-size: 0.86rem; line-height: 1.5;">${addressString}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Payment Summary</div>
                    <div class="detail-box">
                        <div class="detail-row"><span>Items Total</span> <span>₹${Number(order.totalAmount || order.price || 0).toLocaleString('en-IN')}</span></div>
                        <div class="detail-row"><span>Delivery Charge</span> <span style="color: var(--success); font-weight: 700;">FREE</span></div>
                        <div class="detail-row bold"><span>Total Paid</span> <span>₹${Number(order.totalAmount || order.price || 0).toLocaleString('en-IN')}</span></div>
                        <div class="detail-row" style="color: var(--text-muted); font-size: 0.78rem;">
                            <span>Payment Mode</span> <span style="font-weight: 700;">${(order.paymentMethod || 'Cash on Delivery').toUpperCase()}</span>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    ${effStatus === 'placed' ? `
                        <button type="button" class="meesho-btn meesho-btn-danger" style="flex: 1; justify-content: center;" onclick="window.requestCancelOrder('${orderId}')">
                            <i class="fa-solid fa-xmark"></i> Cancel Order
                        </button>
                    ` : ''}

                    ${canReturn ? `
                        <button type="button" class="meesho-return-btn" style="flex: 1; justify-content: center;" onclick="window.requestReturnOrder('${orderId}')">
                            <i class="fa-solid fa-rotate-left"></i> Return Item (${returnInfo.daysLeft}d left)
                        </button>
                    ` : ''}

                    <a href="https://wa.me/${SUPPORT_WHATSAPP}?text=Hi%20CartPrime,%20need%20help%20with%20order%20%23${orderId}" target="_blank" class="meesho-btn meesho-btn-primary" style="flex: 1; justify-content: center;">
                        <i class="fa-brands fa-whatsapp"></i> Support
                    </a>
                </div>
            `;

            document.getElementById('orderDetailsModal').style.display = 'flex';
        };

        window.closeOrderModal = function(e) {
            if (!e || e.target.id === 'orderDetailsModal' || !e.target) {
                document.getElementById('orderDetailsModal').style.display = 'none';
            }
        };

        // Return Request Flow
        window.requestReturnOrder = function(orderId) {
            const order = allOrders.find(o => String(o.id || o.orderId) === String(orderId));
            if (!order) return;

            const returnInfo = getReturnEligibility(order);
            if (returnInfo.isExpired) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Return Window Closed',
                    text: `The ${returnInfo.returnDaysLimit || 7}-day return period for this order has expired.`,
                    confirmButtonColor: '#0b0b0f'
                });
                return;
            }

            Swal.fire({
                title: 'Return Product',
                html: `
                    <div style="text-align: left; font-size: 0.9rem;">
                        <label style="font-weight: 700; display: block; margin-bottom: 6px;">Please select reason for return:</label>
                        <select id="swalReturnReason" style="width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid #cbd5e1; margin-bottom: 12px; outline: none; font-size: 0.88rem;">
                            <option value="Defective or Damaged Product">Defective or Damaged Product</option>
                            <option value="Different Item Delivered">Different Item Delivered</option>
                            <option value="Quality Not As Expected">Quality Not As Expected</option>
                            <option value="Size / Fit Issue">Size / Fit Issue</option>
                            <option value="Other">Other Reason</option>
                        </select>
                        <label style="font-weight: 700; display: block; margin-bottom: 6px;">Additional details (optional):</label>
                        <textarea id="swalReturnComment" placeholder="Explain the issue..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 0.88rem; outline: none; height: 70px; resize: none;"></textarea>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Submit Return',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#f59e0b',
                cancelButtonColor: '#64748b',
                preConfirm: () => {
                    const reason = document.getElementById('swalReturnReason').value;
                    const comment = document.getElementById('swalReturnComment').value;
                    return { reason, comment };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const { reason } = result.value;
                    order.status = 'return_requested';
                    order.returnReason = reason;

                    // Save local state
                    try {
                        localStorage.setItem('cartprime_orders', JSON.stringify(allOrders));
                    } catch (e) {}

                    Swal.fire({
                        icon: 'success',
                        title: 'Return Request Submitted!',
                        text: 'Our team will review your return request and contact you shortly.',
                        confirmButtonColor: '#0b0b0f'
                    });

                    closeOrderModal();
                    updateCounts();
                    applyFilters();
                }
            });
        };

        // Cancel Order Flow
        window.requestCancelOrder = function(orderId) {
            Swal.fire({
                title: 'Cancel Order?',
                text: 'Are you sure you want to cancel this order? This action cannot be undone.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Yes, Cancel Order',
                cancelButtonText: 'Keep Order'
            }).then((result) => {
                if (result.isConfirmed) {
                    const ord = allOrders.find(o => String(o.id || o.orderId) === String(orderId));
                    if (ord) ord.status = 'cancelled';

                    try {
                        localStorage.setItem('cartprime_orders', JSON.stringify(allOrders));
                    } catch (e) {}

                    Swal.fire({
                        icon: 'success',
                        title: 'Order Cancelled',
                        text: 'Your order has been cancelled successfully.',
                        confirmButtonColor: '#0b0b0f'
                    });

                    closeOrderModal();
                    updateCounts();
                    applyFilters();
                }
            });
        };

        // Initialize immediately without blocking
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Instant Local Orders Load
            const localList = loadLocalOrders();
            if (localList.length > 0) {
                allOrders = localList;
                allOrders.sort((a, b) => {
                    const da = parseDateSafe(a.date || a.createdAt) || new Date(0);
                    const db = parseDateSafe(b.date || b.createdAt) || new Date(0);
                    return db - da;
                });
            }

            updateCounts();
            applyFilters();

            // 2. Filter buttons
            document.querySelectorAll('.filter-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.getAttribute('data-filter');
                    applyFilters();
                });
            });

            // 3. Search box
            const searchInput = document.getElementById('orderSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.trim();
                    applyFilters();
                });
            }
        });
    </script>
</body>
</html>
