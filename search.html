<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Results - CartPrime</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Shopping Bag Favicons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b0b0f'/><path d='M17 8h-1.5c0-1.93-1.57-3.5-3.5-3.5S8.5 6.07 8.5 8H7c-.83 0-1.5.67-1.5 1.5v8C5.5 18.33 6.17 19 7 19h10c.83 0 1.5-.67 1.5-1.5v-8C18.5 8.67 17.83 8 17 8zm-5-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm5 11.5H7v-8h10v8z' fill='%23f59e0b'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b0b0f'/><path d='M17 8h-1.5c0-1.93-1.57-3.5-3.5-3.5S8.5 6.07 8.5 8H7c-.83 0-1.5.67-1.5 1.5v8C5.5 18.33 6.17 19 7 19h10c.83 0 1.5-.67 1.5-1.5v-8C18.5 8.67 17.83 8 17 8zm-5-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm5 11.5H7v-8h10v8z' fill='%23f59e0b'/></svg>">

    <style>
        /* --- CartPrime Amber & Cyber Black Theme --- */
        :root {
            --primary: #0b0b0f;
            --accent: #f59e0b;
            --accent-dark: #b45309;
            --accent-soft: rgba(245, 158, 11, 0.1);
            --accent-border: rgba(245, 158, 11, 0.35);
            --accent-glow: rgba(245, 158, 11, 0.4);
            --accent-glow-strong: rgba(245, 158, 11, 0.75);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --star-color: #f59e0b;
            --discount-bg: linear-gradient(135deg, #f59e0b, #ea580c);
            --discount-text: #111111;
            --border: #e2e8f0;
            --green: #16a34a;
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* --- Modern Glassmorphism Navbar --- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 12px 6%;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            gap: 16px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo i {
            color: var(--accent);
            font-size: 1.15rem;
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        .logo span {
            color: var(--accent);
        }

        /* Search Input Box */
        .search-wrapper {
            flex-grow: 1;
            max-width: 520px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i.search-icon-left {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 11px 44px 11px 42px;
            font-size: 0.92rem;
            font-weight: 600;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            background: #f1f5f9;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .clear-search-btn {
            position: absolute;
            right: 44px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            display: none;
            padding: 4px;
        }

        .clear-search-btn:hover {
            color: var(--text-main);
        }

        .search-submit-btn {
            position: absolute;
            right: 4px;
            background: var(--primary);
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .search-submit-btn:hover {
            background: var(--accent);
            color: #111;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* --- Controls Bar --- */
        .controls-bar {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 6% 8px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .controls-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .search-query-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-query-title span {
            color: var(--accent);
        }

        .results-count {
            font-size: 0.84rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .sort-dropdown {
            padding: 9px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--card-bg);
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }

        .sort-dropdown:focus, .sort-dropdown:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* --- Quick Filter Pills Bar --- */
        .filter-pills-bar {
            max-width: 1280px;
            margin: 0 auto;
            padding: 4px 6% 16px 6%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .filter-pills-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 700;
            background: #ffffff;
            border: 1.5px solid var(--border);
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .filter-pill:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-soft);
        }

        .filter-pill.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 14px rgba(0,0,0,0.2);
        }

        .filter-pill.active i {
            color: var(--accent);
        }

        /* --- Main Layout Container --- */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 6% 40px 6%;
        }

        /* --- Product Grid --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 640px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
            }
        }

        @media (min-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        /* --- Card Design with Ambient Glow --- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            animation: slideUpFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            padding: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.03);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.08), 0 0 20px var(--accent-glow);
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 180px;
            background: #f8fafc;
            overflow: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
            transition: transform 0.4s ease;
        }

        .card:hover .image-box img {
            transform: scale(1.06);
        }

        .discount-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--discount-bg);
            color: var(--discount-text);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 800;
            z-index: 2;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .stock-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #000;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            z-index: 2;
        }

        .verified-tag {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.62rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .verified-tag i {
            color: var(--accent);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-info h3 {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.35;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.5rem;
        }

        .card-rating-ui {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 700;
            min-height: 18px;
        }

        .card-rating-ui i {
            color: var(--star-color);
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: auto;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .price {
            font-size: 1.18rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .mrp {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 600;
        }

        .buy-btn {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .buy-btn i {
            color: var(--accent);
            transition: color 0.2s;
        }

        .buy-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #111;
            box-shadow: 0 0 16px var(--accent-glow-strong);
        }

        .buy-btn:hover:not(:disabled) i {
            color: #111;
        }

        .buy-btn:disabled {
            background: #e2e8f0;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* --- No Results Empty State --- */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            border: 1.5px dashed var(--accent-border);
            border-radius: 20px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            animation: slideUpFade 0.4s ease forwards;
        }

        .no-results i.empty-icon {
            font-size: 3rem;
            color: var(--accent);
            filter: drop-shadow(0 0 12px var(--accent-glow));
            margin-bottom: 4px;
        }

        .no-results h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .no-results p {
            font-size: 0.88rem;
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.5;
        }

        .no-results-btn {
            margin-top: 8px;
            padding: 11px 24px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .no-results-btn:hover {
            background: var(--accent);
            color: #111;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* --- Skeleton Loading Cards --- */
        .skeleton-card {
            background: #ffffff;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 320px;
            padding: 12px;
        }

        .skeleton-img {
            width: 100%;
            height: 180px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .skeleton-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .skeleton-line {
            height: 13px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive Controls */
        @media (max-width: 600px) {
            .navbar {
                padding: 10px 4%;
                flex-wrap: wrap;
                gap: 10px;
            }
            .logo { font-size: 1.1rem; }
            .search-wrapper {
                width: 100%;
                order: 3;
                max-width: 100%;
            }
            .controls-bar {
                padding: 14px 4% 6px 4%;
            }
            .filter-pills-bar {
                padding: 4px 4% 14px 4%;
            }
            .main-container {
                padding: 0 4% 30px 4%;
            }
            .search-query-title { font-size: 1.15rem; }
            .image-box { height: 140px; }
            .card-info h3 { font-size: 0.82rem; height: 2.2rem; }
            .price { font-size: 1rem; }
            .buy-btn { padding: 9px; font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <button class="back-btn" onclick="window.location.href='/'" title="Back to Home">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="logo" onclick="window.location.href='/'">
                <i class="fa-solid fa-cart-shopping"></i>
                <div>CART<span>PRIME</span></div>
            </div>
        </div>

        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon-left"></i>
            <input type="text" id="pageSearchInput" class="search-input" placeholder="Search products, brands and more..." autocomplete="off">
            <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Clear search">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button id="pageSearchBtn" class="search-submit-btn" title="Search">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </nav>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="controls-left">
            <h2 id="searchPageTitle" class="search-query-title">Results for "<span></span>"</h2>
            <div id="resultsCount" class="results-count">Searching verified products...</div>
        </div>
        <select id="sortSelect" class="sort-dropdown">
            <option value="relevance">Sort by: Relevance</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
        </select>
    </div>

    <!-- Quick Filter Pills -->
    <div class="filter-pills-bar" id="filterPillsBar">
        <div class="filter-pill active" data-filter="all"><i class="fa-solid fa-layer-group"></i> All Matches</div>
        <div class="filter-pill" data-filter="under_199"><i class="fa-solid fa-bolt"></i> Under ₹199</div>
        <div class="filter-pill" data-filter="under_350"><i class="fa-solid fa-wand-magic-sparkles"></i> Under ₹350</div>
        <div class="filter-pill" data-filter="under_599"><i class="fa-solid fa-gem"></i> Under ₹599</div>
        <div class="filter-pill" data-filter="in_stock"><i class="fa-solid fa-circle-check"></i> In Stock Only</div>
    </div>

    <!-- Main Results Grid -->
    <div class="main-container">
        <div id="productGrid" class="product-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVDcAN5I6Duwb0f5nAIh1sThdK6ELGDGc",
            authDomain: "cartprime-shopping.firebaseapp.com",
            projectId: "cartprime-shopping",
            storageBucket: "cartprime-shopping.firebasestorage.app",
            messagingSenderId: "570068438689",
            appId: "1:570068438689:web:17b25f49f2b561fd29eae0",
            measurementId: "G-9GREWHMEYL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        let currentQuery = urlParams.get('q') ? urlParams.get('q').toLowerCase().trim() : "";
        let activePriceFilter = "all";

        let matchingProducts = [];
        let rawAllProducts = [];

        showSkeletons();

        const searchInputEl = document.getElementById('pageSearchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        if (urlParams.get('q')) {
            const rawQuery = urlParams.get('q');
            searchInputEl.value = rawQuery;
            document.getElementById('searchPageTitle').innerHTML = `Results for "<span>${esc(rawQuery)}</span>"`;
            if (clearBtn) clearBtn.style.display = 'block';
        }

        searchInputEl.addEventListener('input', () => {
            if (clearBtn) {
                clearBtn.style.display = searchInputEl.value.trim().length > 0 ? 'block' : 'none';
            }
        });

        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                searchInputEl.value = "";
                clearBtn.style.display = 'none';
                searchInputEl.focus();
            });
        }

        if (currentQuery) {
            fetchDataAndProcess();
        } else {
            window.location.href = "/";
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function showSkeletons() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            for (let i = 0; i < 8; i++) {
                grid.innerHTML += `
                    <div class="skeleton-card">
                        <div class="skeleton-img"></div>
                        <div class="skeleton-info">
                            <div class="skeleton-line" style="width: 80%;"></div>
                            <div class="skeleton-line" style="width: 45%;"></div>
                            <div class="skeleton-line" style="width: 60%; margin-top: auto;"></div>
                            <div class="skeleton-line" style="height: 38px; border-radius: 10px;"></div>
                        </div>
                    </div>
                `;
            }
        }

        // 5 Products Click View Counter Logic
        function trackProductClickAndRedirect(productId) {
            let viewedProducts = JSON.parse(localStorage.getItem('viewedProductIds') || "[]");
            let visitCounted = localStorage.getItem('visitCounted') === 'true';

            if (!viewedProducts.includes(productId)) {
                viewedProducts.push(productId);
                localStorage.setItem('viewedProductIds', JSON.stringify(viewedProducts));
            }

            const affId = localStorage.getItem('cartPrime_affiliateId') || localStorage.getItem('referredBy');
            let destUrl = `/product-details?id=${productId}`;
            if (affId) destUrl += `&ref=${encodeURIComponent(affId)}`;

            if (viewedProducts.length >= 5 && !visitCounted) {
                const visitsRef = ref(db, 'admin/visits');
                get(visitsRef).then((snapshot) => {
                    let currentVisits = snapshot.exists() ? snapshot.val() : 0;
                    set(visitsRef, currentVisits + 1).then(() => {
                        localStorage.setItem('visitCounted', 'true');
                        window.location.href = destUrl;
                    }).catch(() => {
                        window.location.href = destUrl;
                    });
                }).catch(() => {
                    window.location.href = destUrl;
                });
            } else {
                window.location.href = destUrl;
            }
        }

        function fetchDataAndProcess() {
            onValue(ref(db, 'products'), (snapshot) => {
                rawAllProducts = [];
                snapshot.forEach(child => {
                    const data = child.val();
                    data.id = child.key;
                    rawAllProducts.push(data);
                });
                
                processSearch(rawAllProducts, currentQuery);
            });
        }

        /* ========================================================
           FIXED HIGH-PRECISION E-COMMERCE SEARCH ALGORITHM
           Matches strictly by Title, Category, or Brand
           No random products or unwanted dumps!
           ======================================================== */
        function processSearch(allProducts, searchVal) {
            if (!searchVal || searchVal.trim().length === 0) {
                matchingProducts = [];
                applySortAndRender();
                return;
            }

            const cleanSearch = searchVal.toLowerCase().trim();
            // Split into distinct words, ignoring empty tokens
            const searchWords = cleanSearch.split(/\s+/).filter(w => w.length > 0);

            // Filter out disabled products
            const activeStoreProducts = allProducts.filter(p => p.showOnHome !== false);

            matchingProducts = activeStoreProducts.filter(p => {
                const productName = (p.name || p.title || "").toLowerCase();
                const productCat = (p.category || "").toLowerCase();

                // 1. Direct whole-phrase match in name or category
                if (productName.includes(cleanSearch) || productCat.includes(cleanSearch)) {
                    return true;
                }

                // 2. All search words must be present in the title or category
                const combined = `${productName} ${productCat}`;
                const allWordsMatch = searchWords.every(word => combined.includes(word));
                if (allWordsMatch) {
                    return true;
                }

                // 3. If multi-word search, match if title contains at least main keywords (ignoring small stop words)
                if (searchWords.length > 1) {
                    const meaningfulWords = searchWords.filter(w => w.length > 2 && w !== "for" && w !== "and" && w !== "the");
                    if (meaningfulWords.length > 0) {
                        const countMatched = meaningfulWords.filter(w => productName.includes(w) || productCat.includes(w)).length;
                        // Requires at least 70% of meaningful words to match
                        if (countMatched >= Math.ceil(meaningfulWords.length * 0.7)) {
                            return true;
                        }
                    }
                }

                return false;
            });

            applySortAndRender();
        }

        // Apply Price / Filter Rules
        function filterByChipRule(list) {
            if (activePriceFilter === 'all') return list;
            const parsePrice = (p) => parseFloat((p.price || 0).toString().replace(/[^\d.]/g, ''));

            if (activePriceFilter === 'under_199') {
                return list.filter(p => parsePrice(p) <= 199);
            }
            if (activePriceFilter === 'under_350') {
                return list.filter(p => parsePrice(p) <= 350);
            }
            if (activePriceFilter === 'under_599') {
                return list.filter(p => parsePrice(p) <= 599);
            }
            if (activePriceFilter === 'in_stock') {
                return list.filter(p => p.outOfStock !== true);
            }
            return list;
        }

        function applySortAndRender() {
            const sortType = document.getElementById('sortSelect').value;
            const parsePrice = (p) => parseFloat((p.price || 0).toString().replace(/[^\d.]/g, ''));

            let filteredList = filterByChipRule([...matchingProducts]);

            if (sortType === 'price-low') {
                filteredList.sort((a, b) => parsePrice(a) - parsePrice(b));
            } else if (sortType === 'price-high') {
                filteredList.sort((a, b) => parsePrice(b) - parsePrice(a));
            }

            const totalCount = filteredList.length;
            document.getElementById('resultsCount').innerText = `${totalCount} verified product${totalCount !== 1 ? 's' : ''} found`;

            renderSearchGrid(filteredList);
        }

        function renderSearchGrid(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-magnifying-glass-arrow-right empty-icon"></i>
                        <h3>No products found for "${esc(currentQuery)}"</h3>
                        <p>We couldn't find any products matching your search term. Check your spelling or browse all store products.</p>
                        <button class="no-results-btn" onclick="window.location.href='/'"><i class="fa-solid fa-house" style="margin-right:6px;"></i> Browse Store</button>
                    </div>`;
                return;
            }

            let animationDelayIndex = 0;

            products.forEach(p => {
                const isOut = p.outOfStock === true;
                const pr = parseFloat(p.price.toString().replace(/,/g, ''));
                const mr = parseFloat(p.mrp ? p.mrp.toString().replace(/,/g, '') : pr);
                let discTag = "";
                if (mr > pr) {
                    const disc = Math.round(((mr - pr) / mr) * 100);
                    discTag = `<div class="discount-badge">${disc}% OFF</div>`;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${animationDelayIndex * 0.05}s`;
                animationDelayIndex++;

                // Real-time Reviews Listener
                const reviewRef = ref(db, `reviews/${p.id}`);
                get(reviewRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        const reviewsData = snapshot.val();
                        let totalRating = 0;
                        let count = 0;
                        for (let key in reviewsData) {
                            if (reviewsData[key].rating) {
                                totalRating += parseFloat(reviewsData[key].rating);
                                count++;
                            }
                        }
                        if (count > 0) {
                            const avgRating = (totalRating / count).toFixed(1);
                            const ratingUi = card.querySelector('.card-rating-ui');
                            if (ratingUi) {
                                ratingUi.innerHTML = `<i class="fa-solid fa-star"></i> ${avgRating} <span>(${count})</span>`;
                            }
                        }
                    }
                }).catch(() => {});

                const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/200';

                card.innerHTML = `
                    ${isOut ? '<div class="stock-badge">SOLD OUT</div>' : ''}
                    ${!isOut ? discTag : ''}
                    <div class="image-box">
                        <img src="${mainImg}" alt="${esc(p.name || 'Product')}" style="${isOut ? 'opacity: 0.45; filter: grayscale(1);' : ''}">
                        <div class="verified-tag"><i class="fa-solid fa-shield-check"></i> Quality Assured</div>
                    </div>
                    <div class="card-info">
                        <h3>${esc(p.name || 'Product Title')}</h3>
                        <div class="card-rating-ui"><i class="fa-solid fa-star" style="color:var(--star-color);"></i> 4.5 <span>(Verified)</span></div>
                        <div class="price-container">
                            <span class="price">₹${p.price}</span>
                            ${p.mrp ? `<span class="mrp">₹${p.mrp}</span>` : ''}
                        </div>
                        <button class="buy-btn" ${isOut ? 'disabled' : ''}>
                            <i class="fa-solid fa-cart-shopping"></i> ${isOut ? 'Unavailable' : 'View Product'}
                        </button>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (isOut) return;
                    trackProductClickAndRedirect(p.id);
                });

                grid.appendChild(card);
            });
        }

        // Filter Pills Event Listeners
        document.querySelectorAll('.filter-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                activePriceFilter = pill.getAttribute('data-filter');
                applySortAndRender();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', applySortAndRender);

        function executeNewSearch() {
            const newVal = document.getElementById('pageSearchInput').value.trim();
            if (newVal.toLowerCase() === "cartecom@com") {
                window.location.href = "/admin";
                return;
            }
            if (newVal.length >= 1) {
                window.location.href = `/search?q=${encodeURIComponent(newVal)}`;
            }
        }

        document.getElementById('pageSearchBtn').addEventListener('click', executeNewSearch);
        document.getElementById('pageSearchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executeNewSearch();
            }
        });
    </script>
</body>
</html>
